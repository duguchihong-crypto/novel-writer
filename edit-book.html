<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>编辑小说</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f8fa;

    color: #222;

    min-height: 100vh;
}


/* ==================================================
   顶部
================================================== */

.top-bar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 64px;

    background: #fff;

    border-bottom:
        1px solid #e8e8e8;

    display: flex;

    align-items: center;

    padding:
        0 20px;

    z-index: 100;
}


.back-button {

    border: none;

    background: none;

    color: #555;

    font-family: inherit;

    font-size: 15px;

    cursor: pointer;

    padding:
        8px 4px;
}


.back-button:active {

    opacity: 0.6;
}


.page-title {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 17px;

    font-weight: 600;

    white-space: nowrap;
}


/* ==================================================
   页面
================================================== */

.page {

    min-height: 100vh;

    padding:
        104px 20px 50px;
}


.container {

    width: 100%;

    max-width: 560px;

    margin: 0 auto;
}


.main-title {

    font-size: 28px;

    font-weight: 700;

    margin-bottom: 8px;
}


.sub-title {

    font-size: 14px;

    color: #888;

    margin-bottom: 32px;

    line-height: 1.6;
}


/* ==================================================
   表单区域
================================================== */

.form-section {

    background: #fff;

    border:
        1px solid #e7e8eb;

    border-radius: 14px;

    padding: 22px;

    margin-bottom: 18px;
}


.form-label {

    display: block;

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 10px;
}


/* ==================================================
   书名
================================================== */

.title-input {

    width: 100%;

    height: 48px;

    border:
        1px solid #dfe2e7;

    border-radius: 9px;

    padding:
        0 14px;

    outline: none;

    font-family: inherit;

    font-size: 16px;

    color: #222;

    background: #fff;

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}


.title-input:focus {

    border-color: #4f7cff;

    box-shadow:
        0 0 0 3px
        rgba(79,124,255,0.10);
}


/* ==================================================
   简介
================================================== */

.description-input {

    width: 100%;

    min-height: 140px;

    resize: vertical;

    border:
        1px solid #dfe2e7;

    border-radius: 9px;

    padding:
        12px 14px;

    outline: none;

    font-family: inherit;

    font-size: 15px;

    line-height: 1.6;

    color: #222;

    background: #fff;

    transition:
        border-color 0.2s,
        box-shadow 0.2s;
}


.description-input:focus {

    border-color: #4f7cff;

    box-shadow:
        0 0 0 3px
        rgba(79,124,255,0.10);
}


/* ==================================================
   封面
================================================== */

.cover-section {

    display: flex;

    flex-direction: column;

    align-items: center;
}


.cover-preview {

    width: 180px;

    height: 240px;

    border-radius: 10px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #eef1f5,
            #dfe4eb
        );

    border:
        1px solid #e0e3e8;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 18px;
}


.cover-preview img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


.cover-placeholder {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #a5acb6;

    text-align: center;
}


.cover-placeholder-icon {

    font-size: 42px;

    margin-bottom: 10px;
}


.cover-placeholder-text {

    font-size: 14px;
}


#coverInput {

    display: none;
}


.cover-upload-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 150px;

    height: 44px;

    padding:
        0 18px;

    border: none;

    border-radius: 9px;

    background: #eef0f4;

    color: #333;

    font-family: inherit;

    font-size: 14px;

    cursor: pointer;

    transition:
        background 0.2s;
}


.cover-upload-button:hover {

    background: #e5e8ed;
}


.cover-upload-button:active {

    transform: scale(0.98);
}


.remove-cover-button {

    margin-top: 10px;

    border: none;

    background: none;

    color: #999;

    font-family: inherit;

    font-size: 13px;

    cursor: pointer;

    padding: 5px 8px;
}


.remove-cover-button:hover {

    color: #e5484d;
}


.cover-hint {

    margin-top: 12px;

    font-size: 12px;

    color: #999;

    text-align: center;

    line-height: 1.6;
}


/* ==================================================
   错误 / 提示
================================================== */

.error-message {

    min-height: 20px;

    margin:
        8px 0;

    color: #e5484d;

    font-size: 13px;

    text-align: center;

    line-height: 1.5;
}


/* ==================================================
   保存
================================================== */

.save-button {

    width: 100%;

    height: 50px;

    border: none;

    border-radius: 10px;

    background: #4f7cff;

    color: #fff;

    font-family: inherit;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.1s;
}


.save-button:hover {

    background: #3d68e6;
}


.save-button:active {

    transform: scale(0.99);
}


.save-button:disabled {

    background: #aeb8d2;

    cursor: not-allowed;

    transform: none;
}


/* ==================================================
   手机
================================================== */

@media (max-width: 600px) {

    .top-bar {

        padding:
            0 14px;
    }


    .page {

        padding:
            94px 14px 35px;
    }


    .main-title {

        font-size: 25px;
    }


    .sub-title {

        margin-bottom: 25px;
    }


    .form-section {

        padding: 18px;

        border-radius: 12px;
    }


    .cover-preview {

        width: 160px;

        height: 214px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     顶部
================================================== -->

<header class="top-bar">

    <button
        id="backButton"
        class="back-button"
        type="button"
    >
        ← 返回
    </button>


    <div class="page-title">
        编辑小说
    </div>

</header>


<!-- ==================================================
     页面
================================================== -->

<main class="page">

    <div class="container">


        <h1 class="main-title">
            编辑小说
        </h1>


        <p class="sub-title">
            修改小说的名称、简介和封面。
        </p>


        <!-- ==================================================
             小说名称
        ================================================== -->

        <section class="form-section">

            <label
                class="form-label"
                for="bookTitle"
            >
                小说名称
            </label>


            <input
                id="bookTitle"
                class="title-input"
                type="text"
                maxlength="100"
                placeholder="请输入小说名称"
                autocomplete="off"
            >

        </section>


        <!-- ==================================================
             小说简介
        ================================================== -->

        <section class="form-section">

            <label
                class="form-label"
                for="bookDescription"
            >
                小说简介
            </label>


            <textarea
                id="bookDescription"
                class="description-input"
                maxlength="2000"
                placeholder="请输入小说简介"
            ></textarea>

        </section>


        <!-- ==================================================
             小说封面
        ================================================== -->

        <section class="form-section cover-section">

            <label class="form-label">
                小说封面
            </label>


            <div
                class="cover-preview"
                id="coverPreview"
            >

                <div
                    id="coverPlaceholder"
                    class="cover-placeholder"
                >

                    <div class="cover-placeholder-icon">
                        🖼️
                    </div>


                    <div class="cover-placeholder-text">
                        暂无封面
                    </div>

                </div>


                <img
                    id="coverImage"
                    src=""
                    alt="小说封面"
                    style="display:none;"
                >

            </div>


            <input
                id="coverInput"
                type="file"
                accept="image/*"
            >


            <label
                for="coverInput"
                class="cover-upload-button"
            >
                🖼️ 更换封面
            </label>


            <button
                id="removeCoverButton"
                class="remove-cover-button"
                type="button"
            >
                删除封面
            </button>


            <div class="cover-hint">

                支持手机中的图片。

                <br>

                图片会自动压缩。

                <br>

                更换后点击「保存修改」。

            </div>

        </section>


        <!-- ==================================================
             错误
        ================================================== -->

        <div
            id="errorMessage"
            class="error-message"
        ></div>


        <!-- ==================================================
             保存
        ================================================== -->

        <button
            id="saveButton"
            class="save-button"
            type="button"
        >
            保存修改
        </button>

    </div>

</main>


<script>


// ==================================================
// DOM
// ==================================================

const bookTitleInput =
    document.getElementById(
        "bookTitle"
    );


const descriptionInput =
    document.getElementById(
        "bookDescription"
    );


const coverInput =
    document.getElementById(
        "coverInput"
    );


const coverImage =
    document.getElementById(
        "coverImage"
    );


const coverPlaceholder =
    document.getElementById(
        "coverPlaceholder"
    );


const removeCoverButton =
    document.getElementById(
        "removeCoverButton"
    );


const saveButton =
    document.getElementById(
        "saveButton"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


let currentBook = null;

let selectedCover = "";

let isProcessingCover = false;

let isSaving = false;


// ==================================================
// 显示错误
// ==================================================

function showError(message) {

    errorMessage.textContent =
        message;

}


// ==================================================
// 清除错误
// ==================================================

function clearError() {

    errorMessage.textContent =
        "";

}


// ==================================================
// 恢复保存按钮
// ==================================================

function resetSaveButton() {

    isSaving = false;

    saveButton.disabled =
        false;

    saveButton.textContent =
        "保存修改";

}


// ==================================================
// 获取当前小说
// ==================================================

function loadCurrentBook() {

    const currentBookId =
        localStorage.getItem(
            "currentBookId"
        );


    if (!currentBookId) {

        showError(
            "没有找到要编辑的小说。"
        );

        saveButton.disabled =
            true;

        return null;

    }


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    if (!savedBooks) {

        showError(
            "没有找到小说数据。"
        );

        saveButton.disabled =
            true;

        return null;

    }


    let books;


    try {

        books =
            JSON.parse(
                savedBooks
            );

    } catch (error) {

        console.error(
            "读取小说失败：",
            error
        );

        showError(
            "小说数据读取失败。"
        );

        saveButton.disabled =
            true;

        return null;

    }


    if (!Array.isArray(books)) {

        showError(
            "小说数据格式错误。"
        );

        saveButton.disabled =
            true;

        return null;

    }


    const book =
        books.find(
            function(item) {

                return String(item.id) ===
                    String(currentBookId);

            }
        );


    if (!book) {

        showError(
            "没有找到这本小说。"
        );

        saveButton.disabled =
            true;

        return null;

    }


    return book;

}


// ==================================================
// 显示小说资料
// ==================================================

function renderBook() {

    if (!currentBook) {

        return;

    }


    bookTitleInput.value =
        currentBook.title || "";


    descriptionInput.value =
        currentBook.description || "";


    if (
        typeof currentBook.cover === "string" &&
        currentBook.cover.length > 0
    ) {

        selectedCover =
            currentBook.cover;

        showCover(
            selectedCover
        );

    } else {

        selectedCover =
            "";

        showEmptyCover();

    }

}


// ==================================================
// 显示封面
// ==================================================

function showCover(dataURL) {

    coverImage.src =
        dataURL;

    coverImage.style.display =
        "block";

    coverPlaceholder.style.display =
        "none";

}


// ==================================================
// 显示默认封面
// ==================================================

function showEmptyCover() {

    coverImage.src =
        "";

    coverImage.style.display =
        "none";

    coverPlaceholder.style.display =
        "flex";

}


// ==================================================
// 图片读取
// ==================================================

coverInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files &&
            event.target.files[0];


        if (!file) {

            return;

        }


        clearError();


        if (
            !file.type ||
            !file.type.startsWith("image/")
        ) {

            showError(
                "请选择图片文件。"
            );

            coverInput.value =
                "";

            return;

        }


        if (isProcessingCover) {

            return;

        }


        isProcessingCover =
            true;


        saveButton.disabled =
            true;

        saveButton.textContent =
            "正在处理封面…";


        const reader =
            new FileReader();


        reader.onload =
            function() {

                const dataURL =
                    reader.result;


                if (
                    typeof dataURL !==
                    "string"
                ) {

                    finishCoverProcessing(
                        "",
                        "读取封面失败，请重新选择图片。"
                    );

                    return;

                }


                compressImage(
                    dataURL,
                    function(compressed) {

                        if (!compressed) {

                            finishCoverProcessing(
                                "",
                                "封面处理失败，请换一张图片。"
                            );

                            return;

                        }


                        selectedCover =
                            compressed;


                        showCover(
                            compressed
                        );


                        finishCoverProcessing(
                            compressed,
                            ""
                        );

                    }
                );

            };


        reader.onerror =
            function() {

                finishCoverProcessing(
                    "",
                    "读取封面失败，请重新选择图片。"
                );

            };


        reader.readAsDataURL(file);

    }
);


// ==================================================
// 完成封面处理
// ==================================================

function finishCoverProcessing(
    result,
    error
) {

    isProcessingCover =
        false;


    coverInput.value =
        "";


    if (error) {

        showError(error);

    }


    resetSaveButton();

}


// ==================================================
// 删除封面
// ==================================================

removeCoverButton.addEventListener(
    "click",
    function() {

        if (isProcessingCover) {

            return;

        }


        selectedCover =
            "";

        coverInput.value =
            "";

        showEmptyCover();

        clearError();

    }
);


// ==================================================
// 压缩图片
// ==================================================

function compressImage(
    dataURL,
    callback
) {

    const image =
        new Image();


    image.onload =
        function() {

            let width =
                image.naturalWidth ||
                image.width;


            let height =
                image.naturalHeight ||
                image.height;


            if (
                !width ||
                !height
            ) {

                callback("");

                return;

            }


            /*
             * 小说封面没有必要保存原始大尺寸。
             *
             * 最大边限制为 900px。
             */

            const maxSize =
                900;


            if (
                width > maxSize ||
                height > maxSize
            ) {

                if (
                    width >= height
                ) {

                    height =
                        Math.max(
                            1,
                            Math.round(
                                height *
                                maxSize /
                                width
                            )
                        );

                    width =
                        maxSize;

                } else {

                    width =
                        Math.max(
                            1,
                            Math.round(
                                width *
                                maxSize /
                                height
                            )
                        );

                    height =
                        maxSize;

                }

            }


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                width;

            canvas.height =
                height;


            const context =
                canvas.getContext(
                    "2d"
                );


            if (!context) {

                callback("");

                return;

            }


            /*
             * JPEG 背景使用白色。
             */

            context.fillStyle =
                "#ffffff";


            context.fillRect(
                0,
                0,
                width,
                height
            );


            context.drawImage(
                image,
                0,
                0,
                width,
                height
            );


            /*
             * 按质量逐步压缩。
             *
             * 目标：
             * 尽量控制在约 450KB Data URL 内。
             */

            const qualities = [
                0.72,
                0.60,
                0.50,
                0.42,
                0.35
            ];


            compressCanvasQuality(
                canvas,
                qualities,
                0,
                callback
            );

        };


    image.onerror =
        function() {

            callback("");

        };


    image.src =
        dataURL;

}


// ==================================================
// 逐级压缩
// ==================================================

function compressCanvasQuality(
    canvas,
    qualities,
    index,
    callback
) {

    if (
        index >= qualities.length
    ) {

        /*
         * 如果已经达到最低质量，
         * 再缩小尺寸一次。
         */

        resizeCanvasAndCompress(
            canvas,
            callback
        );

        return;

    }


    const quality =
        qualities[index];


    canvas.toBlob(
        function(blob) {

            if (!blob) {

                callback("");

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function() {

                    const result =
                        reader.result;


                    if (
                        typeof result !==
                        "string"
                    ) {

                        callback("");

                        return;

                    }


                    /*
                     * Data URL 字符串控制在
                     * 大约 450000 字符以内。
                     */

                    if (
                        result.length <=
                        450000
                    ) {

                        callback(
                            result
                        );

                        return;

                    }


                    compressCanvasQuality(
                        canvas,
                        qualities,
                        index + 1,
                        callback
                    );

                };


            reader.onerror =
                function() {

                    callback("");

                };


            reader.readAsDataURL(blob);

        },
        "image/jpeg",
        quality
    );

}


// ==================================================
// 最后一级：进一步缩小尺寸
// ==================================================

function resizeCanvasAndCompress(
    canvas,
    callback
) {

    const oldWidth =
        canvas.width;


    const oldHeight =
        canvas.height;


    const scale =
        0.75;


    const newWidth =
        Math.max(
            1,
            Math.round(
                oldWidth * scale
            )
        );


    const newHeight =
        Math.max(
            1,
            Math.round(
                oldHeight * scale
            )
        );


    const newCanvas =
        document.createElement(
            "canvas"
        );


    newCanvas.width =
        newWidth;

    newCanvas.height =
        newHeight;


    const context =
        newCanvas.getContext(
            "2d"
        );


    if (!context) {

        callback("");

        return;

    }


    context.fillStyle =
        "#ffffff";


    context.fillRect(
        0,
        0,
        newWidth,
        newHeight
    );


    context.drawImage(
        canvas,
        0,
        0,
        newWidth,
        newHeight
    );


    newCanvas.toBlob(
        function(blob) {

            if (!blob) {

                callback("");

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function() {

                    if (
                        typeof reader.result !==
                        "string"
                    ) {

                        callback("");

                        return;

                    }


                    callback(
                        reader.result
                    );

                };


            reader.onerror =
                function() {

                    callback("");

                };


            reader.readAsDataURL(blob);

        },
        "image/jpeg",
        0.38
    );

}


// ==================================================
// 判断是否为储存空间不足
// ==================================================

function isQuotaError(error) {

    if (!error) {

        return false;

    }


    return (
        error.name ===
            "QuotaExceededError" ||

        error.code === 22 ||

        error.code === 1014 ||

        error.name ===
            "NS_ERROR_DOM_QUOTA_REACHED"
    );

}


// ==================================================
// 保存修改
// ==================================================

saveButton.addEventListener(
    "click",
    function() {

        if (isSaving) {

            return;

        }


        if (isProcessingCover) {

            showError(
                "封面还在处理中，请稍等。"
            );

            return;

        }


        if (!currentBook) {

            showError(
                "没有可以保存的小说。"
            );

            return;

        }


        const title =
            bookTitleInput.value.trim();


        if (!title) {

            showError(
                "小说名称不能为空。"
            );

            bookTitleInput.focus();

            return;

        }


        clearError();


        isSaving =
            true;


        saveButton.disabled =
            true;

        saveButton.textContent =
            "正在保存…";


        /*
         * 不直接修改 currentBook。
         *
         * 先复制一份，
         * 保存成功后再完成替换。
         *
         * 这样即使 localStorage 保存失败，
         * 原来的小说数据也不会被当前页面
         * 的修改污染。
         */

        const updatedBook =
            {
                ...currentBook,

                title:
                    title,

                description:
                    descriptionInput.value.trim(),

                cover:
                    selectedCover || ""
            };


        let books;


        try {

            const savedBooks =
                localStorage.getItem(
                    "novelBooks"
                );


            books =
                savedBooks
                    ? JSON.parse(
                        savedBooks
                    )
                    : [];

        } catch (error) {

            console.error(
                "读取书籍数据失败：",
                error
            );

            showError(
                "读取书籍数据失败，请重新打开页面。"
            );

            resetSaveButton();

            return;

        }


        if (!Array.isArray(books)) {

            showError(
                "小说数据格式错误。"
            );

            resetSaveButton();

            return;

        }


        const index =
            books.findIndex(
                function(book) {

                    return String(book.id) ===
                        String(currentBook.id);

                }
            );


        if (index === -1) {

            showError(
                "没有找到这本小说。"
            );

            resetSaveButton();

            return;

        }


        /*
         * 保留原小说的所有其他数据。
         *
         * 例如：
         *
         * structure
         * layoutDirection
         * bookPosition
         * id
         */

        books[index] =
            updatedBook;


        const newStorageData =
            JSON.stringify(
                books
            );


        try {

            localStorage.setItem(
                "novelBooks",
                newStorageData
            );

        } catch (error) {

            console.error(
                "保存修改失败：",
                error
            );


            if (
                isQuotaError(error)
            ) {

                showError(
                    "保存失败：浏览器储存空间不足。请删除旧小说的封面，或换一张更小的图片。"
                );

            } else {

                showError(
                    "保存失败，请重新尝试。"
                );

            }


            resetSaveButton();

            return;

        }


        /*
         * 保存成功。
         */

        currentBook =
            updatedBook;


        window.location.href =
            "index.html";

    }
);


// ==================================================
// 返回
// ==================================================

document.getElementById(
    "backButton"
).addEventListener(
    "click",
    function() {

        if (isProcessingCover) {

            showError(
                "封面正在处理，请稍等。"
            );

            return;

        }


        window.location.href =
            "index.html";

    }
);


// ==================================================
// 初始化
// ==================================================

currentBook =
    loadCurrentBook();


if (currentBook) {

    renderBook();

}

</script>
