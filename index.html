<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>我的书架</title>

    <link
        rel="stylesheet"
        href="css/shelf.css"
    >

</head>


<body>


<header class="top-bar">

    <div class="logo">
        我的书架
    </div>

    <div class="top-actions">

        <button
            id="finishSortButton"
            class="finish-sort-button"
            type="button"
        >
            完成
        </button>

        <button
            id="createButton"
            class="create-button"
            type="button"
        >
            ＋ 新建
        </button>

        <button
            id="settingsButton"
            class="settings-button"
            type="button"
        >
            ⚙ 设置
        </button>

    </div>

</header>


<!-- 新建菜单 -->

<div
    id="createMenu"
    class="menu create-menu"
>

    <button
        id="createBookButton"
        type="button"
    >
        📖 新建书籍
    </button>

    <button
        id="createCollectionButton"
        type="button"
    >
        📚 新建组合
    </button>

</div>


<!-- 设置菜单 -->

<div
    id="settingsMenu"
    class="menu settings-menu"
>

    <button
        id="sortBooksButton"
        type="button"
    >
        ↕ 排序
    </button>

    <button
        id="gridButton"
        type="button"
    >
        ▦ 网格
    </button>

    <button
        id="listButton"
        type="button"
    >
        ☰ 列表
    </button>

</div>


<main class="container">


    <div
        id="sortHint"
        class="sort-hint"
    >
        拖动书籍调整书架顺序
    </div>


    <div
        id="emptyShelf"
        class="empty-shelf"
    >

        <div class="empty-icon">
            📚
        </div>

        <div class="empty-title">
            书架还是空的
        </div>

        <div class="empty-text">
            点击「＋ 新建」开始创作
        </div>

    </div>


    <div
        id="bookGrid"
        class="book-grid"
    ></div>


</main>


<!-- 长按遮罩 -->

<div
    id="bookMenuOverlay"
    class="book-menu-overlay"
></div>


<!-- 长按菜单 -->

<div
    id="bookContextMenu"
    class="book-context-menu"
>

    <div
        id="contextMenuTitle"
        class="context-menu-title"
    >
        小说
    </div>


    <button
        id="contextEdit"
        class="context-menu-button"
        type="button"
    >

        <span class="context-menu-icon">
            ✏️
        </span>

        <span>
            编辑
        </span>

    </button>


    <button
        id="contextSort"
        class="context-menu-button"
        type="button"
    >

        <span class="context-menu-icon">
            ↕️
        </span>

        <span>
            书架排序
        </span>

    </button>


    <button
        id="contextGroup"
        class="context-menu-button"
        type="button"
    >

        <span class="context-menu-icon">
            📁
        </span>

        <span>
            移至分组
        </span>

    </button>


    <button
        id="contextDelete"
        class="context-menu-button delete-action"
        type="button"
    >

        <span class="context-menu-icon">
            🗑️
        </span>

        <span>
            删除书籍
        </span>

    </button>

</div>


<!-- 底部导航 -->

<nav class="bottom-nav">

    <button
        id="shelfNav"
        class="active"
        type="button"
    >
        📚 书架
    </button>

    <button
        id="toolsNav"
        type="button"
    >
        🧰 工具
    </button>

    <button
        id="meNav"
        type="button"
    >
        👤 我的
    </button>

</nav>


<!-- JS -->

<script
    src="js/shelf/shelf-state.js"
></script>

<script
    src="js/shelf/shelf-storage.js"
></script>

<script
    src="js/shelf/shelf-render.js"
></script>

<script
    src="js/shelf/shelf-events.js?v=3"
></script>


</body>

</html>
