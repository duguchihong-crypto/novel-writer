<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的书架</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f8fa;
    color: #222;

    min-height: 100vh;

    padding-top: 72px;
    padding-bottom: 70px;
}

/* =========================
   顶部
========================= */

.top-bar {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 72px;

    background: #fff;

    border-bottom: 1px solid #e8e8e8;

    display: flex;
    align-items: center;

    padding: 0 20px;

    z-index: 100;
}

.logo {
    font-size: 20px;
    font-weight: 700;
}

/* 右侧按钮 */

.top-actions {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 10px;
}

.create-button,
.settings-button {
    border: none;

    border-radius: 9px;

    padding: 10px 14px;

    font-size: 14px;

    cursor: pointer;
}

.create-button {
    background: #4f7cff;
    color: #fff;
}

.settings-button {
    background: #eef0f4;
    color: #333;
}

/* =========================
   菜单
========================= */

.menu {
    display: none;

    position: fixed;

    top: 62px;

    width: 170px;

    background: #fff;

    border: 1px solid #e5e5e5;

    border-radius: 10px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.08);

    overflow: hidden;

    z-index: 200;
}

.create-menu {
    right: 100px;
}

.settings-menu {
    right: 24px;
}

.menu button {
    width: 100%;

    border: none;

    background: #fff;

    padding: 13px 15px;

    text-align: left;

    font-size: 14px;

    cursor: pointer;
}

.menu button:hover {
    background: #f5f6f8;
}

/* =========================
   主内容
========================= */

.container {
    max-width: 1000px;

    margin: 40px auto;

    padding: 0 20px;
}

/* =========================
   空书架
========================= */

.empty-shelf {
    text-align: center;

    padding-top: 120px;

    color: #888;
}

.empty-icon {
    font-size: 42px;

    margin-bottom: 18px;
}

.empty-title {
    font-size: 18px;

    font-weight: 600;

    color: #444;

    margin-bottom: 8px;
}

.empty-text {
    font-size: 14px;

    color: #999;
}

/* =========================
   书架
========================= */

.book-grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 22px;
}

.book-card {
    position: relative;

    background: #fff;

    border-radius: 12px;

    overflow: hidden;

    cursor: pointer;

    border: 1px solid #e8e8e8;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.book-card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 22px rgba(0,0,0,0.08);
}

/* =========================
   删除按钮
========================= */

.delete-book-button {
    position: absolute;

    top: 9px;
    right: 9px;

    width: 34px;
    height: 34px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.94);

    color: #777;

    font-size: 17px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 10;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.12);

    transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
}

.delete-book-button:hover {
    background: #fff0f0;

    color: #e5484d;

    transform: scale(1.05);
}

.delete-book-button:active {
    transform: scale(0.95);
}

/* =========================
   封面
========================= */

.book-cover {
    width: 100%;

    aspect-ratio: 3 / 4;

    background: #eef0f4;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}

.book-cover img {
    width: 100%;

    height: 100%;

    object-fit: cover;
}

.default-cover {
    font-size: 42px;

    color: #aeb4bd;
}

.book-info {
    padding: 14px;
}

.book-title {
    font-size: 16px;

    font-weight: 700;

    margin-bottom: 7px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.book-description {
    font-size: 13px;

    color: #888;

    line-height: 1.5;

    height: 39px;

    overflow: hidden;

    margin-bottom: 10px;
}

.book-meta {
    font-size: 12px;

    color: #aaa;
}

/* =========================
   底部导航
========================= */

.bottom-nav {
    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    height: 68px;

    background: #fff;

    border-top: 1px solid #e8e8e8;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 100;
}

.bottom-nav button {
    border: none;

    background: none;

    color: #777;

    font-size: 13px;

    cursor: pointer;

    padding: 8px 20px;
}

.bottom-nav button.active {
    color: #4f7cff;

    font-weight: 600;
}

/* =========================
   手机
========================= */

@media (max-width: 600px) {

    .top-bar {
        padding: 0 14px;
    }

    .logo {
        font-size: 19px;
    }

    .create-button,
    .settings-button {
        padding: 9px 11px;

        font-size: 13px;
    }

    .create-menu {
        right: 82px;
    }

    .settings-menu {
        right: 14px;
    }

    .container {
        padding: 0 14px;
    }

    .book-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 14px;
    }

    .book-info {
        padding: 11px;
    }

    .book-title {
        font-size: 15px;
    }

    .empty-shelf {
        padding-top: 100px;
    }

    .bottom-nav {
        height: 64px;
    }

    .bottom-nav button {
        padding: 8px 12px;
    }

    .delete-book-button {
        width: 32px;
        height: 32px;

        top: 7px;
        right: 7px;
    }
}
</style>
</head>

<body>

<!-- =========================
     顶部
========================= -->

<header class="top-bar">

    <div class="logo">
        我的书架
    </div>

    <div class="top-actions">

        <button
            class="create-button"
            onclick="toggleCreateMenu()">
            ＋ 新建
        </button>

        <button
            class="settings-button"
            onclick="toggleSettingsMenu()">
            ⚙ 设置
        </button>

    </div>

</header>


<!-- =========================
     新建菜单
========================= -->

<div
    id="createMenu"
    class="menu create-menu">

    <button onclick="createBook()">
        📖 新建书籍
    </button>

    <button onclick="createCollection()">
        📚 新建组合
    </button>

</div>


<!-- =========================
     设置菜单
========================= -->

<div
    id="settingsMenu"
    class="menu settings-menu">

    <button onclick="sortBooks()">
        ↕ 排序
    </button>

    <button onclick="setGrid()">
        ▦ 网格
    </button>

    <button onclick="setList()">
        ☰ 列表
    </button>

</div>


<!-- =========================
     主内容
========================= -->

<main class="container">

    <!-- 空书架 -->

    <div
        id="emptyShelf"
        class="empty-shelf">

        <div class="empty-icon">
            📚
        </div>

        <div class="empty-title">
            书架还是空的
        </div>

        <div class="empty-text">
            点击「＋ 新建」开始创作
        </div>

    </div>


    <!-- 书籍列表 -->

    <div
        id="bookGrid"
        class="book-grid"
        style="display:none;">
    </div>

</main>


<!-- =========================
     底部导航
========================= -->

<nav class="bottom-nav">

    <button
        class="active"
        onclick="goShelf()">
        📚 书架
    </button>

    <button onclick="goTools()">
        🧰 工具
    </button>

    <button onclick="goMe()">
        👤 我的
    </button>

</nav>


<script>

/* =========================
   菜单
========================= */

function toggleCreateMenu() {

    const createMenu =
        document.getElementById("createMenu");

    const settingsMenu =
        document.getElementById("settingsMenu");


    settingsMenu.style.display = "none";


    createMenu.style.display =
        createMenu.style.display === "block"
        ? "none"
        : "block";
}


function toggleSettingsMenu() {

    const createMenu =
        document.getElementById("createMenu");

    const settingsMenu =
        document.getElementById("settingsMenu");


    createMenu.style.display = "none";


    settingsMenu.style.display =
        settingsMenu.style.display === "block"
        ? "none"
        : "block";
}


/* =========================
   新建书籍
========================= */

function createBook() {

    closeMenus();

    window.location.href =
        "create-book.html";
}


function createCollection() {

    closeMenus();

    alert("新建组合功能还在制作中");
}


/* =========================
   读取书籍
========================= */

function loadBooks() {

    const savedBooks =
        localStorage.getItem("novelBooks");


    let books = [];


    try {

        books =
            savedBooks
            ? JSON.parse(savedBooks)
            : [];

    } catch (error) {

        console.error(
            "读取书籍数据失败：",
            error
        );

        books = [];
    }


    const emptyShelf =
        document.getElementById(
            "emptyShelf"
        );


    const bookGrid =
        document.getElementById(
            "bookGrid"
        );


    /* =========================
       没有书
    ========================= */

    if (books.length === 0) {

        emptyShelf.style.display =
            "block";

        bookGrid.style.display =
            "none";

        bookGrid.innerHTML =
            "";

        return;
    }


    /* =========================
       有书
    ========================= */

    emptyShelf.style.display =
        "none";


    bookGrid.style.display =
        "grid";


    bookGrid.innerHTML =
        "";


    books.forEach(function(book) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "book-card";


        /*
         * 点击书籍卡片
         * 进入全书页面
         */

        card.onclick =
            function() {

                openBook(
                    book.id
                );

            };


        /* =========================
           封面
        ========================= */

        let coverHTML =
            "";


        if (book.cover) {

            coverHTML = `
                <img
                    src="${book.cover}"
                    alt="书籍封面">
            `;

        } else {

            coverHTML = `
                <div class="default-cover">
                    📖
                </div>
            `;

        }


        /* =========================
           书籍卡片
        ========================= */

        card.innerHTML = `

            <!-- 删除按钮 -->

            <button
                class="delete-book-button"
                type="button"
                title="删除书籍"
                aria-label="删除书籍"
                onclick="deleteBook(event, '${book.id}')">
                🗑
            </button>


            <!-- 封面 -->

            <div class="book-cover">
                ${coverHTML}
            </div>


            <!-- 信息 -->

            <div class="book-info">

                <div class="book-title">
                    ${escapeHTML(
                        book.title
                    )}
                </div>

                <div class="book-description">
                    ${escapeHTML(
                        book.description ||
                        "暂无简介"
                    )}
                </div>

                <div class="book-meta">
                    ${book.chapters || 0} 章
                    ·
                    ${book.words || 0} 字
                </div>

            </div>

        `;


        bookGrid.appendChild(
            card
        );

    });
}


/* =========================
   删除书籍
========================= */

function deleteBook(
    event,
    bookId
) {

    /*
     * 阻止点击删除按钮
     * 同时触发书籍卡片的打开事件
     */

    event.stopPropagation();


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    let books = [];


    try {

        books =
            savedBooks
            ? JSON.parse(savedBooks)
            : [];

    } catch (error) {

        console.error(
            "读取书籍失败：",
            error
        );

        return;
    }


    /* 找到要删除的书 */

    const book =
        books.find(
            function(item) {

                return String(item.id) ===
                    String(bookId);

            }
        );


    if (!book) {

        return;
    }


    /* =========================
       二次确认
    ========================= */

    const confirmed =
        confirm(
            "确定要删除《" +
            book.title +
            "》吗？\n\n" +
            "删除后，这本书及其全书结构将无法恢复。"
        );


    if (!confirmed) {

        return;
    }


    /* =========================
       删除
    ========================= */

    books =
        books.filter(
            function(item) {

                return String(item.id) !==
                    String(bookId);

            }
        );


    /*
     * 保存新的书架数据
     */

    localStorage.setItem(
        "novelBooks",
        JSON.stringify(books)
    );


    /*
     * 如果删除的是当前正在打开的书
     * 清除 currentBookId
     */

    const currentBookId =
        localStorage.getItem(
            "currentBookId"
        );


    if (
        currentBookId &&
        String(currentBookId) ===
        String(bookId)
    ) {

        localStorage.removeItem(
            "currentBookId"
        );

    }


    /*
     * 重新加载书架
     */

    loadBooks();
}


/* =========================
   防止文字破坏页面
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   打开书籍
========================= */

function openBook(id) {

    /*
     * 保存当前打开的书籍
     */

    localStorage.setItem(
        "currentBookId",
        id
    );


    /*
     * 进入全书页面
     */

    window.location.href =
        "book.html";
}


/* =========================
   设置
========================= */

function sortBooks() {

    closeMenus();

    alert(
        "排序功能\n\n" +
        "• 最近创建\n" +
        "• 最近修改\n" +
        "• 书名字母"
    );
}


function setGrid() {

    closeMenus();

    alert(
        "当前已经是网格视图"
    );
}


function setList() {

    closeMenus();

    alert(
        "列表视图功能还在制作中"
    );
}


/* =========================
   底部导航
========================= */

function goShelf() {

    window.location.href =
        "index.html";
}


function goTools() {

    alert(
        "工具页面还在制作中"
    );
}


function goMe() {

    alert(
        "我的页面还在制作中"
    );
}


/* =========================
   关闭菜单
========================= */

function closeMenus() {

    document.getElementById(
        "createMenu"
    ).style.display =
        "none";


    document.getElementById(
        "settingsMenu"
    ).style.display =
        "none";
}


/* =========================
   点击其他地方关闭菜单
========================= */

document.addEventListener(
    "click",
    function(event) {

        const createMenu =
            document.getElementById(
                "createMenu"
            );


        const settingsMenu =
            document.getElementById(
                "settingsMenu"
            );


        if (
            !event.target.closest(
                ".create-button"
            ) &&
            !event.target.closest(
                ".create-menu"
            )
        ) {

            createMenu.style.display =
                "none";
        }


        if (
            !event.target.closest(
                ".settings-button"
            ) &&
            !event.target.closest(
                ".settings-menu"
            )
        ) {

            settingsMenu.style.display =
                "none";
        }

    }
);


/* =========================
   页面打开时读取书籍
========================= */

loadBooks();

</script>

</body>
</html>
