<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>我的书架</title>


<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;
}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f8fa;

    color: #222;

    min-height: 100vh;

    padding-top: 72px;

    padding-bottom: 70px;
}


/* ==================================================
   顶部
================================================== */

.top-bar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 72px;

    background: #fff;

    border-bottom:
        1px solid #e8e8e8;

    display: flex;

    align-items: center;

    padding: 0 20px;

    z-index: 100;
}


.logo {

    font-size: 20px;

    font-weight: 700;
}


.top-actions {

    margin-left: auto;

    display: flex;

    align-items: center;

    gap: 10px;
}


.create-button,
.settings-button {

    border: none;

    border-radius: 9px;

    padding: 10px 14px;

    font-family: inherit;

    font-size: 14px;

    cursor: pointer;
}


.create-button {

    background: #4f7cff;

    color: #fff;
}


.settings-button {

    background: #eef0f4;

    color: #333;
}


.create-button:active,
.settings-button:active {

    transform: scale(0.97);
}


/* ==================================================
   菜单
================================================== */

.menu {

    display: none;

    position: fixed;

    top: 62px;

    width: 170px;

    background: #fff;

    border:
        1px solid #e5e5e5;

    border-radius: 10px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.08);

    overflow: hidden;

    z-index: 200;
}


.create-menu {

    right: 100px;
}


.settings-menu {

    right: 24px;
}


.menu button {

    width: 100%;

    border: none;

    background: #fff;

    padding: 13px 15px;

    text-align: left;

    font-family: inherit;

    font-size: 14px;

    cursor: pointer;
}


.menu button:hover {

    background: #f5f6f8;
}


/* ==================================================
   主内容
================================================== */

.container {

    max-width: 1000px;

    margin: 40px auto;

    padding: 0 20px;
}


/* ==================================================
   空书架
================================================== */

.empty-shelf {

    text-align: center;

    padding-top: 120px;

    color: #888;
}


.empty-icon {

    font-size: 42px;

    margin-bottom: 18px;
}


.empty-title {

    font-size: 18px;

    font-weight: 600;

    color: #444;

    margin-bottom: 8px;
}


.empty-text {

    font-size: 14px;

    color: #999;
}


/* ==================================================
   书架
================================================== */

.book-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 22px;
}


.book-card {

    position: relative;

    background: #fff;

    border-radius: 12px;

    overflow: hidden;

    border:
        1px solid #e8e8e8;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    /*
     * 长按时禁止浏览器默认行为
     */

    -webkit-user-select: none;

    user-select: none;

    -webkit-touch-callout: none;

    touch-action: manipulation;
}


.book-card:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 22px rgba(0,0,0,0.08);
}


/* ==================================================
   长按视觉反馈
================================================== */

.book-card.long-pressing {

    transform:
        scale(0.97);

    box-shadow:
        0 4px 16px rgba(0,0,0,0.12);

    border-color:
        #c5cee0;
}


/* ==================================================
   删除按钮
================================================== */

.delete-book-button {

    position: absolute;

    top: 9px;
    right: 9px;

    width: 34px;
    height: 34px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.94);

    color: #777;

    font-size: 17px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    z-index: 10;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.12);

    transition:
        background 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease;
}


.delete-book-button:hover {

    background: #fff0f0;

    color: #e5484d;

    transform:
        scale(1.05);
}


.delete-book-button:active {

    transform:
        scale(0.95);
}


/* ==================================================
   封面
================================================== */

.book-cover {

    width: 100%;

    aspect-ratio: 3 / 4;

    background: #eef0f4;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    cursor: pointer;
}


.book-cover:hover {

    opacity: 0.94;
}


.book-cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    pointer-events: none;
}


.default-cover {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #eef1f5,
            #dfe4eb
        );

    color: #aeb4bd;

    font-size: 46px;
}


/* ==================================================
   书名
================================================== */

.book-info {

    padding:
        13px 14px 15px;

    background: #fff;
}


.book-title {

    font-size: 16px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    line-height: 1.4;

    cursor: pointer;

    -webkit-user-select: none;

    user-select: none;
}


.book-title:hover {

    color: #4f7cff;
}


/* ==================================================
   长按菜单遮罩
================================================== */

.book-menu-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.08);

    z-index: 900;

    display: none;
}


.book-menu-overlay.show {

    display: block;
}


/* ==================================================
   长按菜单
================================================== */

.book-context-menu {

    position: fixed;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    width: 280px;

    max-width:
        calc(100vw - 32px);

    background: #fff;

    border-radius: 15px;

    overflow: hidden;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.20);

    z-index: 1000;

    display: none;

    animation:
        contextMenuAppear
        0.15s ease-out;
}


.book-context-menu.show {

    display: block;
}


@keyframes contextMenuAppear {

    from {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.94);
    }

    to {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

}


/* ==================================================
   菜单标题
================================================== */

.context-menu-title {

    padding:
        17px 18px 13px;

    border-bottom:
        1px solid #eeeeee;

    font-size: 14px;

    color: #888;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* ==================================================
   菜单按钮
================================================== */

.context-menu-button {

    width: 100%;

    min-height: 54px;

    border: none;

    border-bottom:
        1px solid #f0f0f0;

    background: #fff;

    display: flex;

    align-items: center;

    padding:
        0 18px;

    font-family: inherit;

    font-size: 15px;

    color: #222;

    text-align: left;

    cursor: pointer;
}


.context-menu-button:last-child {

    border-bottom: none;
}


.context-menu-button:active {

    background: #f5f6f8;
}


.context-menu-icon {

    width: 34px;

    font-size: 18px;
}


.context-menu-button.delete-action {

    color: #e5484d;
}


/* ==================================================
   排序模式
================================================== */

.sort-mode .book-card {

    cursor: grab;
}


.sort-mode .book-card:active {

    cursor: grabbing;
}


.sort-mode .delete-book-button {

    display: none;
}


.sort-mode .book-card {

    animation:
        sortShake
        0.25s ease-in-out
        infinite alternate;
}


@keyframes sortShake {

    from {

        transform:
            rotate(-0.3deg);
    }

    to {

        transform:
            rotate(0.3deg);
    }

}


.sort-hint {

    display: none;

    margin-bottom: 15px;

    padding:
        11px 14px;

    background: #eef3ff;

    color: #4f6fc7;

    border-radius: 9px;

    font-size: 13px;

    text-align: center;
}


.sort-mode + .sort-hint {

    display: block;
}


.finish-sort-button {

    display: none;

    border: none;

    border-radius: 9px;

    padding:
        9px 13px;

    background: #4f7cff;

    color: #fff;

    font-family: inherit;

    font-size: 13px;

    cursor: pointer;
}


.sorting .create-button {

    display: none;
}


.sorting .finish-sort-button {

    display: block;
}


/* ==================================================
   底部导航
================================================== */

.bottom-nav {

    position: fixed;

    bottom: 0;
    left: 0;
    right: 0;

    height: 68px;

    background: #fff;

    border-top:
        1px solid #e8e8e8;

    display: flex;

    align-items: center;

    justify-content: space-around;

    z-index: 100;
}


.bottom-nav button {

    border: none;

    background: none;

    color: #777;

    font-family: inherit;

    font-size: 13px;

    cursor: pointer;

    padding:
        8px 20px;
}


.bottom-nav button.active {

    color: #4f7cff;

    font-weight: 600;
}


/* ==================================================
   手机
================================================== */

@media (max-width: 600px) {

    .top-bar {

        padding:
            0 14px;
    }


    .logo {

        font-size: 19px;
    }


    .create-button,
    .settings-button {

        padding:
            9px 11px;

        font-size: 13px;
    }


    .create-menu {

        right: 82px;
    }


    .settings-menu {

        right: 14px;
    }


    .container {

        padding:
            0 14px;

        margin-top: 28px;
    }


    .book-grid {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 14px;
    }


    .book-info {

        padding:
            11px 11px 13px;
    }


    .book-title {

        font-size: 15px;
    }


    .empty-shelf {

        padding-top: 100px;
    }


    .bottom-nav {

        height: 64px;
    }


    .bottom-nav button {

        padding:
            8px 12px;
    }


    .delete-book-button {

        width: 32px;

        height: 32px;

        top: 7px;

        right: 7px;
    }


    .book-context-menu {

        width:
            calc(100vw - 32px);

        max-width: 360px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     顶部
================================================== -->

<header class="top-bar">

    <div class="logo">
        我的书架
    </div>


    <div class="top-actions">

        <button
            id="finishSortButton"
            class="finish-sort-button"
            type="button"
            onclick="finishSortBooks()"
        >
            完成
        </button>


        <button
            id="createButton"
            class="create-button"
            type="button"
            onclick="toggleCreateMenu()"
        >
            ＋ 新建
        </button>


        <button
            class="settings-button"
            type="button"
            onclick="toggleSettingsMenu()"
        >
            ⚙ 设置
        </button>

    </div>

</header>


<!-- ==================================================
     新建菜单
================================================== -->

<div
    id="createMenu"
    class="menu create-menu"
>

    <button
        type="button"
        onclick="createBook()"
    >
        📖 新建书籍
    </button>


    <button
        type="button"
        onclick="createCollection()"
    >
        📚 新建组合
    </button>

</div>


<!-- ==================================================
     设置菜单
================================================== -->

<div
    id="settingsMenu"
    class="menu settings-menu"
>

    <button
        type="button"
        onclick="sortBooks()"
    >
        ↕ 排序
    </button>


    <button
        type="button"
        onclick="setGrid()"
    >
        ▦ 网格
    </button>


    <button
        type="button"
        onclick="setList()"
    >
        ☰ 列表
    </button>

</div>


<!-- ==================================================
     主内容
================================================== -->

<main class="container">


    <div
        id="sortHint"
        class="sort-hint"
    >
        拖动书籍调整书架顺序
    </div>


    <!-- 空书架 -->

    <div
        id="emptyShelf"
        class="empty-shelf"
    >

        <div class="empty-icon">
            📚
        </div>


        <div class="empty-title">
            书架还是空的
        </div>


        <div class="empty-text">
            点击「＋ 新建」开始创作
        </div>

    </div>


    <!-- 书籍 -->

    <div
        id="bookGrid"
        class="book-grid"
        style="display:none;"
    ></div>

</main>


<!-- ==================================================
     长按菜单遮罩
================================================== -->

<div
    id="bookMenuOverlay"
    class="book-menu-overlay"
></div>


<!-- ==================================================
     长按菜单
================================================== -->

<div
    id="bookContextMenu"
    class="book-context-menu"
>

    <div
        id="contextMenuTitle"
        class="context-menu-title"
    >
        小说
    </div>


    <button
        id="contextEdit"
        class="context-menu-button"
        type="button"
    >

        <span class="context-menu-icon">
            ✏️
        </span>

        <span>
            编辑
        </span>

    </button>


    <button
        id="contextSort"
        class="context-menu-button"
        type="button"
    >

        <span class="context-menu-icon">
            ↕️
        </span>

        <span>
            书架排序
        </span>

    </button>


    <button
        id="contextGroup"
        class="context-menu-button"
        type="button"
    >

        <span class="context-menu-icon">
            📁
        </span>

        <span>
            移至分组
        </span>

    </button>


    <button
        id="contextDelete"
        class="context-menu-button delete-action"
        type="button"
    >

        <span class="context-menu-icon">
            🗑️
        </span>

        <span>
            删除书籍
        </span>

    </button>

</div>


<!-- ==================================================
     底部导航
================================================== -->

<nav class="bottom-nav">

    <button
        class="active"
        type="button"
        onclick="goShelf()"
    >
        📚 书架
    </button>


    <button
        type="button"
        onclick="goTools()"
    >
        🧰 工具
    </button>


    <button
        type="button"
        onclick="goMe()"
    >
        👤 我的
    </button>

</nav>


<script>


// ==================================================
// 全局状态
// ==================================================

let books = [];

let longPressTimer = null;

let longPressBookId = null;

let longPressTriggered = false;

let isSorting = false;

let pressedCard = null;

let pressStartX = 0;

let pressStartY = 0;

const LONG_PRESS_TIME = 600;

const MOVE_CANCEL_DISTANCE = 10;


// ==================================================
// DOM
// ==================================================

const emptyShelf =
    document.getElementById(
        "emptyShelf"
    );


const bookGrid =
    document.getElementById(
        "bookGrid"
    );


const bookMenuOverlay =
    document.getElementById(
        "bookMenuOverlay"
    );


const bookContextMenu =
    document.getElementById(
        "bookContextMenu"
    );


const contextMenuTitle =
    document.getElementById(
        "contextMenuTitle"
    );


// ==================================================
// 菜单
// ==================================================

function toggleCreateMenu() {

    const createMenu =
        document.getElementById(
            "createMenu"
        );


    const settingsMenu =
        document.getElementById(
            "settingsMenu"
        );


    settingsMenu.style.display =
        "none";


    createMenu.style.display =
        createMenu.style.display ===
        "block"
            ? "none"
            : "block";
}


function toggleSettingsMenu() {

    const createMenu =
        document.getElementById(
            "createMenu"
        );


    const settingsMenu =
        document.getElementById(
            "settingsMenu"
        );


    createMenu.style.display =
        "none";


    settingsMenu.style.display =
        settingsMenu.style.display ===
        "block"
            ? "none"
            : "block";
}


function closeMenus() {

    document.getElementById(
        "createMenu"
    ).style.display =
        "none";


    document.getElementById(
        "settingsMenu"
    ).style.display =
        "none";
}


// ==================================================
// 新建
// ==================================================

function createBook() {

    closeMenus();


    window.location.href =
        "create-book.html";
}


function createCollection() {

    closeMenus();


    alert(
        "新建组合功能还在制作中"
    );
}


// ==================================================
// 读取书籍
// ==================================================

function loadBooks() {

    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    try {

        books =
            savedBooks
                ? JSON.parse(
                    savedBooks
                )
                : [];

    } catch (error) {

        console.error(
            "读取书籍数据失败：",
            error
        );

        books = [];

    }


    if (!Array.isArray(books)) {

        books = [];

    }

}


// ==================================================
// 保存书籍
// ==================================================

function saveBooks() {

    try {

        localStorage.setItem(
            "novelBooks",
            JSON.stringify(
                books
            )
        );

        return true;

    } catch (error) {

        console.error(
            "保存书架失败：",
            error
        );

        alert(
            "保存失败，请重新尝试。"
        );

        return false;

    }

}


// ==================================================
// 渲染书架
// ==================================================

function renderBooks() {

    bookGrid.innerHTML =
        "";


    if (books.length === 0) {

        emptyShelf.style.display =
            "block";

        bookGrid.style.display =
            "none";

        return;

    }


    emptyShelf.style.display =
        "none";

    bookGrid.style.display =
        "grid";


    books.forEach(
        function(book) {

            const card =
                createBookCard(
                    book
                );


            bookGrid.appendChild(
                card
            );

        }
    );

}


// ==================================================
// 创建书卡
// ==================================================

function createBookCard(book) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "book-card";


    card.dataset.bookId =
        String(book.id);


    // ==================================================
    // 删除按钮
    // ==================================================

    const deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "delete-book-button";


    deleteButton.type =
        "button";


    deleteButton.title =
        "删除书籍";


    deleteButton.textContent =
        "🗑";


    deleteButton.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            cancelLongPress();


            deleteBook(
                book.id
            );

        }
    );


    card.appendChild(
        deleteButton
    );


    // ==================================================
    // 封面
    // ==================================================

    const cover =
        document.createElement(
            "div"
        );


    cover.className =
        "book-cover";


    if (
        typeof book.cover ===
            "string" &&
        book.cover.length > 0
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            book.cover;


        image.alt =
            "书籍封面";


        cover.appendChild(
            image
        );

    } else {

        const defaultCover =
            document.createElement(
                "div"
            );


        defaultCover.className =
            "default-cover";


        defaultCover.textContent =
            "📖";


        cover.appendChild(
            defaultCover
        );

    }


    cover.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            if (
                longPressTriggered
            ) {

                longPressTriggered =
                    false;

                return;

            }


            if (isSorting) {

                return;

            }


            editBook(
                book.id
            );

        }
    );


    card.appendChild(
        cover
    );


    // ==================================================
    // 书名
    // ==================================================

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "book-info";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "book-title";


    title.textContent =
        book.title ||
        "未命名书籍";


    title.title =
        "点击进入全书";


    title.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            event.stopPropagation();


            if (
                longPressTriggered
            ) {

                longPressTriggered =
                    false;

                return;

            }


            if (isSorting) {

                return;

            }


            openBook(
                book.id
            );

        }
    );


    info.appendChild(
        title
    );


    card.appendChild(
        info
    );


    // ==================================================
    // 长按
    // ==================================================

    setupLongPress(
        card,
        book
    );


    return card;

}


// ==================================================
// 设置长按
// ==================================================

function setupLongPress(
    card,
    book
) {

    card.addEventListener(
        "pointerdown",
        function(event) {

            if (
                isSorting
            ) {

                return;

            }


            if (
                event.isPrimary === false
            ) {

                return;

            }


            /*
             * 点击删除按钮时，
             * 不启动长按。
             */

            if (
                event.target.closest(
                    ".delete-book-button"
                )
            ) {

                return;

            }


            cancelLongPress();


            pressedCard =
                card;


            longPressBookId =
                book.id;


            longPressTriggered =
                false;


            pressStartX =
                event.clientX;


            pressStartY =
                event.clientY;


            card.classList.add(
                "long-pressing"
            );


            longPressTimer =
                setTimeout(
                    function() {

                        longPressTimer =
                            null;


                        longPressTriggered =
                            true;


                        card.classList.remove(
                            "long-pressing"
                        );


                        showBookContextMenu(
                            book
                        );

                    },
                    LONG_PRESS_TIME
                );

        }
    );


    card.addEventListener(
        "pointermove",
        function(event) {

            if (
                !longPressTimer
            ) {

                return;

            }


            const dx =
                event.clientX -
                pressStartX;


            const dy =
                event.clientY -
                pressStartY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance >
                MOVE_CANCEL_DISTANCE
            ) {

                cancelLongPress();

            }

        }
    );


    card.addEventListener(
        "pointerup",
        function() {

            cancelLongPress();

        }
    );


    card.addEventListener(
        "pointercancel",
        function() {

            cancelLongPress();

        }
    );


    card.addEventListener(
        "pointerleave",
        function() {

            /*
             * 手机触摸通常不会触发
             * 这里的取消逻辑。
             *
             * 鼠标移出时取消长按。
             */

            if (
                event.pointerType ===
                "mouse"
            ) {

                cancelLongPress();

            }

        }
    );


    card.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

        }
    );

}


// ==================================================
// 取消长按
// ==================================================

function cancelLongPress() {

    if (
        longPressTimer
    ) {

        clearTimeout(
            longPressTimer
        );

        longPressTimer =
            null;

    }


    if (
        pressedCard
    ) {

        pressedCard.classList.remove(
            "long-pressing"
        );

    }


    pressedCard =
        null;

}


// ==================================================
// 显示长按菜单
// ==================================================

function showBookContextMenu(book) {

    longPressBookId =
        book.id;


    contextMenuTitle.textContent =
        book.title ||
        "未命名书籍";


    bookMenuOverlay.classList.add(
        "show"
    );


    bookContextMenu.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";

}


// ==================================================
// 关闭长按菜单
// ==================================================

function closeBookContextMenu() {

    bookMenuOverlay.classList.remove(
        "show"
    );


    bookContextMenu.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "";


    longPressBookId =
        null;

}


// ==================================================
// 菜单遮罩点击
// ==================================================

bookMenuOverlay.addEventListener(
    "click",
    function() {

        closeBookContextMenu();

    }
);


// ==================================================
// 编辑
// ==================================================

document.getElementById(
    "contextEdit"
).addEventListener(
    "click",
    function() {

        const bookId =
            longPressBookId;


        closeBookContextMenu();


        if (
            bookId === null ||
            bookId === undefined
        ) {

            return;

        }


        editBook(
            bookId
        );

    }
);


// ==================================================
// 书架排序
// ==================================================

document.getElementById(
    "contextSort"
).addEventListener(
    "click",
    function() {

        closeBookContextMenu();


        enterSortMode();

    }
);


// ==================================================
// 移至分组
// ==================================================

document.getElementById(
    "contextGroup"
).addEventListener(
    "click",
    function() {

        const bookId =
            longPressBookId;


        closeBookContextMenu();


        if (
            bookId === null ||
            bookId === undefined
        ) {

        }


        moveBookToGroup(

        );

    }
);


// ==================================================
// 删除
// ==================================================

document.getElementById(
    "contextDelete"
).addEventListener(
    "click",
    function() {

        const bookId =
            longPressBookId;


        closeBookContextMenu();


        if (
            bookId === null ||
            bookId === undefined
        ) {

            return;

        }


        deleteBook(
            bookId
        );

    }
);


// ==================================================
// 编辑小说
// ==================================================

function editBook(bookId) {

    localStorage.setItem(
        "currentBookId",
        String(bookId)
    );


    localStorage.removeItem(
        "currentChapterId"
    );


    window.location.href =
        "edit-book.html";

}


// ==================================================
// 打开全书
// ==================================================

function openBook(bookId) {

    localStorage.setItem(
        "currentBookId",
        String(bookId)
    );


    localStorage.removeItem(
        "currentChapterId"
    );


    window.location.href =
        "book.html";

}


// ==================================================
// 删除书籍
// ==================================================

function deleteBook(bookId) {

    const book =
        books.find(
            function(item) {

                return String(item.id) ===
                    String(bookId);

            }
        );


    if (!book) {

        return;

    }


    const confirmed =
        window.confirm(
            "确定要删除《" +
            (book.title ||
            "未命名书籍") +
            "》吗？\n\n" +
            "删除后，这本书及其全书结构将无法恢复。"
        );


    if (!confirmed) {

        return;

    }


    books =
        books.filter(
            function(item) {

                return String(item.id) !==
                    String(bookId);

            }
        );


    if (
        !saveBooks()
    ) {

        return;

    }


    const currentBookId =
        localStorage.getItem(
            "currentBookId"
        );


    if (
        currentBookId &&
        String(currentBookId) ===
            String(bookId)
    ) {

        localStorage.removeItem(
            "currentBookId"
        );


        localStorage.removeItem(
            "currentChapterId"
        );

    }


    renderBooks();

}


// ==================================================
// 书架排序
// ==================================================

function sortBooks() {

    closeMenus();

    enterSortMode();

}


// ==================================================
// 进入排序模式
// ==================================================

function enterSortMode() {

    if (
        isSorting
    ) {

        return;

    }


    isSorting =
        true;


    document.body.classList.add(
        "sorting"
    );


    renderSortMode();

}


// ==================================================
// 排序模式
// ==================================================

function renderSortMode() {

    const sortHint =
        document.getElementById(
            "sortHint"
        );


    sortHint.style.display =
        "block";


    /*
     * 当前使用 HTML5 拖动。
     * 手机上后续可以进一步改成
     * 手指拖动排序。
     */

    const cards =
        Array.from(
            document.querySelectorAll(
                ".book-card"
            )
        );


    let draggingCard =
        null;


    cards.forEach(
        function(card) {

            card.draggable =
                true;


            card.addEventListener(
                "dragstart",
                function() {

                    draggingCard =
                        card;

                }
            );


            card.addEventListener(
                "dragover",
                function(event) {

                    event.preventDefault();


                    if (
                        !draggingCard ||
                        draggingCard ===
                        card
                    ) {

                        return;

                    }


                    const rect =
                        card.getBoundingClientRect();


                    const middle =
                        rect.top +
                        rect.height / 2;


                    if (
                        event.clientY <
                        middle
                    ) {

                        bookGrid.insertBefore(
                            draggingCard,
                            card
                        );

                    } else {

                        bookGrid.insertBefore(
                            draggingCard,
                            card.nextSibling
                        );

                    }

                }
            );


            card.addEventListener(
                "dragend",
                function() {

                    updateBookOrder();

                }
            );

        }
    );

}


// ==================================================
// 更新书籍顺序
// ==================================================

function updateBookOrder() {

    const cards =
        Array.from(
            document.querySelectorAll(
                ".book-card"
            )
        );


    const newBooks =
        [];


    cards.forEach(
        function(card) {

            const bookId =
                card.dataset.bookId;


            const book =
                books.find(
                    function(item) {

                        return String(item.id) ===
                            String(bookId);

                    }
                );


            if (book) {

                newBooks.push(
                    book
                );

            }

        }
    );


    if (
        newBooks.length ===
        books.length
    ) {

        books =
            newBooks;

    }

}


// ==================================================
// 完成排序
// ==================================================

function finishSortBooks() {

    if (
        !isSorting
    ) {

        return;

    }


    updateBookOrder();


    if (
        !saveBooks()
    ) {

        return;

    }


    isSorting =
        false;


    document.body.classList.remove(
        "sorting"
    );


    document.getElementById(
        "sortHint"
    ).style.display =
        "none";


    renderBooks();

}


// ==================================================
// 移至分组
// ==================================================

function moveBookToGroup(bookId) {

    const book =
        books.find(
            function(item) {

                return String(item.id) ===
                    String(bookId);

            }
        );


    if (!book) {

        return;

    }


    /*
     * 这里先建立入口。
     *
     * 正式分组系统建立后，
     * 会在这里显示：
     *
     * 未分组
     * 原创
     * 宝可梦
     * 哆啦A梦
     * ...
     */

    alert(
        "准备将《" +
        (book.title ||
        "未命名书籍") +
        "》移动到分组。\n\n" +
        "分组系统下一步加入。"
    );

}

// 网格

    closeMenus();


    bookGrid.style.gridTemplateColumns =
        "repeat(auto-fill, minmax(180px, 1fr))";

}
