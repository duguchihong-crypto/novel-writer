<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说创作</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: #f5f6fa;
    color: #202124;
}

/* =========================
   整体
========================= */

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* =========================
   顶部
========================= */

.topbar {
    height: 58px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: #ffffff;
    border-bottom: 1px solid #e7e7eb;
    z-index: 20;
}

.topbar-title {
    font-size: 20px;
    font-weight: 700;
}

.more-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
}

.more-btn:active {
    background: #eeeeef;
}

/* =========================
   主内容
========================= */

.content {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 90px;
}

/* =========================
   书架
========================= */

.shelf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.shelf-name {
    font-size: 15px;
    font-weight: 600;
    color: #555;
}

.book-count {
    font-size: 13px;
    color: #999;
}

/* =========================
   网格
========================= */

.books {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px 14px;
}

/* =========================
   小说卡片
========================= */

.book {
    cursor: grab;
    user-select: none;
}

.book:active {
    cursor: grabbing;
}

.cover {
    width: 100%;
    aspect-ratio: 0.72;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        145deg,
        #6875e8,
        #9b72cf
    );
    box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.12);
}

.cover-title {
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    line-height: 1.5;
    font-weight: 700;
    word-break: break-all;
}

.book-info {
    padding: 8px 3px 0;
}

.book-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.book-meta {
    margin-top: 4px;
    font-size: 12px;
    color: #999;
}

/* =========================
   空书架
========================= */

.empty {
    display: none;
    text-align: center;
    padding: 90px 20px;
    color: #999;
}

.empty-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.empty-title {
    font-size: 17px;
    color: #555;
    font-weight: 600;
}

.empty-text {
    margin-top: 8px;
    font-size: 13px;
}

/* =========================
   底部导航
========================= */

.bottom-nav {
    height: 68px;
    flex-shrink: 0;
    display: flex;
    background: rgba(255,255,255,0.96);
    border-top: 1px solid #e7e7eb;
    z-index: 20;
}

.nav-item {
    flex: 1;
    border: none;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: #8a8a8f;
    font-size: 11px;
    cursor: pointer;
}

.nav-icon {
    font-size: 22px;
}

.nav-item.active {
    color: #5865d9;
    font-weight: 600;
}

/* =========================
   弹出菜单
========================= */

.menu-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.15);
    z-index: 30;
}

.menu {
    position: absolute;
    top: 58px;
    right: 12px;
    width: 190px;
    background: white;
    border-radius: 14px;
    padding: 7px;
    box-shadow:
        0 10px 35px rgba(0,0,0,0.18);
}

.menu-title {
    padding: 10px 12px 7px;
    font-size: 12px;
    color: #999;
}

.menu-item {
    width: 100%;
    border: none;
    background: transparent;
    padding: 12px;
    text-align: left;
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
}

.menu-item:hover {
    background: #f3f3f5;
}

.menu-item:active {
    background: #e9e9ed;
}

/* =========================
   弹窗
========================= */

.modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.42);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
}

.modal {
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px 28px;
    animation: slideUp .2s ease;
}

@keyframes slideUp {
    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

.modal h2 {
    margin: 0 0 20px;
    font-size: 20px;
}

.input {
    width: 100%;
    height: 46px;
    border: 1px solid #dddde2;
    border-radius: 10px;
    padding: 0 13px;
    font-size: 15px;
    outline: none;
    margin-bottom: 13px;
}

.input:focus {
    border-color: #6875e8;
}

.textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid #dddde2;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    resize: none;
    outline: none;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.modal-btn {
    flex: 1;
    height: 46px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.cancel {
    background: #f0f0f2;
}

.confirm {
    background: #5865d9;
    color: white;
}

/* =========================
   设置
========================= */

.setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.setting-label {
    font-size: 15px;
}

.segment {
    display: flex;
    background: #f0f0f2;
    padding: 3px;
    border-radius: 9px;
}

.segment button {
    border: none;
    background: transparent;
    padding: 7px 11px;
    border-radius: 7px;
    cursor: pointer;
}

.segment button.active {
    background: white;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
}

/* =========================
   列表模式
========================= */

.books.list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.books.list .book {
    display: flex;
    align-items: center;
    padding: 9px;
    background: white;
    border-radius: 12px;
}

.books.list .cover {
    width: 58px;
    height: 78px;
    flex-shrink: 0;
    aspect-ratio: auto;
    border-radius: 7px;
}

.books.list .cover-title {
    font-size: 10px;
    padding: 5px;
}

.books.list .book-info {
    padding: 0 0 0 12px;
}

.books.list .book-title {
    font-size: 15px;
}

@media (min-width: 700px) {
    .books {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .content {
        max-width: 1000px;
        width: 100%;
        margin: auto;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <header class="topbar">
        <div class="topbar-title">书架</div>

        <button class="more-btn" onclick="openMenu()">
            …
        </button>
    </header>

    <!-- 内容 -->
    <main class="content">

        <div class="shelf-header">
            <div class="shelf-name">全部作品</div>
            <div class="book-count" id="bookCount">4 本作品</div>
        </div>

        <div class="books" id="books">

            <div class="book" draggable="true">
                <div class="cover">
                    <div class="cover-title">
                        我的第一本小说
                    </div>
                </div>

                <div class="book-info">
                    <div class="book-title">
                        我的第一本小说
                    </div>

                    <div class="book-meta">
                        12章 · 3.2万字
                    </div>
                </div>
            </div>

            <div class="book" draggable="true">
                <div class="cover">
                    <div class="cover-title">
                        宝可梦：赤红传
                    </div>
                </div>

                <div class="book-info">
                    <div class="book-title">
                        宝可梦：赤红传
                    </div>

                    <div class="book-meta">
                        3章 · 1.8万字
                    </div>
                </div>
            </div>

            <div class="book" draggable="true">
                <div class="cover">
                    <div class="cover-title">
                        界囚
                    </div>
                </div>

                <div class="book-info">
                    <div class="book-title">
                        界囚
                    </div>

                    <div class="book-meta">
                        0章 · 0字
                    </div>
                </div>
            </div>

            <div class="book" draggable="true">
                <div class="cover">
                    <div class="cover-title">
                        未命名作品
                    </div>
                </div>

                <div class="book-info">
                    <div class="book-title">
                        未命名作品
                    </div>

                    <div class="book-meta">
                        草稿
                    </div>
                </div>
            </div>

        </div>

        <div class="empty" id="empty">
            <div class="empty-icon">📚</div>
            <div class="empty-title">书架还是空的</div>
            <div class="empty-text">
                创建你的第一部小说吧
            </div>
        </div>

    </main>

    <!-- 底部 -->
    <nav class="bottom-nav">

        <button class="nav-item active">
            <div class="nav-icon">📚</div>
            <div>书架</div>
        </button>

        <button class="nav-item">
            <div class="nav-icon">🛠</div>
            <div>工具</div>
        </button>

        <button class="nav-item">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </button>

    </nav>

</div>


<!-- 顶部菜单 -->
<div class="menu-mask" id="menuMask" onclick="closeMenu(event)">

    <div class="menu" onclick="event.stopPropagation()">

        <div class="menu-title">
            新建
        </div>

        <button class="menu-item" onclick="newBook()">
            ＋ 新建作品
        </button>

        <button class="menu-item" onclick="newGroup()">
            ＋ 新建分组
        </button>

        <button class="menu-item" onclick="openSettings()">
            ⚙ 书架设置
        </button>

    </div>

</div>


<!-- 新建作品 -->
<div class="modal-mask" id="newBookModal">

    <div class="modal">

        <h2>新建作品</h2>

        <input
            class="input"
            id="bookName"
            placeholder="作品名称"
        >

        <input
            class="input"
            id="bookAuthor"
            placeholder="作者名称"
        >

        <textarea
            class="textarea"
            id="bookIntro"
            placeholder="作品简介"
        ></textarea>

        <div class="modal-buttons">

            <button
                class="modal-btn cancel"
                onclick="closeModal('newBookModal')">
                取消
            </button>

            <button
                class="modal-btn confirm"
                onclick="createBook()">
                创建作品
            </button>

        </div>

    </div>

</div>


<!-- 新建分组 -->
<div class="modal-mask" id="groupModal">

    <div class="modal">

        <h2>新建分组</h2>

        <input
            class="input"
            id="groupName"
            placeholder="例如：长篇小说"
        >

        <div class="modal-buttons">

            <button
                class="modal-btn cancel"
                onclick="closeModal('groupModal')">
                取消
            </button>

            <button
                class="modal-btn confirm"
                onclick="createGroup()">
                创建分组
            </button>

        </div>

    </div>

</div>


<!-- 书架设置 -->
<div class="modal-mask" id="settingsModal">

    <div class="modal">

        <h2>书架设置</h2>

        <div class="setting-row">

            <div class="setting-label">
                显示方式
            </div>

            <div class="segment">

                <button
                    id="gridBtn"
                    class="active"
                    onclick="setView('grid')">
                    网格
                </button>

                <button
                    id="listBtn"
                    onclick="setView('list')">
                    列表
                </button>

            </div>

        </div>

        <div class="setting-row">

            <div class="setting-label">
                书架排序
            </div>

            <div style="font-size:13px;color:#999;">
                自定义拖动
            </div>

        </div>

        <div class="modal-buttons">

            <button
                class="modal-btn confirm"
                onclick="closeModal('settingsModal')">
                完成
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   菜单
========================= */

function openMenu() {
    document.getElementById("menuMask").style.display = "block";
}

function closeMenu(event) {

    if (
        event &&
        event.target !== document.getElementById("menuMask")
    ) {
        return;
    }

    document.getElementById("menuMask").style.display = "none";
}


/* =========================
   新建作品
========================= */

function newBook() {

    closeMenu();

    document.getElementById("newBookModal").style.display = "flex";
}

function createBook() {

    const name =
        document.getElementById("bookName").value.trim();

    if (!name) {
        alert("请输入作品名称");
        return;
    }

    const books =
        document.getElementById("books");

    const book =
        document.createElement("div");

    book.className = "book";
    book.draggable = true;

    book.innerHTML = `
        <div class="cover">
            <div class="cover-title">
                ${escapeHTML(name)}
            </div>
        </div>

        <div class="book-info">
            <div class="book-title">
                ${escapeHTML(name)}
            </div>

            <div class="book-meta">
                0章 · 0字
            </div>
        </div>
    `;

    books.appendChild(book);

    updateCount();

    closeModal("newBookModal");

    document.getElementById("bookName").value = "";
    document.getElementById("bookAuthor").value = "";
    document.getElementById("bookIntro").value = "";

    initDrag();
}


/* =========================
   新建分组
========================= */

function newGroup() {

    closeMenu();

    document.getElementById("groupModal").style.display = "flex";
}

function createGroup() {

    const name =
        document.getElementById("groupName").value.trim();

    if (!name) {
        alert("请输入分组名称");
        return;
    }

    alert("分组「" + name + "」已创建");

    document.getElementById("groupName").value = "";

    closeModal("groupModal");
}


/* =========================
   设置
========================= */

function openSettings() {

    closeMenu();

    document.getElementById("settingsModal").style.display = "flex";
}

function setView(type) {

    const books =
        document.getElementById("books");

    const gridBtn =
        document.getElementById("gridBtn");

    const listBtn =
        document.getElementById("listBtn");

    if (type === "list") {

        books.classList.add("list");

        gridBtn.classList.remove("active");
        listBtn.classList.add("active");

    } else {

        books.classList.remove("list");

        listBtn.classList.remove("active");
        gridBtn.classList.add("active");
    }
}


/* =========================
   弹窗
========================= */

function closeModal(id) {

    document.getElementById(id).style.display = "none";
}


/* =========================
   字数/作品数量
========================= */

function updateCount() {

    const count =
        document.querySelectorAll("#books .book").length;

    document.getElementById("bookCount").innerText =
        count + " 本作品";
}


/* =========================
   防止 HTML 注入
========================= */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================
   拖动排序
========================= */

function initDrag() {

    const books =
        document.querySelectorAll(".book");

    let dragged = null;

    books.forEach(book => {

        book.addEventListener("dragstart", () => {

            dragged = book;

            book.style.opacity = "0.5";
        });

        book.addEventListener("dragend", () => {

            book.style.opacity = "1";

            dragged = null;
        });

        book.addEventListener("dragover", event => {

            event.preventDefault();

            if (!dragged || dragged === book) {
                return;
            }

            const rect =
                book.getBoundingClientRect();

            const middle =
                rect.left + rect.width / 2;

            if (event.clientX < middle) {

                book.parentNode.insertBefore(
                    dragged,
                    book
                );

            } else {

                book.parentNode.insertBefore(
                    dragged,
                    book.nextSibling
                );
            }
        });

    });
}

initDrag();
updateCount();

</script>

</body>
</html>
