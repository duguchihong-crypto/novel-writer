<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说家</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: #f7f7f8;
    color: #222;
}

button,
input,
textarea {
    font-family: inherit;
}

.page {
    display: none;
    min-height: 100vh;
    padding-bottom: 90px;
}

.page.active {
    display: block;
}

.header {
    height: 62px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 20px;
    font-weight: 700;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 22px 50px;
}

.page-title {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    margin: 10px 0 30px;
}

/* =========================
   新建
========================= */

.create-menu-wrap {
    position: relative;
}

.create-btn {
    border: none;
    background: #222;
    color: #fff;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.create-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 44px;
    width: 165px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    padding: 6px;
    z-index: 50;
}

.create-menu.show {
    display: block;
}

.create-menu button {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 11px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.create-menu button:hover {
    background: #f5f5f5;
}

/* =========================
   书架设置
========================= */

.library-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
}

.library-settings {
    position: relative;
}

.settings-btn {
    border: 1px solid #ddd;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.settings-panel {
    display: none;
    position: absolute;
    right: 0;
    top: 43px;
    width: 180px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 13px;
    box-shadow: 0 8px 25px rgba(0,0,0,.1);
    z-index: 40;
}

.settings-panel.show {
    display: block;
}

.settings-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
}

.mode-buttons {
    display: flex;
    gap: 8px;
}

.mode-btn {
    flex: 1;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 7px;
    padding: 8px 4px;
    cursor: pointer;
}

.mode-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
}

/* =========================
   书架
========================= */

.novels.grid-mode {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 34px 25px;
}

.novels.grid-mode .novel-card {
    text-align: center;
    min-width: 0;
    cursor: pointer;
}

.novels.grid-mode .novel-cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    border-radius: 9px;
    background: #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: .2s;
}

.novels.grid-mode .novel-card:hover .novel-cover {
    transform: translateY(-4px);
}

.novels.grid-mode .novel-name {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.novels.grid-mode .novel-description,
.novels.grid-mode .novel-meta,
.novels.grid-mode .continue-btn {
    display: none;
}

.novels.list-mode {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.novels.list-mode .novel-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.novels.list-mode .novel-cover {
    width: 88px;
    height: 118px;
    object-fit: cover;
    border-radius: 7px;
    flex-shrink: 0;
}

.novels.list-mode .novel-info {
    flex: 1;
}

.novels.list-mode .novel-name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
}

.novels.list-mode .novel-description {
    font-size: 14px;
    color: #888;
    margin-bottom: 8px;
}

.novels.list-mode .novel-meta {
    font-size: 12px;
    color: #aaa;
}

.continue-btn {
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 7px;
    padding: 8px 13px;
}

.empty-state {
    text-align: center;
    color: #999;
    padding: 90px 20px;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty-title {
    font-size: 18px;
    color: #555;
    margin-bottom: 8px;
}

/* =========================
   底部导航
========================= */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72px;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e8e8e8;
    display: flex;
    justify-content: center;
    z-index: 200;
    padding-bottom: env(safe-area-inset-bottom);
}

.nav-inner {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-around;
}

.nav-item {
    flex: 1;
    max-width: 180px;
    border: none;
    background: transparent;
    color: #999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    font-size: 12px;
}

.nav-icon {
    font-size: 22px;
}

.nav-item.active {
    color: #222;
    font-weight: 600;
}

/* =========================
   工具
========================= */

.tool-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.tool-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 28px 15px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.tool-card:hover {
    transform: translateY(-2px);
}

.tool-icon {
    font-size: 32px;
    margin-bottom: 12px;
}

.tool-name {
    font-size: 16px;
    font-weight: 600;
}

.tool-desc {
    margin-top: 7px;
    color: #999;
    font-size: 12px;
}

/* =========================
   字数统计
========================= */

.stats-section {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
}

.stats-section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.stats-section-title strong {
    font-size: 18px;
}

.stats-more {
    color: #777;
    font-size: 13px;
}

.chart-box {
    width: 100%;
    height: 220px;
    position: relative;
}

.chart-svg {
    width: 100%;
    height: 100%;
}

.chart-label {
    font-size: 11px;
    fill: #999;
}

/* =========================
   圆环
========================= */

.distribution-box {
    padding-top: 5px;
}

.donut-area {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 330px;
    position: relative;
}

.donut {
    width: 270px;
    height: 270px;
    border-radius: 50%;
    position: relative;
    cursor: pointer;
    transition: .25s;
}

.donut-hole {
    position: absolute;
    width: 164px;
    height: 164px;
    left: 53px;
    top: 53px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 15px;
    pointer-events: none;
}

.donut-name {
    font-size: 16px;
    font-weight: 700;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.donut-count {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 700;
}

.donut-percent {
    margin-top: 5px;
    font-size: 13px;
    color: #888;
}

.distribution-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px 18px;
    margin-top: 8px;
}

.distribution-item {
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 4px;
    text-align: left;
    cursor: pointer;
    border-radius: 7px;
    min-width: 0;
}

.distribution-item:hover {
    background: #f7f7f7;
}

.distribution-item.active {
    background: #f1f1f1;
}

.color-dot {
    width: 11px;
    height: 11px;
    min-width: 11px;
    border-radius: 50%;
}

.distribution-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
}

.distribution-count {
    color: #999;
    font-size: 12px;
}

/* =========================
   我的
========================= */

.profile-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 30px;
    text-align: center;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #eee;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.profile-name {
    font-size: 19px;
    font-weight: 600;
}

.profile-subtitle {
    color: #999;
    font-size: 13px;
    margin-top: 7px;
}

/* =========================
   弹窗
========================= */

.modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-mask.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 500px;
    background: #fff;
    border-radius: 14px;
    padding: 25px;
}

.modal h2 {
    margin: 0 0 22px;
}

.modal label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 18px 0 8px;
}

.modal input[type="text"],
.modal textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

.modal textarea {
    min-height: 110px;
    resize: vertical;
}

.cover-upload {
    width: 120px;
    height: 160px;
    border: 1px dashed #d5d5d5;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    cursor: pointer;
    overflow: hidden;
    background: #fafafa;
}

.cover-upload span {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
}

.cover-upload strong {
    font-size: 27px;
    font-weight: 300;
}

.cover-upload small {
    font-size: 13px;
}

.cover-upload img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 25px;
}

.actions button {
    padding: 9px 16px;
    border-radius: 8px;
}

.actions .cancel {
    background: #fff;
    border: 1px solid #ddd;
}

.actions .create {
    background: #222;
    color: #fff;
    border: none;
}

/* =========================
   作品
========================= */

.work-header {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 22px;
    display: flex;
    gap: 22px;
}

.work-cover {
    width: 130px;
    height: 175px;
    object-fit: cover;
    border-radius: 9px;
}

.work-info {
    flex: 1;
}

.work-info h1 {
    margin: 5px 0 12px;
}

.work-info p {
    color: #888;
    line-height: 1.7;
}

.back-btn {
    border: none;
    background: transparent;
    color: #666;
    padding: 0;
    margin-bottom: 22px;
    cursor: pointer;
}

.chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0 15px;
}

.new-chapter-btn {
    border: none;
    background: #222;
    color: #fff;
    border-radius: 8px;
    padding: 9px 14px;
}

/* =========================
   章节
========================= */

.chapter-list {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
}

.chapter-item {
    padding: 16px 18px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
}

.chapter-item:last-child {
    border-bottom: none;
}

.chapter-date {
    color: #aaa;
    font-size: 12px;
}

/* =========================
   编辑器
========================= */

.editor-page {
    background: #fff;
}

.editor-toolbar {
    height: 62px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.editor-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.editor-title {
    width: 300px;
    border: none;
    outline: none;
    font-size: 17px;
    font-weight: 600;
}

.save-btn {
    border: none;
    background: #222;
    color: #fff;
    border-radius: 8px;
    padding: 9px 17px;
    cursor: pointer;
}

.editor-area {
    max-width: 850px;
    margin: auto;
    padding: 45px 25px;
}

.editor-content {
    width: 100%;
    min-height: 65vh;
    border: none;
    outline: none;
    resize: none;
    font-size: 17px;
    line-height: 2;
}

.word-count {
    position: fixed;
    right: 18px;
    bottom: 82px;
    color: #999;
    font-size: 12px;
}

/* =========================
   手机
========================= */

@media (max-width: 900px) {

    .novels.grid-mode {
        grid-template-columns: repeat(4, 1fr);
    }

}

@media (max-width: 600px) {

    .header {
        padding: 0 15px;
    }

    .container {
        padding: 25px 15px 45px;
    }

    .page-title {
        font-size: 24px;
        margin-bottom: 25px;
    }

    .novels.grid-mode {
        grid-template-columns: repeat(3, 1fr);
        gap: 25px 12px;
    }

    .novels.grid-mode .novel-name {
        font-size: 13px;
    }

    .tool-grid {
        grid-template-columns: 1fr;
    }

    .distribution-list {
        grid-template-columns: 1fr;
    }

    .donut {
        width: 250px;
        height: 250px;
    }

    .donut-hole {
        width: 152px;
        height: 152px;
        left: 49px;
        top: 49px;
    }

    .work-header {
        padding: 15px;
        gap: 15px;
    }

    .work-cover {
        width: 95px;
        height: 128px;
    }

    .editor-title {
        width: 180px;
    }

}
</style>
</head>

<body>

<!-- =========================
     书架
========================= -->

<div id="libraryPage" class="page active">

<header class="header">

<div class="logo">小说家</div>

<div class="create-menu-wrap">

<button class="create-btn"
onclick="toggleCreateMenu()">
＋ 新建
</button>

<div id="createMenu" class="create-menu">

<button onclick="openNovelModal()">
📖 新建作品
</button>

<button onclick="createGroup()">
📁 新建分组
</button>

<button onclick="closeCreateMenu()">
取消
</button>

</div>

</div>

</header>

<main class="container">

<div class="page-title">
我的小说
</div>

<div class="library-toolbar">

<div class="library-settings">

<button class="settings-btn"
onclick="toggleSettings()">
⚙️ 书架设置
</button>

<div id="settingsPanel"
class="settings-panel">

<div class="settings-title">
书架模式
</div>

<div class="mode-buttons">

<button id="gridModeBtn"
class="mode-btn"
onclick="setLibraryMode('grid')">
▦ 网格
</button>

<button id="listModeBtn"
class="mode-btn"
onclick="setLibraryMode('list')">
☰ 列表
</button>

</div>

</div>

</div>

</div>

<div id="emptyState"
class="empty-state">

<div class="empty-icon">
📚
</div>

<div class="empty-title">
还没有作品
</div>

<div>
点击右上角「＋ 新建」开始创作
</div>

</div>

<div id="novels"
class="novels grid-mode">
</div>

</main>

</div>


<!-- =========================
     工具
========================= -->

<div id="toolsPage" class="page">

<header class="header">
<div class="logo">小说家</div>
</header>

<main class="container">

<div class="page-title">
工具
</div>

<div class="tool-grid">

<div class="tool-card"
onclick="openWordStats()">

<div class="tool-icon">
🔢
</div>

<div class="tool-name">
字数统计
</div>

<div class="tool-desc">
统计每日码字字数
</div>

</div>

</div>

</main>

</div>


<!-- =========================
     字数统计
========================= -->

<div id="statsPage" class="page">

<header class="header">

<div class="logo">
小说家
</div>

</header>

<main class="container">

<button class="back-btn"
onclick="backToTools()">
← 返回工具
</button>

<div class="page-title">
字数统计
</div>

<section class="stats-section">

<div class="stats-section-title">

<strong>
累计字数
</strong>

<div class="stats-more">
近7天 ＞
</div>

</div>

<div id="totalChart"
class="chart-box">
</div>

</section>


<section class="stats-section">

<div class="stats-section-title">

<strong>
输入字数
</strong>

<div class="stats-more">
近7天 ＞
</div>

</div>

<div id="dailyChart"
class="chart-box">
</div>

</section>


<section class="stats-section distribution-box">

<div class="stats-section-title">

<strong>
字数分布
</strong>

</div>

<div class="donut-area">

<div id="donut"
class="donut">

<div class="donut-hole">

<div id="donutName"
class="donut-name">
暂无作品
</div>

<div id="donutCount"
class="donut-count">
0 字
</div>

<div id="donutPercent"
class="donut-percent">
0%
</div>

</div>

</div>

</div>

<div id="distributionList"
class="distribution-list">
</div>

</section>

</main>

</div>


<!-- =========================
     我的
========================= -->

<div id="profilePage" class="page">

<header class="header">
<div class="logo">小说家</div>
</header>

<main class="container">

<div class="page-title">
我的
</div>

<div class="profile-card">

<div class="avatar">
👤
</div>

<div class="profile-name">
小说作者
</div>

<div class="profile-subtitle">
开始你的创作之旅
</div>

</div>

</main>

</div>


<!-- =========================
     作品
========================= -->

<div id="workPage" class="page">

<header class="header">
<div class="logo">小说家</div>
</header>

<main class="container">

<button class="back-btn"
onclick="backToLibrary()">
← 返回书架
</button>

<div class="work-header">

<img id="workCover"
class="work-cover">

<div class="work-info">

<h1 id="workName"></h1>

<p id="workDescription"></p>

</div>

</div>

<div class="chapter-header">

<h2>
章节
</h2>

<button class="new-chapter-btn"
onclick="newChapter()">
＋ 新建章节
</button>

</div>

<div id="chapterList"
class="chapter-list">
</div>

</main>

</div>


<!-- =========================
     编辑器
========================= -->

<div id="editorPage" class="page">

<div class="editor-toolbar">

<div class="editor-left">

<button class="back-btn"
style="margin:0"
onclick="backToWork()">
← 返回
</button>

<input id="chapterTitle"
class="editor-title"
placeholder="章节标题">

</div>

<button class="save-btn"
onclick="saveChapter()">
保存
</button>

</div>

<div class="editor-area">

<textarea id="chapterContent"
class="editor-content"
placeholder="开始写作……"
oninput="updateWordCount()"></textarea>

</div>

<div id="wordCount"
class="word-count">
0 字
</div>

</div>


<!-- =========================
     新建作品
========================= -->

<div id="novelModal"
class="modal-mask">

<div class="modal">

<h2>
新建作品
</h2>

<label>
作品名称
</label>

<input id="novelName"
type="text"
placeholder="请输入作品名称">

<label>
添加封面
</label>

<label class="cover-upload"
for="coverInput">

<span id="coverText">

<strong>＋</strong>

<small>
添加封面
</small>

</span>

<img id="coverPreview"
style="display:none;">

</label>

<input id="coverInput"
type="file"
accept="image/*"
style="display:none"
onchange="previewCover(event)">

<label>
简介

placeholder="简介内容"></textarea>

<div class="actions">

<button class="cancel"
onclick="hideNovelModal()">
取消
</button>

<button class="create"
onclick="createNovel()">
创建作品
</button>

</div>

</div>

</div>


<!-- =========================
     底部导航
========================= -->

<nav class="bottom-nav">

<div class="nav-inner">

<button id="navLibrary"
class="nav-item active"
onclick="switchPage('library')">

<div class="nav-icon">📚</div>
<div>书架</div>

</button>

<button id="navTools"
class="nav-item"
onclick="switchPage('tools')">

<div class="nav-icon">🛠</div>
<div>工具</div>

</button>

<button id="navProfile"
class="nav-item"
onclick="switchPage('profile')">

<div class="nav-icon">👤</div>
<div>我的</div>

</button>

</div>

</nav>


<script>

/* =========================
   数据
========================= */

let novels =
JSON.parse(localStorage.getItem("novels") || "[]");

let writingStats =
JSON.parse(localStorage.getItem("writingStats") || "{}");

let selectedCover = "";

let currentNovelId = null;

let currentStatsIndex = 0;

let libraryMode =
localStorage.getItem("libraryMode") || "grid";


/* =========================
   页面
========================= */

function switchPage(page) {

document.querySelectorAll(".page")
.forEach(el => el.classList.remove("active"));

if (page === "library") {
document.getElementById("libraryPage")
.classList.add("active");
}

if (page === "tools") {
document.getElementById("toolsPage")
.classList.add("active");
}

if (page === "profile") {
document.getElementById("profilePage")
.classList.add("active");
}

document.getElementById("navLibrary")
.classList.toggle("active", page === "library");

document.getElementById("navTools")
.classList.toggle("active", page === "tools");

document.getElementById("navProfile")
.classList.toggle("active", page === "profile");

}


/* =========================
   保存作品
========================= */

function saveNovels() {

localStorage.setItem(
"novels",
JSON.stringify(novels)
);

}


/* =========================
   新建
========================= */

function toggleCreateMenu() {

document.getElementById("createMenu")
.classList.toggle("show");

}

function closeCreateMenu() {

document.getElementById("createMenu")
.classList.remove("show");

}

function createGroup() {

closeCreateMenu();

alert("分组功能正在开发中。");

}


/* =========================
   书架设置
========================= */

function toggleSettings() {

document.getElementById("settingsPanel")
.classList.toggle("show");

}

function setLibraryMode(mode) {

libraryMode = mode;

localStorage.setItem(
"libraryMode",
mode
);

renderNovels();

}

function updateModeButtons() {

document.getElementById("gridModeBtn")
.classList.toggle(
"active",
libraryMode === "grid"
);

document.getElementById("listModeBtn")
.classList.toggle(
"active",
libraryMode === "list"
);

}


/* =========================
   新建作品
========================= */

function openNovelModal() {

closeCreateMenu();

document.getElementById("novelModal")
.classList.add("show");

document.getElementById("novelName").value = "";

document.getElementById("novelDescription").value = "";

selectedCover = "";

document.getElementById("coverPreview")
.style.display = "none";

document.getElementById("coverText")
.style.display = "flex";

}

function hideNovelModal() {

document.getElementById("novelModal")
.classList.remove("show");

}

function previewCover(event) {

const file = event.target.files[0];

if (!file) return;

const reader = new FileReader();

reader.onload = function(e) {

selectedCover = e.target.result;

document.getElementById("coverPreview").src =
selectedCover;

document.getElementById("coverPreview")
.style.display = "block";

document.getElementById("coverText")
.style.display = "none";

};

reader.readAsDataURL(file);

}


/* =========================
   默认封面
========================= */

function createDefaultCover(name) {

const canvas =
document.createElement("canvas");

canvas.width = 300;
canvas.height = 400;

const ctx = canvas.getContext("2d");

ctx.fillStyle = "#eeeeee";

ctx.fillRect(0,0,300,400);

ctx.fillStyle = "#555";

ctx.font = "bold 28px sans-serif";

ctx.textAlign = "center";

ctx.textBaseline = "middle";

let title = name || "未命名作品";

if (title.length > 8) {
title = title.substring(0,8) + "…";
}

ctx.fillText(title,150,200);

return canvas.toDataURL(
"image/jpeg",
.8
);

}


/* =========================
   创建作品
========================= */

function createNovel() {

const name =
document.getElementById("novelName")
.value.trim();

const description =
document.getElementById("novelDescription")
.value.trim();

if (!name) {

alert("请输入作品名称");

return;

}

novels.unshift({

id: Date.now().toString(),

name: name,

description: description,

cover:
selectedCover ||
createDefaultCover(name),

chapters: [],

created: Date.now(),

updated: Date.now()

});

saveNovels();

hideNovelModal();

renderNovels();

}


/* =========================
   书架
========================= */

function renderNovels() {

const container =
document.getElementById("novels");

const empty =
document.getElementById("emptyState");

container.className =
"novels " +
(
libraryMode === "grid"
? "grid-mode"
: "list-mode"
);

updateModeButtons();

if (!novels.length) {

container.innerHTML = "";

empty.style.display = "block";

return;

}

empty.style.display = "none";

container.innerHTML =
novels.map(function(novel) {

const chapterCount =
novel.chapters
? novel.chapters.length
: 0;

return `

<div class="novel-card"
onclick="openWork('${novel.id}')">

<img class="novel-cover"
src="${novel.cover}">

<div class="novel-info">

<div class="novel-name">
${escapeHTML(novel.name)}
</div>

<div class="novel-description">
${escapeHTML(
novel.description || "暂无简介"
)}
</div>

<div class="novel-meta">
${chapterCount} 章
</div>

</div>

<button class="continue-btn"
onclick="
event.stopPropagation();
openWork('${novel.id}');
">
继续写作
</button>

</div>

`;

}).join("");

}


/* =========================
   作品
========================= */

function openWork(id) {

currentNovelId = id;

const novel =
novels.find(n => n.id === id);

if (!novel) return;

document.querySelectorAll(".page")
.forEach(el => el.classList.remove("active"));

document.getElementById("workPage")
.classList.add("active");

document.getElementById("workName")
.textContent = novel.name;

document.getElementById("workDescription")
.textContent =
novel.description || "暂无简介";

document.getElementById("workCover")
.src = novel.cover;

renderChapters();

}

function backToLibrary() {

document.getElementById("workPage")
.classList.remove("active");

document.getElementById("libraryPage")
.classList.add("active");

renderNovels();

}


/* =========================
   章节列表
========================= */

function renderChapters() {

const novel =
novels.find(n => n.id === currentNovelId);

const list =
document.getElementById("chapterList");

if (
!novel ||
!novel.chapters ||
!novel.chapters.length
) {

list.innerHTML = `

<div style="
padding:50px;
text-align:center;
color:#999;
">
还没有章节
</div>

`;

return;

}

list.innerHTML =
novel.chapters.map(
function(chapter,index) {

return `

<div class="chapter-item"
onclick="openChapter('${chapter.id}')">

<div>
第 ${index + 1} 章
${escapeHTML(
chapter.title || "未命名章节"
)}
</div>

<div class="chapter-date">
${formatDate(chapter.updated)}
</div>

</div>

`;

}).join("");

}


/* =========================
   字数统计页面
========================= */

function openWordStats() {

document.querySelectorAll(".page")
.forEach(el => el.classList.remove("active"));

document.getElementById("statsPage")
.classList.add("active");

document.getElementById("navLibrary")
.classList.remove("active");

document.getElementById("navTools")
.classList.add("active");

document.getElementById("navProfile")
.classList.remove("active");

renderWordStats();

}


function backToTools() {

document.getElementById("statsPage")
.classList.remove("active");

document.getElementById("toolsPage")
.classList.add("active");

document.getElementById("navTools")
.classList.add("active");

}


/* =========================
   日期
========================= */

function getDateKey(date = new Date()) {

return (
date.getFullYear() +
"-" +
String(date.getMonth() + 1).padStart(2,"0") +
"-" +
String(date.getDate()).padStart(2,"0")
);

}


/* =========================
   最近7天
========================= */

function getLast7Days() {

const result = [];

for (let i = 6; i >= 0; i--) {

const d = new Date();

d.setDate(d.getDate() - i);

const key = getDateKey(d);

result.push({

key: key,

label:
String(d.getMonth() + 1)
.padStart(2,"0")
+
"/"
+
String(d.getDate())
.padStart(2,"0"),

value:
writingStats[key] || 0

});

}

return result;

}


/* =========================
   累计字数
========================= */

function getTotalWords() {

let total = 0;

novels.forEach(novel => {

(novel.chapters || []).forEach(chapter => {

total += countWords(
chapter.content || ""
);

});

});

return total;

}


/* =========================
   SVG折线图
========================= */

function renderTotalChart() {

const box =
document.getElementById("totalChart");

const days = getLast7Days();

const total =
getTotalWords();

let previous =
Math.max(
0,
total -
days.reduce(
(sum,d) => sum + d.value,
0
)
);

const cumulative =
days.map(d => {

previous += d.value;

return previous;

});

const width = 800;
const height = 220;

const left = 48;
const right = 15;
const top = 15;
const bottom = 35;

const chartW =
width - left - right;

const chartH =
height - top - bottom;

const max =
Math.max(
50,
...cumulative
);

const points =
cumulative.map(
(value,index) => {

const x =
left +
(index / 6) * chartW;

const y =
top +
chartH -
(value / max) * chartH;

return {
x:x,
y:y,
value:value
};

});

const path =
points.map(
(p,i) =>
(i === 0 ? "M" : "L")
+
p.x +
" " +
p.y
).join(" ");

let svg = `

<svg class="chart-svg"
viewBox="0 0 ${width} ${height}"
preserveAspectRatio="none">

`;

for (let i=0;i<5;i++) {

const y =
top +
(i / 4) * chartH;

const value =
Math.round(
max * (1 - i / 4)
);

svg += `

<line
x1="${left}"
y1="${y}"
x2="${width-right}"
y2="${y}"
stroke="#eeeeee"
/>

<text
x="4"
y="${y+4}"
class="chart-label">
${formatCompact(value)}
</text>

`;

}

svg += `

<path
d="${path}"
fill="none"
stroke="#222"
stroke-width="3"
stroke-linecap="round"
stroke-linejoin="round"
/>

`;

points.forEach(p => {

svg += `

<circle
cx="${p.x}"
cy="${p.y}"
r="4"
fill="#222"
/>

`;

});

days.forEach((d,i) => {

svg += `

<text
x="${points[i].x}"
y="${height-8}"
text-anchor="middle"
class="chart-label">
${d.label}
</text>

`;

});

svg += "</svg>";

box.innerHTML = svg;

}


/* =========================
   每日输入图
========================= */

function renderDailyChart() {

const box =
document.getElementById("dailyChart");

const days = getLast7Days();

const maxValue =
Math.max(
10,
...days.map(d => d.value)
);

const width = 800;
const height = 220;

const left = 48;
const right = 15;
const top = 15;
const bottom = 35;

const chartW =
width - left - right;

const chartH =
height - top - bottom;

let svg = `

<svg class="chart-svg"
viewBox="0 0 ${width} ${height}"
preserveAspectRatio="none">

`;

for (let i=0;i<5;i++) {

const y =
top +
(i / 4) * chartH;

const value =
Math.round(
maxValue * (1 - i / 4)
);

svg += `

<line
x1="${left}"
y1="${y}"
x2="${width-right}"
y2="${y}"
stroke="#eeeeee"
/>

<text
x="4"
y="${y+4}"
class="chart-label">
${formatCompact(value)}
</text>

`;

}

days.forEach((d,i) => {

const x =
left +
((i + .5) / 7) * chartW;

const barW =
Math.min(
50,
chartW / 10
);

const barH =
(d.value / maxValue) * chartH;

const y =
top +
chartH -
barH;

svg += `

<rect
x="${x - barW/2}"
y="${y}"
width="${barW}"
height="${Math.max(barH,1)}"
rx="5"
fill="#222"
/>

<text
x="${x}"
y="${height-8}"
text-anchor="middle"
class="chart-label">
${d.label}
</text>

`;

});

svg += "</svg>";

box.innerHTML = svg;

}


/* =========================
   字数分布
========================= */

const distributionColors = [

"#ef4444",
"#f97316",
"#eab308",
"#22c55e",
"#06b6d4",
"#3b82f6",
"#8b5cf6",

"#fca5a5",
"#fdba74",
"#fde68a",
"#86efac",
"#67e8f9",
"#93c5fd",
"#c4b5fd",

"#dc2626",
"#ea580c",
"#ca8a04",
"#16a34a",
"#0891b2",
"#2563eb",
"#7c3aed"

];


function getNovelDistribution() {

return novels
.map(novel => {

let words = 0;

(novel.chapters || [])
.forEach(chapter => {

words += countWords(
chapter.content || ""
);

});

return {

id: novel.id,
name: novel.name,
words: words

};

})
.filter(item => item.words > 0)
.sort((a,b) => b.words - a.words);

}


function renderDistribution() {

const data =
getNovelDistribution();

const donut =
document.getElementById("donut");

const list =
document.getElementById("distributionList");

if (!data.length) {

donut.style.background =
"#eeeeee";

document.getElementById("donutName")
.textContent = "暂无作品";

document.getElementById("donutCount")
.textContent = "0 字";

document.getElementById("donutPercent")
.textContent = "0%";

list.innerHTML = `

<div style="
grid-column:1/-1;
text-align:center;
padding:20px;
color:#999;
">
写完章节后，这里会显示作品字数分布
</div>

`;

return;

}

if (
currentStatsIndex >= data.length
) {

currentStatsIndex = 0;

}

const total =
data.reduce(
(sum,item) => sum + item.words,
0
);

const segments = [];

let start = 0;

data.forEach((item,index) => {

const percent =
item.words / total * 100;

const end =
start + percent;

segments.push(
`${getDistributionColor(index)}
${start}% ${end}%`
);

start = end;

});

donut.style.background =
`conic-gradient(
${segments.join(",")}
)`;

updateDonutCenter(
data,
total,
currentStatsIndex
);

list.innerHTML =
data.map(
(item,index) => {

const percent =
item.words / total * 100;

return `

<button
class="distribution-item
${index === currentStatsIndex ? "active" : ""}"
onclick="selectDistribution(${index})">

<span
class="color-dot"
style="
background:${getDistributionColor(index)}
">
</span>

<span class="distribution-name">
${escapeHTML(item.name)}
</span>

<span class="distribution-count">
${formatNumber(item.words)}
</span>

</button>

`;

}
).join("");

donut.onclick = function(event) {

const rect =
donut.getBoundingClientRect();

const cx =
rect.left + rect.width / 2;

const cy =
rect.top + rect.height / 2;

const x =
event.clientX - cx;

const y =
event.clientY - cy;

let angle =
Math.atan2(y,x)
* 180 / Math.PI;

angle += 90;

if (angle < 0) {
angle += 360;
}

let currentAngle = 0;

for (
let i=0;
i<data.length;
i++
) {

const percent =
data[i].words / total * 100;

const degree =
percent * 3.6;

if (
angle >= currentAngle &&
angle < currentAngle + degree
) {

selectDistribution(i);

break;

}

currentAngle += degree;

}

};

}


function selectDistribution(index) {

currentStatsIndex = index;

renderDistribution();

}


function updateDonutCenter(
data,
total,
index
) {

const item = data[index];

if (!item) return;

const percent =
item.words / total * 100;

document.getElementById("donutName")
.textContent =
item.name;

document.getElementById("donutCount")
.textContent =
formatNumber(item.words) + " 字";

document.getElementById("donutPercent")
.textContent =
percent.toFixed(1) + "%";

}


function getDistributionColor(index) {

return distributionColors[
index % distributionColors.length
];

}


/* =========================
   字数统计总入口
========================= */

function renderWordStats() {

renderTotalChart();

renderDailyChart();

renderDistribution();

}


/* =========================
   工具函数
========================= */

function formatNumber(number) {

return Number(number)
.toLocaleString("zh-CN");

}

function formatCompact(number) {

if (number >= 1000000) {

return (
(number / 1000000)
.toFixed(1)
.replace(".0","")
+
"M"
);

}

if (number >= 1000) {

return (
(number / 1000)
.toFixed(1)
.replace(".0","")
+
"K"
);

}

return String(number);

}

function escapeHTML(text) {

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function formatDate(timestamp) {

if (!timestamp) return "";

const date =
new Date(timestamp);

return (
date.getFullYear() +
"/" +
String(
date.getMonth()+1
).padStart(2,"0") +
"/" +
String(
date.getDate()
).padStart(2,"0")
);

}


/* =========================
   初始化
========================= */

renderNovels();

</script>

<script src="js/editor.js"></script>
