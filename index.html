<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说作者创作平台</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f6f7f9;
            color: #222;
        }

        header {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            padding: 0 28px;
            font-size: 20px;
            font-weight: 600;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        button {
            border: none;
            background: #222;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .book {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 15px;
        }

        .book h2 {
            margin: 0 0 8px;
            font-size: 19px;
        }

        .info {
            color: #777;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<header>
    ✍️ 小说作者创作平台
</header>

<div class="container">

    <div class="top">
        <h1>我的小说</h1>
        <button onclick="newBook()">＋ 新建小说</button>
    </div>

    <div id="books">

        <div class="book">
            <h2>我的第一本小说</h2>
            <div class="info">
                12章 · 38,521字 · 最后编辑：今天
            </div>
        </div>

        <div class="book">
            <h2>第二个故事</h2>
            <div class="info">
                3章 · 8,421字 · 最后编辑：昨天
            </div>
        </div>

    </div>

</div>

<script>
function newBook() {
    const name = prompt("请输入小说名称：");

    if (!name) {
        return;
    }

    const book = document.createElement("div");

    book.className = "book";

    book.innerHTML = `
        <h2>${name}</h2>
        <div class="info">
            0章 · 0字 · 刚刚创建
        </div>
    `;

    document.getElementById("books").prepend(book);
}
</script>

</body>
</html>
