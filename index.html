<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说家</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f7f8;
    color: #222;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 21px;
    font-weight: 700;
}

.header-right {
    display: flex;
    gap: 10px;
    align-items: center;
}

.top-btn {
    border: 1px solid #ddd;
    background: #fff;
    padding: 9px 15px;
    border-radius: 8px;
    color: #333;
}

.top-btn:hover {
    background: #f5f5f5;
}

.container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 35px 24px 60px;
}

.page-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
}

.page-subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 28px;
}

/* =========================
   书架工具栏
========================= */

.library-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.library-title {
    font-size: 17px;
    font-weight: 600;
}

.toolbar-right {
    display: flex;
    gap: 8px;
}

.library-settings {
    position: relative;
}

.settings-btn {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 12px;
}

.settings-panel {
    display: none;
    position: absolute;
    right: 0;
    top: 44px;
    width: 190px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,.1);
    padding: 14px;
    z-index: 30;
}

.settings-panel.show {
    display: block;
}

.settings-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
}

.mode-buttons {
    display: flex;
    gap: 8px;
}

.mode-btn {
    flex: 1;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 7px;
    padding: 8px 4px;
}

.mode-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
}

/* =========================
   新建菜单
========================= */

.create-menu-wrap {
    position: relative;
}

.create-btn {
    border: none;
    background: #222;
    color: #fff;
    padding: 9px 16px;
    border-radius: 8px;
}

.create-btn:hover {
    background: #333;
}

.create-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    width: 170px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,.1);
    padding: 6px;
    z-index: 40;
}

.create-menu.show {
    display: block;
}

.create-menu button {
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 11px 12px;
    border-radius: 7px;
}

.create-menu button:hover {
    background: #f5f5f5;
}

/* =========================
   空书架
========================= */

.empty-state {
    text-align: center;
    padding: 100px 20px;
    color: #999;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty-title {
    font-size: 18px;
    color: #555;
    margin-bottom: 8px;
}

.empty-text {
    font-size: 14px;
}

/* =========================
   普通列表模式
========================= */

.novels.list-mode {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.novels.list-mode .novel-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 18px;
    transition: .2s;
}

.novels.list-mode .novel-card:hover {
    box-shadow: 0 5px 18px rgba(0,0,0,.06);
}

.novels.list-mode .novel-cover {
    width: 88px;
    height: 118px;
    flex-shrink: 0;
    border-radius: 7px;
    object-fit: cover;
    background: #eee;
}

.novels.list-mode .novel-info {
    flex: 1;
    min-width: 0;
}

.novels.list-mode .novel-name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 9px;
}

.novels.list-mode .novel-description {
    color: #888;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 9px;
}

.novels.list-mode .novel-meta {
    color: #aaa;
    font-size: 12px;
}

.novels.list-mode .continue-btn {
    border: 1px solid #ddd;
    background: #fff;
    padding: 8px 13px;
    border-radius: 7px;
    white-space: nowrap;
}

.novels.list-mode .continue-btn:hover {
    background: #f5f5f5;
}

/* =========================
   ★ 网格书架模式
   封面在上
   作品名在下
========================= */

.novels.grid-mode {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 34px 26px;
}

.novels.grid-mode .novel-card {
    background: transparent;
    border: none;
    border-radius: 0;
    padding: 0;
    display: block;
    text-align: center;
    min-width: 0;
}

.novels.grid-mode .novel-card:hover {
    box-shadow: none;
}

.novels.grid-mode .novel-cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    height: auto;
    display: block;
    object-fit: cover;
    border-radius: 9px;
    background: #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: .2s;
}

.novels.grid-mode .novel-card:hover .novel-cover {
    transform: translateY(-4px);
    box-shadow: 0 7px 18px rgba(0,0,0,.13);
}

.novels.grid-mode .novel-info {
    width: 100%;
}

.novels.grid-mode .novel-name {
    margin-top: 11px;
    margin-bottom: 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.novels.grid-mode .novel-description,
.novels.grid-mode .novel-meta,
.novels.grid-mode .continue-btn {
    display: none;
}

/* =========================
   新建作品弹窗
========================= */

.modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-mask.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 500px;
    background: #fff;
    border-radius: 14px;
    padding: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,.2);
}

.modal h2 {
    margin: 0 0 23px;
    font-size: 21px;
}

.modal label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    margin-top: 18px;
}

.modal input[type="text"],
.modal textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 11px 12px;
    outline: none;
}

.modal input[type="text"]:focus,
.modal textarea:focus {
    border-color: #999;
}

.modal textarea {
    min-height: 110px;
    resize: vertical;
}

/* 封面 */

.cover-upload {
    width: 120px;
    height: 160px;
    border: 1px dashed #d5d5d5;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    cursor: pointer;
    overflow: hidden;
    background: #fafafa;
    transition: .2s;
    padding: 0;
    margin: 0 !important;
}

.cover-upload:hover {
    border-color: #aaa;
    background: #f7f7f7;
}

.cover-upload span {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    text-align: center;
}

.cover-upload strong {
    font-size: 27px;
    font-weight: 300;
    line-height: 1;
}

.cover-upload small {
    font-size: 13px;
}

.cover-upload img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 弹窗按钮 */

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 25px;
}

.actions button {
    border-radius: 8px;
    padding: 9px 16px;
}

.actions .cancel {
    background: #fff;
    border: 1px solid #ddd;
}

.actions .create {
    background: #222;
    color: #fff;
    border: 1px solid #222;
}

/* =========================
   作品页面
========================= */

.page {
    display: none;
}

.page.active {
    display: block;
}

.back-btn {
    border: none;
    background: transparent;
    padding: 0;
    color: #666;
    margin-bottom: 25px;
}

.work-header {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 22px;
    display: flex;
    gap: 22px;
    margin-bottom: 25px;
}

.work-cover {
    width: 130px;
    height: 175px;
    border-radius: 9px;
    object-fit: cover;
    flex-shrink: 0;
}

.work-info {
    flex: 1;
}

.work-info h1 {
    margin: 5px 0 12px;
    font-size: 26px;
}

.work-info p {
    color: #888;
    line-height: 1.7;
    white-space: pre-wrap;
}

.chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.chapter-header h2 {
    font-size: 19px;
}

.new-chapter-btn {
    border: none;
    background: #222;
    color: #fff;
    padding: 9px 14px;
    border-radius: 8px;
}

.chapter-list {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
}

.chapter-item {
    padding: 16px 18px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
}

.chapter-item:last-child {
    border-bottom: none;
}

.chapter-item:hover {
    background: #fafafa;
}

.chapter-title {
    font-weight: 500;
}

.chapter-date {
    color: #aaa;
    font-size: 12px;
}

/* =========================
   编辑器
========================= */

.editor-page {
    min-height: calc(100vh - 64px);
}

.editor-toolbar {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
}

.editor-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.editor-title {
    border: none;
    outline: none;
    font-size: 17px;
    font-weight: 600;
    width: 300px;
}

.save-btn {
    border: none;
    background: #222;
    color: #fff;
    padding: 9px 17px;
    border-radius: 8px;
}

.editor-area {
    max-width: 850px;
    margin: 0 auto;
    padding: 45px 25px;
}

.editor-content {
    width: 100%;
    min-height: 65vh;
    border: none;
    outline: none;
    background: transparent;
    resize: none;
    font-size: 17px;
    line-height: 2;
    color: #222;
}

.word-count {
    position: fixed;
    bottom: 15px;
    right: 20px;
    color: #999;
    font-size: 12px;
}

/* =========================
   手机
========================= */

@media (max-width: 900px) {
    .novels.grid-mode {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {

    .header {
        padding: 0 15px;
    }

    .container {
        padding: 25px 15px 45px;
    }

    .page-title {
        font-size: 24px;
    }

    .novels.grid-mode {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 25px 12px;
    }

    .novels.grid-mode .novel-name {
        font-size: 13px;
        margin-top: 8px;
    }

    .novels.list-mode .novel-card {
        padding: 12px;
        gap: 12px;
    }

    .novels.list-mode .novel-cover {
        width: 70px;
        height: 95px;
    }

    .novels.list-mode .novel-description {
        display: none;
    }

    .novels.list-mode .novel-name {
        font-size: 15px;
    }

    .novels.list-mode .continue-btn {
        padding: 7px 9px;
        font-size: 12px;
    }

    .work-header {
        padding: 15px;
        gap: 15px;
    }

    .work-cover {
        width: 95px;
        height: 128px;
    }

    .work-info h1 {
        font-size: 21px;
    }

    .editor-title {
        width: 180px;
    }
}
</style>
</head>

<body>

<!-- =========================
     主页面
========================= -->

<div id="homePage" class="page active">

    <header class="header">
        <div class="logo">小说家</div>

        <div class="header-right">

            <div class="create-menu-wrap">

                <button class="create-btn" onclick="toggleCreateMenu()">
                    ＋ 新建
                </button>

                <div id="createMenu" class="create-menu">

                    <button onclick="openNovelModal()">
                        📖 新建作品
                    </button>

                    <button onclick="createGroup()">
                        📁 新建分组
                    </button>

                    <button onclick="closeCreateMenu()">
                        取消
                    </button>

                </div>

            </div>

        </div>
    </header>

    <main class="container">

        <div class="page-title">我的小说</div>

        <div class="page-subtitle">
            创作、管理你的作品
        </div>

        <div class="library-toolbar">

            <div class="library-title">
                我的书架
            </div>

            <div class="toolbar-right">

                <div class="library-settings">

                    <button class="settings-btn" onclick="toggleSettings()">
                        ⚙️ 书架设置
                    </button>

                    <div id="settingsPanel" class="settings-panel">

                        <div class="settings-title">
                            书架模式
                        </div>

                        <div class="mode-buttons">

                            <button
                                id="gridModeBtn"
                                class="mode-btn"
                                onclick="setLibraryMode('grid')">
                                ▦ 网格
                            </button>

                            <button
                                id="listModeBtn"
                                class="mode-btn"
                                onclick="setLibraryMode('list')">
                                ☰ 列表
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div id="emptyState" class="empty-state">

            <div class="empty-icon">📚</div>

            <div class="empty-title">
                还没有作品
            </div>

            <div class="empty-text">
                点击右上角「＋ 新建」开始创作
            </div>

        </div>

        <div id="novels" class="novels grid-mode"></div>

    </main>

</div>


<!-- =========================
     新建作品弹窗
========================= -->

<div id="novelModal" class="modal-mask">

    <div class="modal">

        <h2>新建作品</h2>

        <label>作品名称</label>

        <input
            id="novelName"
            type="text"
            placeholder="请输入作品名称">

        <label>添加封面</label>

        <label class="cover-upload" for="coverInput">

            <span id="coverText">
                <strong>＋</strong>
                <small>添加封面</small>
            </span>

            <img
                id="coverPreview"
                style="display:none;">

        </label>

        <input
            id="coverInput"
            type="file"
            accept="image/*"
            style="display:none;"
            onchange="previewCover(event)">

        <label>简介</label>

        <textarea
            id="novelDescription"
            placeholder="简介内容"></textarea>

        <div class="actions">

            <button
                class="cancel"
                onclick="hideNovelModal()">
                取消
            </button>

            <button
                class="create"
                onclick="createNovel()">
                创建作品
            </button>

        </div>

    </div>

</div>


<!-- =========================
     作品页面
========================= -->

<div id="workPage" class="page">

    <header class="header">

        <div class="logo">
            小说家
        </div>

    </header>

    <main class="container">

        <button
            class="back-btn"
            onclick="backHome()">
            ← 返回书架
        </button>

        <div class="work-header">

            <img
                id="workCover"
                class="work-cover">

            <div class="work-info">

                <h1 id="workName"></h1>

                <p id="workDescription"></p>

            </div>

        </div>

        <div class="chapter-header">

            <h2>章节</h2>

            <button
                class="new-chapter-btn"
                onclick="newChapter()">
                ＋ 新建章节
            </button>

        </div>

        <div
            id="chapterList"
            class="chapter-list">
        </div>

    </main>

</div>


<!-- =========================
     编辑器
========================= -->

<div id="editorPage" class="page editor-page">

    <div class="editor-toolbar">

        <div class="editor-left">

            <button
                class="back-btn"
                style="margin:0"
                onclick="backToWork()">
                ← 返回
            </button>

            <input
                id="chapterTitle"
                class="editor-title"
                placeholder="章节标题">

        </div>

        <button
            class="save-btn"
            onclick="saveChapter()">
            保存
        </button>

    </div>

    <div class="editor-area">

        <textarea
            id="chapterContent"
            class="editor-content"
            placeholder="开始写作……"
            oninput="updateWordCount()"></textarea>

    </div>

    <div
        id="wordCount"
        class="word-count">
        0 字
    </div>

</div>


<script>

/* =========================
   数据
========================= */

let novels =
    JSON.parse(localStorage.getItem("novels") || "[]");

let selectedCover = "";

let currentNovelId = null;

let currentChapterId = null;

let libraryMode =
    localStorage.getItem("libraryMode") || "grid";


/* =========================
   工具
========================= */

function saveNovels() {

    localStorage.setItem(
        "novels",
        JSON.stringify(novels)
    );

}


/* =========================
   书架模式
========================= */

function setLibraryMode(mode) {

    libraryMode = mode;

    localStorage.setItem(
        "libraryMode",
        mode
    );

    renderNovels();

}


function updateModeButtons() {

    const gridBtn =
        document.getElementById("gridModeBtn");

    const listBtn =
        document.getElementById("listModeBtn");

    gridBtn.classList.toggle(
        "active",
        libraryMode === "grid"
    );

    listBtn.classList.toggle(
        "active",
        libraryMode === "list"
    );

}


function toggleSettings() {

    document
        .getElementById("settingsPanel")
        .classList.toggle("show");

}


document.addEventListener(
    "click",
    function(event) {

        const settings =
            document.querySelector(".library-settings");

        if (
            settings &&
            !settings.contains(event.target)
        ) {

            document
                .getElementById("settingsPanel")
                .classList.remove("show");

        }

    }
);


/* =========================
   新建菜单
========================= */

function toggleCreateMenu() {

    document
        .getElementById("createMenu")
        .classList.toggle("show");

}


function closeCreateMenu() {

    document
        .getElementById("createMenu")
        .classList.remove("show");

}


function createGroup() {

    closeCreateMenu();

    alert("分组功能正在开发中。");

}


/* =========================
   新建作品
========================= */

function openNovelModal() {

    closeCreateMenu();

    document
        .getElementById("novelModal")
        .classList.add("show");

    document
        .getElementById("novelName")
        .value = "";

    document
        .getElementById("novelDescription")
        .value = "";

    selectedCover = "";

    document
        .getElementById("coverPreview")
        .style.display = "none";

    document
        .getElementById("coverText")
        .style.display = "flex";

}


function hideNovelModal() {

    document
        .getElementById("novelModal")
        .classList.remove("show");

}


function previewCover(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        selectedCover =
            e.target.result;

        const preview =
            document.getElementById("coverPreview");

        preview.src =
            selectedCover;

        preview.style.display =
            "block";

        document
            .getElementById("coverText")
            .style.display = "none";

    };

    reader.readAsDataURL(file);

}


/* =========================
   默认封面
========================= */

function createDefaultCover(name) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 300;
    canvas.height = 400;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "#eeeeee";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#555";

    ctx.font = "bold 28px sans-serif";

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    let title =
        name || "未命名作品";

    if (title.length > 8) {

        title =
            title.substring(0, 8) + "…";

    }

    ctx.fillText(
        title,
        150,
        200
    );

    return canvas.toDataURL("image/jpeg", .8);

}


/* =========================
   创建作品
========================= */

function createNovel() {

    const name =
        document
            .getElementById("novelName")
            .value
            .trim();

    const description =
        document
            .getElementById("novelDescription")
            .value
            .trim();

    if (!name) {

        alert("请输入作品名称");

        return;

    }

    const novel = {

        id:
            Date.now().toString(),

        name:
            name,

        description:
            description,

        cover:
            selectedCover ||
            createDefaultCover(name),

        chapters: [],

        created:
            Date.now(),

        updated:
            Date.now()

    };

    novels.unshift(novel);

    saveNovels();

    hideNovelModal();

    renderNovels();

}


/* =========================
   渲染书架
========================= */

function renderNovels() {

    const container =
        document.getElementById("novels");

    const empty =
        document.getElementById("emptyState");

    container.className =
        "novels " +
        (libraryMode === "grid"
            ? "grid-mode"
            : "list-mode");

    updateModeButtons();

    if (!novels.length) {

        container.innerHTML = "";

        empty.style.display =
            "block";

        return;

    }

    empty.style.display =
        "none";

    container.innerHTML =
        novels.map(function(novel) {

            const chapterCount =
                novel.chapters
                    ? novel.chapters.length
                    : 0;

            const safeName =
                escapeHTML(novel.name);

            const safeDescription =
                escapeHTML(
                    novel.description || "暂无简介"
                );

            return `

                <div class="novel-card">

                    <img
                        class="novel-cover"
                        src="${novel.cover}">

                    <div class="novel-info">

                        <div class="novel-name">
                            ${safeName}
                        </div>

                        <div class="novel-description">
                            ${safeDescription}
                        </div>

                        <div class="novel-meta">
                            ${chapterCount} 章
                        </div>

                    </div>

                    <button
                        class="continue-btn"
                        onclick="openWork('${novel.id}')">
                        继续写作
                    </button>

                </div>

            `;

        }).join("");

}


/* =========================
   打开作品
========================= */

function openWork(id) {

    currentNovelId =
        id;

    const novel =
        novels.find(
            n => n.id === id
        );

    if (!novel) return;

    document
        .getElementById("homePage")
        .classList.remove("active");

    document
        .getElementById("editorPage")
        .classList.remove("active");

    document
        .getElementById("workPage")
        .classList.add("active");

    document
        .getElementById("workName")
        .textContent =
            novel.name;

    document
        .getElementById("workDescription")
        .textContent =
            novel.description ||
            "暂无简介";

    document
        .getElementById("workCover")
        .src =
            novel.cover;

    renderChapters();

}


/* =========================
   返回书架
========================= */

function backHome() {

    document
        .getElementById("workPage")
        .classList.remove("active");

    document
        .getElementById("homePage")
        .classList.add("active");

    renderNovels();

}


/* =========================
   章节
========================= */

function renderChapters() {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    const list =
        document.getElementById("chapterList");

    if (
        !novel ||
        !novel.chapters ||
        !novel.chapters.length
    ) {

        list.innerHTML = `

            <div
                style="
                    padding:50px;
                    text-align:center;
                    color:#999;
                ">
                还没有章节<br>
                <span
                    style="
                        display:block;
                        margin-top:8px;
                        font-size:13px;
                    ">
                    点击右上角「＋ 新建章节」开始写作
                </span>
            </div>

        `;

        return;

    }

    list.innerHTML =
        novel.chapters
            .map(function(chapter, index) {

                return `

                    <div
                        class="chapter-item"
                        onclick="openChapter('${chapter.id}')">

                        <div class="chapter-title">
                            第 ${index + 1} 章
                            ${escapeHTML(
                                chapter.title ||
                                "未命名章节"
                            )}
                        </div>

                        <div class="chapter-date">
                            ${formatDate(chapter.updated)}
                        </div>

                    </div>

                `;

            })
            .join("");

}


/* =========================
   新建章节
========================= */

function newChapter() {

    currentChapterId =
        null;

    document
        .getElementById("workPage")
        .classList.remove("active");

    document
        .getElementById("editorPage")
        .classList.add("active");

    document
        .getElementById("chapterTitle")
        .value = "";

    document
        .getElementById("chapterContent")
        .value = "";

    updateWordCount();

    document
        .getElementById("chapterTitle")
        .focus();

}


/* =========================
   打开章节
========================= */

function openChapter(id) {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    if (!novel) return;

    const chapter =
        novel.chapters.find(
            c => c.id === id
        );

    if (!chapter) return;

    currentChapterId =
        id;

    document
        .getElementById("workPage")
        .classList.remove("active");

    document
        .getElementById("editorPage")
        .classList.add("active");

    document
        .getElementById("chapterTitle")
        .value =
            chapter.title || "";

    document
        .getElementById("chapterContent")
        .value =
            chapter.content || "";

    updateWordCount();

}


/* =========================
   保存章节
========================= */

function saveChapter() {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    if (!novel) return;

    const title =
        document
            .getElementById("chapterTitle")
            .value
            .trim();

    const content =
        document
            .getElementById("chapterContent")
            .value;

    if (!title) {

        alert("请输入章节标题");

        return;

    }

    if (!novel.chapters) {

        novel.chapters = [];

    }

    if (currentChapterId) {

        const chapter =
            novel.chapters.find(
                c => c.id === currentChapterId
            );

        if (chapter) {

            chapter.title =
                title;

            chapter.content =
                content;

            chapter.updated =
                Date.now();

        }

    } else {

        novel.chapters.push({

            id:
                Date.now().toString(),

            title:
                title,

            content:
                content,

            updated:
                Date.now()

        });

    }

    novel.updated =
        Date.now();

    saveNovels();

    alert("已保存");

    backToWork();

}


/* =========================
   返回作品
========================= */

function backToWork() {

    document
        .getElementById("editorPage")
        .classList.remove("active");

    document
        .getElementById("workPage")
        .classList.add("active");

    renderChapters();

}


/* =========================
   字数统计
========================= */

function updateWordCount() {

    const text =
        document
            .getElementById("chapterContent")
            .value;

    const count =
        text.replace(/\s/g, "").length;

    document
        .getElementById("wordCount")
        .textContent =
            count + " 字";

}


/* =========================
   HTML安全处理
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   日期
========================= */

function formatDate(timestamp) {

    if (!timestamp) return "";

    const date =
        new Date(timestamp);

    return (
        date.getFullYear() +
        "/" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "/" +
        String(
            date.getDate()
        ).padStart(2, "0")
    );

}


/* =========================
   启动
========================= */

renderNovels();

</script>

</body>
</html>
