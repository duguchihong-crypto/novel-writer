<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说家</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: white;
    padding: 22px 20px;
    border-bottom: 1px solid #e5e5e5;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #888;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.top h2 {
    margin: 0;
}

button {
    cursor: pointer;
}

.new-button {
    background: #222;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 15px;
}

.novel-list {
    display: grid;
    gap: 16px;
}

.novel {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 20px;
}

.novel h3 {
    margin: 0 0 8px;
}

.novel p {
    margin: 5px 0;
    color: #888;
    font-size: 14px;
}

.continue {
    margin-top: 15px;
    background: #f0f0f0;
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 14px;
    padding: 25px;
}

.modal-box h2 {
    margin-top: 0;
}

.menu-button {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    background: #f5f5f5;
    border: none;
    border-radius: 9px;
    text-align: left;
    font-size: 16px;
}

.menu-button:hover {
    background: #eaeaea;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.cancel {
    background: #eee;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
}

.create {
    background: #222;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
}

.empty {
    background: white;
    border: 1px dashed #ccc;
    border-radius: 12px;
    padding: 45px 20px;
    text-align: center;
    color: #999;
}

@media (max-width: 600px) {
    .top {
        align-items: flex-start;
        gap: 12px;
    }

    .new-button {
        white-space: nowrap;
    }
}
</style>
</head>

<body>

<header>
    <h1>小说家</h1>
    <p>小说作者创作平台</p>
</header>

<main class="container">

    <div class="top">
        <h2>📚 我的小说</h2>

        <button class="new-button" onclick="showCreateMenu()">
            ＋ 新建
        </button>
    </div>

    <div id="novelList" class="novel-list"></div>

</main>


<!-- 新建菜单 -->

<div id="createMenu" class="modal">

    <div class="modal-box">

        <h2>新建</h2>

        <button class="menu-button" onclick="showNovelModal()">
            📖 新建作品
        </button>

        <button class="menu-button" onclick="createGroup()">
            📁 新建分组
        </button>

        <div class="actions">

            <button class="cancel" onclick="hideCreateMenu()">
                取消
            </button>

        </div>

    </div>

</div>


<!-- 新建作品 -->

<div id="novelModal" class="modal">

    <div class="modal-box">

        <h2>新建作品</h2>

        <label>作品名称</label>

        <input
            id="novelName"
            type="text"
            placeholder="请输入作品名称"
        >

        <label>作品类型</label>

        <select id="novelType">

            <option value="原创小说">
                原创小说
            </option>

            <option value="同人小说">
                同人小说
            </option>

        </select>

        <label>作品简介</label>

        <textarea
            id="novelDescription"
            placeholder="简单介绍一下你的作品"
        ></textarea>

        <div class="actions">

            <button
                class="cancel"
                onclick="hideNovelModal()"
            >
                取消
            </button>

            <button
                class="create"
                onclick="createNovel()"
            >
                创建作品
            </button>

        </div>

    </div>

</div>


<script>

let novels = JSON.parse(
    localStorage.getItem("novels") || "[]"
);


/* 保存作品 */

function saveNovels() {

    localStorage.setItem(
        "novels",
        JSON.stringify(novels)
    );

}


/* 打开「新建」菜单 */

function showCreateMenu() {

    document.getElementById(
        "createMenu"
    ).style.display = "flex";

}


/* 关闭「新建」菜单 */

function hideCreateMenu() {

    document.getElementById(
        "createMenu"
    ).style.display = "none";

}


/* 点击「新建作品」 */

function showNovelModal() {

    hideCreateMenu();

    document.getElementById(
        "novelModal"
    ).style.display = "flex";

    document.getElementById(
        "novelName"
    ).focus();

}


/* 关闭新建作品 */

function hideNovelModal() {

    document.getElementById(
        "novelModal"
    ).style.display = "none";

    document.getElementById(
        "novelName"
    ).value = "";

    document.getElementById(
        "novelDescription"
    ).value = "";

}


/* 创建作品 */

function createNovel() {

    const name =
        document
        .getElementById("novelName")
        .value
        .trim();

    const type =
        document
        .getElementById("novelType")
        .value;

    const description =
        document
        .getElementById("novelDescription")
        .value
        .trim();


    if (!name) {

        alert("请输入作品名称");

        return;

    }


    const novel = {

        id: Date.now(),

        name: name,

        type: type,

        description: description,

        chapters: [],

        createdAt:
            new Date().toLocaleDateString(),

        updatedAt: "刚刚"

    };


    novels.unshift(novel);

    saveNovels();

    hideNovelModal();

    renderNovels();

}


/* 新建分组 */

function createGroup() {

    hideCreateMenu();

    alert(
        "分组功能正在开发中。"
    );

}


/* 显示作品 */

function renderNovels() {

    const list =
        document.getElementById(
            "novelList"
        );


    if (novels.length === 0) {

        list.innerHTML = `

            <div class="empty">

                <div style="font-size:40px;">
                    📚
                </div>

                <p>
                    还没有作品
                </p>

                <p>
                    点击「＋ 新建」开始创作
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML = novels.map(
        novel => `

        <div class="novel">

            <h3>
                ${escapeHTML(novel.name)}
            </h3>

            <p>
                ${escapeHTML(novel.type)}
            </p>

            <p>
                章节：${novel.chapters.length}章
            </p>

            <p>
                最近编辑：
                ${escapeHTML(novel.updatedAt)}
            </p>

            <button
                class="continue"
                onclick="openNovel(${novel.id})"
            >
                继续写作 →
            </button>

        </div>

    `
    ).join("");

}


/* 打开作品 */

function openNovel(id) {

    const novel =
        novels.find(
            item => item.id === id
        );

    if (!novel) return;


    alert(
        "《" +
        novel.name +
        "》的写作页面下一步制作。"
    );

}


/* 防止特殊字符破坏页面 */

function escapeHTML(text) {

    return text

        .replaceAll("&", "&amp;")

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


renderNovels();

</script>

</body>
</html>
