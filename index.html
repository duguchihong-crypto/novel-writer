<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>我的书架</title>


<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;
}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f5f6f8;

    color: #222;

    padding-top: 70px;

    min-height: 100vh;
}


/* ==================================================
   顶部
================================================== */

header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    background: #fff;

    border-bottom:
        1px solid #e5e5e5;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px;

    z-index: 1000;
}


.logo {

    font-size: 21px;

    font-weight: 700;

    color: #222;
}


.new-book-button {

    border: none;

    background: #4f7cff;

    color: #fff;

    padding:
        11px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-family: inherit;

    font-size: 15px;

    font-weight: 500;

    transition:
        background 0.2s;
}


.new-book-button:hover {

    background: #3d68e6;
}


.new-book-button:active {

    transform: scale(0.98);
}


/* ==================================================
   内容
================================================== */

.container {

    max-width: 1000px;

    margin:
        40px auto;

    padding:
        0 20px;
}


.page-title {

    margin-bottom: 25px;
}


.page-title h1 {

    margin: 0;

    font-size: 28px;
}


/* ==================================================
   书籍
================================================== */

#books {

    display: flex;

    flex-direction: column;

    gap: 15px;
}


.book {

    position: relative;

    background: #fff;

    border:
        1px solid #e5e5e5;

    border-radius: 12px;

    padding: 18px;

    display: flex;

    align-items: center;

    gap: 18px;

    min-height: 130px;

    transition:
        border-color 0.2s,
        transform 0.2s;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;

    touch-action: manipulation;
}


.book:hover {

    border-color: #cfd5df;

    transform:
        translateY(-1px);
}


/* ==================================================
   长按时
================================================== */

.book.long-pressing {

    transform: scale(0.985);

    background: #f8f9fc;

    border-color: #bfc8da;
}


/* ==================================================
   封面
================================================== */

.book-cover {

    flex:
        0 0 72px;

    width: 72px;

    height: 96px;

    border-radius: 7px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #eef1f5,
            #dfe4eb
        );

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    -webkit-user-select: none;

    user-select: none;
}


.book-cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


.default-cover {

    font-size: 34px;
}


/* ==================================================
   书名
================================================== */

.book-info {

    flex: 1;

    min-width: 0;
}


.book-title {

    display: inline-block;

    font-size: 19px;

    font-weight: 600;

    line-height: 1.4;

    color: #222;

    cursor: pointer;

    word-break: break-word;
}


.book-title:hover {

    color: #4f7cff;
}


/* ==================================================
   删除按钮
================================================== */

.delete-book-button {

    flex:
        0 0 auto;

    border: none;

    background: transparent;

    color: #aaa;

    width: 36px;

    height: 36px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 17px;
}


.delete-book-button:hover {

    color: #e5484d;

    background: #fff0f0;
}


/* ==================================================
   没有小说
================================================== */

.empty {

    text-align: center;

    padding:
        80px 20px;

    background: #fff;

    border-radius: 12px;

    color: #888;
}


/* ==================================================
   长按菜单遮罩
================================================== */

.context-menu-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.08);

    z-index: 3000;

    display: none;
}


.context-menu-overlay.show {

    display: block;
}


/* ==================================================
   长按菜单
================================================== */

.book-context-menu {

    position: fixed;

    width: 220px;

    max-width:
        calc(100vw - 30px);

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,0.18);

    overflow: hidden;

    z-index: 3001;

    display: none;

    transform-origin:
        center center;

    animation:
        menuAppear 0.15s ease-out;
}


.book-context-menu.show {

    display: block;
}


@keyframes menuAppear {

    from {

        opacity: 0;

        transform:
            scale(0.94);

    }

    to {

        opacity: 1;

        transform:
            scale(1);

    }

}


/* ==================================================
   菜单项目
================================================== */

.context-menu-item {

    width: 100%;

    min-height: 52px;

    border: none;

    border-bottom:
        1px solid #f0f0f0;

    background: #fff;

    display: flex;

    align-items: center;

    padding:
        0 18px;

    font-family: inherit;

    font-size: 15px;

    color: #222;

    text-align: left;

    cursor: pointer;
}


.context-menu-item:last-child {

    border-bottom: none;
}


.context-menu-item:active {

    background: #f5f6f8;
}


.context-menu-item.delete-item {

    color: #e5484d;
}


.context-menu-icon {

    width: 30px;

    font-size: 17px;

    margin-right: 5px;
}


/* ==================================================
   排序模式
================================================== */

.sort-mode .book {

    cursor: grab;
}


.sort-mode .book:active {

    cursor: grabbing;
}


.sort-mode .delete-book-button {

    display: none;
}


.sort-hint {

    display: none;

    margin-bottom: 15px;

    padding:
        11px 14px;

    background: #eef3ff;

    color: #4f6fc7;

    border-radius: 9px;

    font-size: 13px;

    text-align: center;
}


.sort-mode .sort-hint {

    display: block;
}


.finish-sort-button {

    display: none;

    border: none;

    background: #4f7cff;

    color: #fff;

    padding:
        9px 14px;

    border-radius: 8px;

    font-family: inherit;

    cursor: pointer;
}


.sort-mode .finish-sort-button {

    display: block;
}


.sort-mode .new-book-button {

    display: none;
}


/* ==================================================
   手机
================================================== */

@media (max-width: 600px) {

    header {

        padding:
            0 15px;
    }


    .logo {

        font-size: 18px;
    }


    .new-book-button {

        padding:
            9px 13px;

        font-size: 14px;
    }


    .finish-sort-button {

        font-size: 14px;
    }


    .container {

        margin-top: 25px;

        padding:
            0 14px;
    }


    .page-title h1 {

        font-size: 24px;
    }


    .book {

        min-height: 112px;

        padding: 14px;

        gap: 14px;
    }


    .book-cover {

        flex-basis: 62px;

        width: 62px;

        height: 82px;
    }


    .default-cover {

        font-size: 29px;
    }


    .book-title {

        font-size: 17px;
    }


    .book-context-menu {

        width:
            calc(100vw - 30px);

        max-width: 360px;

        left: 50% !important;

        top: 50% !important;

        transform:
            translate(-50%, -50%);
    }

}


/* ==================================================
   防止 iOS 长按选中文字
================================================== */

.book,
.book *,
.book-context-menu,
.book-context-menu * {

    -webkit-user-select: none;

    user-select: none;

    -webkit-touch-callout: none;
}

</style>

</head>


<body>


<!-- ==================================================
     顶部
================================================== -->

<header>

    <div class="logo">
        🌍 我的世界
    </div>


    <div>

        <button
            id="finishSortButton"
            class="finish-sort-button"
            type="button"
        >
            完成
        </button>


        <button
            id="newBookButton"
            class="new-book-button"
            type="button"
        >
            ＋ 新建小说
        </button>

    </div>

</header>


<!-- ==================================================
     内容
================================================== -->

<div class="container">

    <div class="page-title">

        <h1>
            我的小说
        </h1>

    </div>


    <div
        id="sortHint"
        class="sort-hint"
    >
        长按并拖动小说，可以调整书架顺序
    </div>


    <div id="books"></div>

</div>


<!-- ==================================================
     长按菜单遮罩
================================================== -->

<div
    id="contextMenuOverlay"
    class="context-menu-overlay"
></div>


<!-- ==================================================
     长按菜单
================================================== -->

<div
    id="bookContextMenu"
    class="book-context-menu"
>

    <button
        id="editMenuButton"
        class="context-menu-item"
        type="button"
    >

        <span class="context-menu-icon">
            ✏️
        </span>

        <span>
            编辑
        </span>

    </button>


    <button
        id="sortMenuButton"
        class="context-menu-item"
        type="button"
    >

        <span class="context-menu-icon">
            ↕️
        </span>

        <span>
            书架排序
        </span>

    </button>


    <button
        id="groupMenuButton"
        class="context-menu-item"
        type="button"
    >

        <span class="context-menu-icon">
            📁
        </span>

        <span>
            移至分组
        </span>

    </button>


    <button
        id="deleteMenuButton"
        class="context-menu-item delete-item"
        type="button"
    >

        <span class="context-menu-icon">
            🗑️
        </span>

        <span>
            删除书籍
        </span>

    </button>

</div>


<script>


// ==================================================
// 基础数据
// ==================================================

let books = [];

let longPressTimer = null;

let longPressTriggered = false;

let longPressBookId = null;

let pressStartX = 0;

let pressStartY = 0;

let isSorting = false;


// ==================================================
// DOM
// ==================================================

const booksContainer =
    document.getElementById(
        "books"
    );


const newBookButton =
    document.getElementById(
        "newBookButton"
    );


const finishSortButton =
    document.getElementById(
        "finishSortButton"
    );


const contextMenu =
    document.getElementById(
        "bookContextMenu"
    );


const contextMenuOverlay =
    document.getElementById(
        "contextMenuOverlay"
    );


const editMenuButton =
    document.getElementById(
        "editMenuButton"
    );


const sortMenuButton =
    document.getElementById(
        "sortMenuButton"
    );


const groupMenuButton =
    document.getElementById(
        "groupMenuButton"
    );


const deleteMenuButton =
    document.getElementById(
        "deleteMenuButton"
    );


// ==================================================
// 读取书架
// ==================================================

function loadBooks() {

    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    if (!savedBooks) {

        books = [];

        return;

    }


    try {

        const parsed =
            JSON.parse(
                savedBooks
            );


        if (Array.isArray(parsed)) {

            books = parsed;

        } else {

            books = [];

        }

    } catch (error) {

        console.error(
            "读取书架失败：",
            error
        );

        books = [];

    }

}


// ==================================================
// 保存书架
// ==================================================

function saveBooks() {

    try {

        localStorage.setItem(
            "novelBooks",
            JSON.stringify(
                books
            )
        );

        return true;

    } catch (error) {

        console.error(
            "保存书架失败：",
            error
        );

        alert(
            "保存失败，浏览器储存空间可能不足。"
        );

        return false;

    }

}


// ==================================================
// 渲染书架
// ==================================================

function renderBooks() {

    booksContainer.innerHTML =
        "";


    if (!books.length) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty";


        empty.textContent =
            "还没有小说";


        booksContainer.appendChild(
            empty
        );


        return;

    }


    books.forEach(
        function(book) {

            const bookElement =
                createBookElement(
                    book
                );


            booksContainer.appendChild(
                bookElement
            );

        }
    );

}


// ==================================================
// 创建书籍
// ==================================================

function createBookElement(book) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "book";


    element.dataset.bookId =
        String(book.id);


    // ------------------------------------------
    // 封面
    // ------------------------------------------

    const cover =
        document.createElement(
            "div"
        );


    cover.className =
        "book-cover";


    if (
        typeof book.cover === "string" &&
        book.cover.length > 0
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            book.cover;


        image.alt =
            "小说封面";


        cover.appendChild(
            image
        );

    } else {

        const defaultCover =
            document.createElement(
                "div"
            );


        defaultCover.className =
            "default-cover";


        defaultCover.textContent =
            "📖";


        cover.appendChild(
            defaultCover
        );

    }


    // ------------------------------------------
    // 点击封面
    // ------------------------------------------

    cover.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            if (longPressTriggered) {

                longPressTriggered =
                    false;

                return;

            }


            if (isSorting) {

                return;

            }


            editBook(
                book.id
            );

        }
    );


    element.appendChild(
        cover
    );


    // ------------------------------------------
    // 书籍信息
    // ------------------------------------------

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "book-info";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "book-title";


    title.textContent =
        book.title ||
        "未命名小说";


    title.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            if (longPressTriggered) {

                longPressTriggered =
                    false;

                return;

            }


            if (isSorting) {

                return;

            }


            openBook(
                book.id
            );

        }
    );


    info.appendChild(
        title
    );


    element.appendChild(
        info
    );


    // ------------------------------------------
    // 删除按钮
    // ------------------------------------------

    const deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "delete-book-button";


    deleteButton.type =
        "button";


    deleteButton.textContent =
        "🗑️";


    deleteButton.title =
        "删除小说";


    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            deleteBook(
                book.id
            );

        }
    );


    element.appendChild(
        deleteButton
    );


    // ------------------------------------------
    // 长按
    // ------------------------------------------

    setupLongPress(
        element,
        book.id
    );


    return element;

}


// ==================================================
// 长按检测
// ==================================================

function setupLongPress(
    element,
    bookId
) {

    element.addEventListener(
        "pointerdown",
        function(event) {

            /*
             * 只处理主指针。
             */

            if (
                event.isPrimary === false
            ) {

                return;

            }


            /*
             * 排序模式下不打开长按菜单。
             */

            if (isSorting) {

                return;

            }


            clearLongPressTimer();


            longPressTriggered =
                false;


            longPressBookId =
                bookId;


            pressStartX =
                event.clientX;


            pressStartY =
                event.clientY;


            element.classList.add(
                "long-pressing"
            );


            longPressTimer =
                setTimeout(
                    function() {

                        longPressTriggered =
                            true;


                        element.classList.remove(
                            "long-pressing"
                        );


                        showContextMenu(
                            bookId
                        );

                    },
                    600
                );

        }
    );


    element.addEventListener(
        "pointermove",
        function(event) {

            if (!longPressTimer) {

                return;

            }


            const dx =
                event.clientX -
                pressStartX;


            const dy =
                event.clientY -
                pressStartY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            /*
             * 手指移动超过 10px，
             * 认为用户是在滑动，而不是长按。
             */

            if (distance > 10) {

                cancelLongPress(
                    element
                );

            }

        }
    );


    element.addEventListener(
        "pointerup",
        function() {

            cancelLongPress(
                element
            );

        }
    );


    element.addEventListener(
        "pointercancel",
        function() {

            cancelLongPress(
                element
            );

        }
    );


    /*
     * 防止电脑右键出现浏览器默认菜单。
     */

    element.addEventListener(
        "contextmenu",
        function(event) {

            event.preventDefault();

        }
    );

}


// ==================================================
// 取消长按
// ==================================================

function cancelLongPress(element) {

    if (longPressTimer) {

        clearTimeout(
            longPressTimer
        );

        longPressTimer =
            null;

    }


    if (element) {

        element.classList.remove(
            "long-pressing"
        );

    }

}


// ==================================================
// 清除长按
// ==================================================

function clearLongPressTimer() {

    if (longPressTimer) {

        clearTimeout(
            longPressTimer
        );

        longPressTimer =
            null;

    }

}


// ==================================================
// 显示菜单
// ==================================================

function showContextMenu(bookId) {

    longPressBookId =
        bookId;


    contextMenuOverlay.classList.add(
        "show"
    );


    contextMenu.classList.add(
        "show"
    );


    /*
     * 手机端居中。
     */

    if (
        window.innerWidth <= 600
    ) {

        contextMenu.style.left =
            "50%";

        contextMenu.style.top =
            "50%";

        contextMenu.style.transform =
            "translate(-50%, -50%)";

        return;

    }


    /*
     * 电脑端尽量出现在
     * 长按位置附近。
     */

    let x =
        pressStartX;


    let y =
        pressStartY;


    const width =
        220;


    const height =
        208;


    const margin =
        10;


    if (
        x + width >
        window.innerWidth -
        margin
    ) {

        x =
            window.innerWidth -
            width -
            margin;

    }


    if (
        y + height >
        window.innerHeight -
        margin
    ) {

        y =
            window.innerHeight -
            height -
            margin;

    }


    x =
        Math.max(
            margin,
            x
        );


    y =
        Math.max(
            margin,
            y
        );


    contextMenu.style.left =
        x + "px";


    contextMenu.style.top =
        y + "px";


    contextMenu.style.transform =
        "none";

}


// ==================================================
// 关闭菜单
// ==================================================

function closeContextMenu() {

    contextMenuOverlay.classList.remove(
        "show"
    );


    contextMenu.classList.remove(
        "show"
    );


    longPressBookId =
        null;

}


// ==================================================
// 点击遮罩关闭
// ==================================================

contextMenuOverlay.addEventListener(
    "click",
    function() {

        closeContextMenu();

    }
);


// ==================================================
// 编辑
// ==================================================

editMenuButton.addEventListener(
    "click",
    function() {

        const bookId =
            longPressBookId;


        closeContextMenu();


        if (!bookId) {

            return;

        }


        editBook(
            bookId
        );

    }
);


// ==================================================
// 编辑小说
// ==================================================

function editBook(bookId) {

    localStorage.setItem(
        "currentBookId",
        String(bookId)
    );


    localStorage.removeItem(
        "currentChapterId"
    );


    window.location.href =
        "edit-book.html";

}


// ==================================================
// 打开小说
// ==================================================

function openBook(bookId) {

    localStorage.setItem(
        "currentBookId",
        String(bookId)
    );


    localStorage.removeItem(
        "currentChapterId"
    );


    window.location.href =
        "book.html";

}


// ==================================================
// 新建小说
// ==================================================

newBookButton.addEventListener(
    "click",
    function() {

        window.location.href =
            "create-book.html";

    }
);


// ==================================================
// 删除书籍
// ==================================================

function deleteBook(bookId) {

    const book =
        books.find(
            function(item) {

                return String(item.id) ===
                    String(bookId);

            }
        );


    if (!book) {

        return;

    }


    const confirmed =
        window.confirm(
            "确定要删除《" +
            (book.title || "未命名小说") +
            "》吗？\n\n删除后无法恢复。"
        );


    if (!confirmed) {

        return;

    }


    books =
        books.filter(
            function(item) {

                return String(item.id) !==
                    String(bookId);

            }
        );


    saveBooks();


    /*
     * 如果删除的是当前小说，
     * 清除当前书籍状态。
     */

    if (
        String(
            localStorage.getItem(
                "currentBookId"
            )
        ) ===
        String(bookId)
    ) {

        localStorage.removeItem(
            "currentBookId"
        );

        localStorage.removeItem(
            "currentChapterId"
        );

    }


    renderBooks();

}


// ==================================================
// 书架排序
// ==================================================

sortMenuButton.addEventListener(
    "click",
    function() {

        closeContextMenu();


        enterSortMode();

    }
);


// ==================================================
// 进入排序模式
// ==================================================

function enterSortMode() {

    if (isSorting) {

        return;

    }


    isSorting =
        true;


    document.body.classList.add(
        "sort-mode"
    );


    enableSorting();

}


// ==================================================
// 完成排序
// ==================================================

finishSortButton.addEventListener(
    "click",
    function() {

        finishSorting();

    }
);


// ==================================================
// 完成排序
// ==================================================

function finishSorting() {

    if (!isSorting) {

        return;

    }


    isSorting =
        false;


    document.body.classList.remove(
        "sort-mode"
    );


    saveBooks();


    renderBooks();

}


// ==================================================
// 排序
// ==================================================

function enableSorting() {

    const bookElements =
        Array.from(
            document.querySelectorAll(
                ".book"
            )
        );


    let draggingElement =
        null;


    bookElements.forEach(
        function(element) {

            element.draggable =
                true;


            element.addEventListener(
                "dragstart",
                function() {

                    draggingElement =
                        element;

                }
            );


            element.addEventListener(
                "dragover",
                function(event) {

                    event.preventDefault();


                    if (
                        !draggingElement ||
                        draggingElement ===
                        element
                    ) {

                        return;

                    }


                    const rect =
                        element.getBoundingClientRect();


                    const middle =
                        rect.top +
                        rect.height / 2;


                    if (
                        event.clientY <
                        middle
                    ) {

                        booksContainer.insertBefore(
                            draggingElement,
                            element
                        );

                    } else {

                        booksContainer.insertBefore(
                            draggingElement,
                            element.nextSibling
                        );

                    }

                }
            );


            element.addEventListener(
                "dragend",
                function() {

                    updateBooksFromDOM();

                }
            );

        }
    );

}


// ==================================================
// 根据 DOM 更新顺序
// ==================================================

function updateBooksFromDOM() {

    const elements =
        Array.from(
            document.querySelectorAll(
                "#books .book"
            )
        );


    const newBooks =
        [];


    elements.forEach(
        function(element) {

            const id =
                element.dataset.bookId;


            const book =
                books.find(
                    function(item) {

                        return String(item.id) ===
                            String(id);

                    }
                );


            if (book) {

                newBooks.push(
                    book
                );

            }

        }
    );


    if (
        newBooks.length ===
        books.length
    ) {

        books =
            newBooks;

    }

}


// ==================================================
// 移至分组
// ==================================================

groupMenuButton.addEventListener(
    "click",
    function() {

        const bookId =
            longPressBookId;


        closeContextMenu();


        if (!bookId) {

            return;

        }


        /*
         * 目前先做功能入口。
         *
         * 后面正式加入：
         *
         * 未分组
         * 玄幻
         * 宝可梦
         * 哆啦A梦
         * 原创
         * 等。
         */

        showGroupMessage(
            bookId
        );

    }
);


// ==================================================
// 分组提示
// ==================================================

function showGroupMessage(bookId) {

    const book =
        books.find(
            function(item) {

                return String(item.id) ===
                    String(bookId);

            }
        );


    if (!book) {

        return;

    }


    window.alert(
        "《" +
        (book.title || "未命名小说") +
        "》\n\n移至分组功能已打开。\n\n分组系统下一步可以在这里加入。"
    );

}


// ==================================================
// 页面点击
// ==================================================

document.addEventListener(
    "click",
    function(event) {

        /*
         * 如果菜单打开，
         * 点击菜单之外的位置关闭菜单。
         */

        if (
            contextMenu.classList.contains(
                "show"
            )
        ) {

            if (
                !contextMenu.contains(
                    event.target
                ) &&
                !contextMenuOverlay.contains(
                    event.target
                )
            ) {

                closeContextMenu();

            }

        }

    }
);


// ==================================================
// 初始化
// ==================================================

loadBooks();

renderBooks();

</script>
