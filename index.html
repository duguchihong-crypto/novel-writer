<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说家</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f7f8;
    color: #222;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    height: 70px;
    background: white;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
}

.logo {
    font-size: 22px;
    font-weight: 700;
}

.subtitle {
    font-size: 13px;
    color: #999;
    margin-top: 3px;
}

.header-left {
    display: flex;
    flex-direction: column;
}

.new-btn {
    border: none;
    background: #222;
    color: white;
    border-radius: 9px;
    padding: 11px 17px;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 35px 20px;
}

.page-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.page-title h1 {
    font-size: 24px;
    margin: 0;
}

.empty {
    background: white;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 70px 20px;
    text-align: center;
    color: #999;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty-title {
    color: #444;
    font-size: 17px;
    margin-bottom: 8px;
}

.novels {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
}

.novel-card {
    background: white;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 16px;
    display: flex;
    gap: 15px;
    transition: 0.2s;
}

.novel-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

.novel-cover {
    width: 82px;
    height: 112px;
    border-radius: 8px;
    background: #f1f1f1;
    object-fit: cover;
    flex-shrink: 0;
}

.novel-info {
    flex: 1;
    min-width: 0;
}

.novel-name {
    font-weight: 600;
    font-size: 17px;
    margin-bottom: 9px;
    word-break: break-all;
}

.novel-description {
    color: #999;
    font-size: 13px;
    line-height: 1.5;
    height: 40px;
    overflow: hidden;
}

.novel-meta {
    color: #aaa;
    font-size: 12px;
    margin-top: 8px;
}

.continue-btn {
    margin-top: 12px;
    border: none;
    background: #222;
    color: white;
    padding: 7px 12px;
    border-radius: 7px;
    font-size: 12px;
}

/* 弹窗 */

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal {
    width: 100%;
    max-width: 460px;
    background: white;
    border-radius: 16px;
    padding: 25px;
}

.modal h2 {
    margin-top: 0;
    margin-bottom: 22px;
}

.modal label {
    display: block;
    font-size: 14px;
    margin: 16px 0 8px;
    color: #444;
}

.modal input,
.modal textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 11px 12px;
    outline: none;
}

.modal textarea {
    min-height: 100px;
    resize: vertical;
}

.cover-upload {
    width: 120px;
    height: 160px;
    border: 1px dashed #d5d5d5;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    cursor: pointer;
    overflow: hidden;
    background: #fafafa;
}

.cover-upload span {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
}

.cover-upload strong {
    font-size: 30px;
    font-weight: 300;
}

.cover-upload small {
    font-size: 12px;
}

.cover-upload img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
}

.cancel,
.create {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
}

.cancel {
    background: #f1f1f1;
}

.create {
    background: #222;
    color: white;
}

/* 新建菜单 */

.menu-bg {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 90;
}

.new-menu {
    position: absolute;
    top: 62px;
    right: 28px;
    width: 170px;
    background: white;
    border: 1px solid #eee;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    padding: 7px;
}

.menu-item {
    padding: 11px 12px;
    border-radius: 8px;
    font-size: 14px;
}

.menu-item:hover {
    background: #f5f5f5;
}

/* 作品页面 */

.work-page {
    display: none;
}

.back-btn {
    border: none;
    background: transparent;
    color: #666;
    padding: 0;
    margin-bottom: 22px;
}

.work-header {
    background: white;
    border: 1px solid #eee;
    border-radius: 15px;
    padding: 22px;
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.work-cover {
    width: 100px;
    height: 135px;
    border-radius: 9px;
    object-fit: cover;
    background: #eee;
}

.work-info {
    flex: 1;
}

.work-info h1 {
    margin: 5px 0 10px;
    font-size: 25px;
}

.work-info p {
    color: #888;
    line-height: 1.6;
    margin: 0;
}

.chapter-box {
    background: white;
    border: 1px solid #eee;
    border-radius: 15px;
    overflow: hidden;
}

.chapter-title {
    padding: 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chapter-title h2 {
    margin: 0;
    font-size: 18px;
}

.add-chapter {
    border: none;
    background: #222;
    color: white;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
}

.chapter-empty {
    padding: 55px 20px;
    text-align: center;
    color: #999;
}

.chapter-item {
    padding: 17px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chapter-item:last-child {
    border-bottom: none;
}

.chapter-name {
    font-size: 15px;
}

.chapter-date {
    color: #aaa;
    font-size: 12px;
}

.chapter-open {
    border: none;
    background: #f3f3f3;
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 12px;
}

/* 写作页面 */

.editor-page {
    display: none;
    min-height: calc(100vh - 70px);
}

.editor-top {
    height: 65px;
    background: white;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 15px;
}

.editor-back {
    border: none;
    background: transparent;
    color: #666;
}

.chapter-input {
    border: none;
    outline: none;
    font-size: 18px;
    font-weight: 600;
    flex: 1;
}

.save-btn {
    border: none;
    background: #222;
    color: white;
    padding: 9px 15px;
    border-radius: 8px;
}

.editor-area {
    max-width: 850px;
    margin: 35px auto;
    padding: 0 20px;
}

.content-editor {
    width: 100%;
    min-height: 65vh;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-size: 17px;
    line-height: 2;
}

.word-count {
    position: fixed;
    right: 20px;
    bottom: 15px;
    color: #aaa;
    font-size: 12px;
}

@media (max-width: 600px) {

    .header {
        padding: 0 15px;
    }

    .container {
        padding: 25px 15px;
    }

    .work-header {
        padding: 16px;
    }

    .work-cover {
        width: 80px;
        height: 108px;
    }

    .work-info h1 {
        font-size: 20px;
    }

    .editor-area {
        margin-top: 20px;
    }
}
</style>
</head>

<body>

<!-- 首页 -->

<div id="homePage">

    <header class="header">
        <div class="header-left">
            <div class="logo">小说家</div>
            <div class="subtitle">小说作者创作平台</div>
        </div>

        <button class="new-btn" onclick="showNewMenu()">
            ＋ 新建
        </button>
    </header>

    <div class="container">

        <div class="page-title">
            <h1>📚 我的小说</h1>
        </div>

        <div id="novelList"></div>

    </div>
</div>


<!-- 新建菜单 -->

<div id="menuBg" class="menu-bg" onclick="hideNewMenu()">

    <div class="new-menu" onclick="event.stopPropagation()">

        <div class="menu-item" onclick="showNovelModal()">
            📖 新建作品
        </div>

        <div class="menu-item" onclick="createGroup()">
            📁 新建分组
        </div>

        <div class="menu-item" onclick="hideNewMenu()">
            取消
        </div>

    </div>
</div>


<!-- 新建作品弹窗 -->

<div id="novelModal" class="modal-bg">

    <div class="modal">

        <h2>新建作品</h2>

        <label>作品名称</label>

        <input
            id="novelName"
            type="text"
            placeholder="请输入作品名称"
        >

        <label>添加封面</label>

        <label class="cover-upload" for="coverInput">

            <span id="coverText">
                <strong>＋</strong>
                <small>添加封面</small>
            </span>

            <img
                id="coverPreview"
                style="display:none;"
            >

        </label>

        <input
            id="coverInput"
            type="file"
            accept="image/*"
            style="display:none;"
            onchange="previewCover(event)"
        >

        <label>简介</label>

        <textarea
            id="novelDescription"
            placeholder="简介内容"
        ></textarea>

        <div class="actions">

            <button
                class="cancel"
                onclick="hideNovelModal()"
            >
                取消
            </button>

            <button
                class="create"
                onclick="createNovel()"
            >
                创建作品
            </button>

        </div>

    </div>

</div>


<!-- 作品页面 -->

<div id="workPage" class="work-page">

    <header class="header">

        <div class="header-left">
            <div class="logo">小说家</div>
            <div class="subtitle">作品管理</div>
        </div>

    </header>

    <div class="container">

        <button
            class="back-btn"
            onclick="backHome()"
        >
            ← 返回我的小说
        </button>

        <div class="work-header">

            <img
                id="workCover"
                class="work-cover"
            >

            <div class="work-info">

                <h1 id="workName"></h1>

                <p id="workDescription"></p>

            </div>

        </div>

        <div class="chapter-box">

            <div class="chapter-title">

                <h2>📖 章节</h2>

                <button
                    class="add-chapter"
                    onclick="newChapter()"
                >
                    ＋ 新建章节
                </button>

            </div>

            <div id="chapterList"></div>

        </div>

    </div>

</div>


<!-- 写作页面 -->

<div id="editorPage" class="editor-page">

    <div class="editor-top">

        <button
            class="editor-back"
            onclick="backToWork()"
        >
            ← 返回
        </button>

        <input
            id="chapterTitle"
            class="chapter-input"
            placeholder="章节标题"
        >

        <button
            class="save-btn"
            onclick="saveChapter()"
        >
            保存
        </button>

    </div>

    <div class="editor-area">

        <textarea
            id="chapterContent"
            class="content-editor"
            placeholder="在这里开始写作……"
            oninput="updateWordCount()"
        ></textarea>

    </div>

    <div
        id="wordCount"
        class="word-count"
    >
        0 字
    </div>

</div>


<script>

/* =========================
   数据
========================= */

let novels =
    JSON.parse(
        localStorage.getItem("novels") || "[]"
    );

let selectedCover = "";

let currentNovelId = null;

let currentChapterId = null;


/* =========================
   首页
========================= */

function renderNovels() {

    const list =
        document.getElementById("novelList");

    if (novels.length === 0) {

        list.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    📖
                </div>

                <div class="empty-title">
                    还没有作品
                </div>

                <div>
                    点击右上角「＋ 新建」开始创作
                </div>

            </div>
        `;

        return;
    }

    list.innerHTML =
        `<div class="novels">
            ${
                novels.map(novel => `

                    <div class="novel-card">

                        <img
                            class="novel-cover"
                            src="${novel.cover || createDefaultCover()}"
                        >

                        <div class="novel-info">

                            <div class="novel-name">
                                ${escapeHTML(novel.name)}
                            </div>

                            <div class="novel-description">
                                ${
                                    escapeHTML(
                                        novel.description ||
                                        "暂无简介"
                                    )
                                }
                            </div>

                            <div class="novel-meta">
                                ${
                                    novel.chapters.length
                                } 章
                                ·
                                ${
                                    novel.updated
                                }
                            </div>

                            <button
                                class="continue-btn"
                                onclick="openWork('${novel.id}')"
                            >
                                继续写作
                            </button>

                        </div>

                    </div>

                `).join("")
            }
        </div>`;
}


/* =========================
   新建菜单
========================= */

function showNewMenu() {

    document.getElementById("menuBg")
        .style.display = "block";
}

function hideNewMenu() {

    document.getElementById("menuBg")
        .style.display = "none";
}

function createGroup() {

    hideNewMenu();

    alert("分组功能正在开发中。");
}


/* =========================
   新建作品
========================= */

function showNovelModal() {

    hideNewMenu();

    document.getElementById("novelModal")
        .style.display = "flex";
}

function hideNovelModal() {

    document.getElementById("novelModal")
        .style.display = "none";

    document.getElementById("novelName")
        .value = "";

    document.getElementById("novelDescription")
        .value = "";

    selectedCover = "";

    document.getElementById("coverInput")
        .value = "";

    document.getElementById("coverText")
        .style.display = "flex";

    document.getElementById("coverPreview")
        .style.display = "none";
}

function previewCover(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        selectedCover = e.target.result;

        const preview =
            document.getElementById("coverPreview");

        preview.src = selectedCover;

        preview.style.display = "block";

        document.getElementById("coverText")
            .style.display = "none";
    };

    reader.readAsDataURL(file);
}

function createNovel() {

    const name =
        document.getElementById("novelName")
            .value.trim();

    const description =
        document.getElementById("novelDescription")
            .value.trim();

    if (!name) {

        alert("请输入作品名称");

        return;
    }

    const now =
        new Date().toLocaleDateString();

    const novel = {

        id:
            Date.now().toString(),

        name:
            name,

        description:
            description,

        cover:
            selectedCover,

        chapters:
            [],

        created:
            now,

        updated:
            now
    };

    novels.push(novel);

    saveNovels();

    hideNovelModal();

    renderNovels();
}


/* =========================
   作品页面
========================= */

function openWork(id) {

    currentNovelId = id;

    const novel =
        novels.find(
            n => n.id === id
        );

    if (!novel) return;

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("workPage")
        .style.display = "block";

    document.getElementById("editorPage")
        .style.display = "none";

    document.getElementById("workName")
        .textContent = novel.name;

    document.getElementById("workDescription")
        .textContent =
            novel.description ||
            "暂无简介";

    document.getElementById("workCover")
        .src =
            novel.cover ||
            createDefaultCover();

    renderChapters();
}


function backHome() {

    document.getElementById("workPage")
        .style.display = "none";

    document.getElementById("editorPage")
        .style.display = "none";

    document.getElementById("homePage")
        .style.display = "block";

    renderNovels();
}


/* =========================
   章节
========================= */

function renderChapters() {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    const list =
        document.getElementById("chapterList");

    if (!novel || novel.chapters.length === 0) {

        list.innerHTML = `
            <div class="chapter-empty">

                还没有章节

                <br><br>

                点击右上角「＋ 新建章节」
                开始写作

            </div>
        `;

        return;
    }

    list.innerHTML =
        novel.chapters
            .map(chapter => `

                <div class="chapter-item">

                    <div>

                        <div class="chapter-name">
                            ${escapeHTML(
                                chapter.title ||
                                "未命名章节"
                            )}
                        </div>

                        <div class="chapter-date">
                            ${chapter.updated}
                        </div>

                    </div>

                    <button
                        class="chapter-open"
                        onclick="openChapter('${chapter.id}')"
                    >
                        编辑
                    </button>

                </div>

            `)
            .join("");
}


function newChapter() {

    currentChapterId = null;

    document.getElementById("workPage")
        .style.display = "none";

    document.getElementById("editorPage")
        .style.display = "block";

    document.getElementById("chapterTitle")
        .value = "";

    document.getElementById("chapterContent")
        .value = "";

    updateWordCount();

    document.getElementById("chapterTitle")
        .focus();
}


function openChapter(id) {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    if (!novel) return;

    const chapter =
        novel.chapters.find(
            c => c.id === id
        );

    if (!chapter) return;

    currentChapterId = id;

    document.getElementById("workPage")
        .style.display = "none";

    document.getElementById("editorPage")
        .style.display = "block";

    document.getElementById("chapterTitle")
        .value =
            chapter.title;

    document.getElementById("chapterContent")
        .value =
            chapter.content;

    updateWordCount();
}


/* =========================
   保存章节
========================= */

function saveChapter() {

    const title =
        document.getElementById("chapterTitle")
            .value.trim();

    const content =
        document.getElementById("chapterContent")
            .value;

    if (!title) {

        alert("请输入章节标题");

        return;
    }

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    if (!novel) return;

    const now =
        new Date().toLocaleString();

    if (currentChapterId) {

        const chapter =
            novel.chapters.find(
                c => c.id === currentChapterId
            );

        if (chapter) {

            chapter.title =
                title;

            chapter.content =
                content;

            chapter.updated =
                now;
        }

    } else {

        const chapter = {

            id:
                Date.now().toString(),

            title:
                title,

            content:
                content,

            updated:
                now
        };

        novel.chapters.push(chapter);

        currentChapterId =
            chapter.id;
    }

    novel.updated =
        new Date().toLocaleDateString();

    saveNovels();

    alert("章节已保存");

    backToWork();
}


/* =========================
   返回作品
========================= */

function backToWork() {

    document.getElementById("editorPage")
        .style.display = "none";

    document.getElementById("workPage")
        .style.display = "block";

    renderChapters();
}


/* =========================
   字数统计
========================= */

function updateWordCount() {

    const content =
        document.getElementById("chapterContent")
            .value;

    const count =
        content.replace(/\s/g, "").length;

    document.getElementById("wordCount")
        .textContent =
            count + " 字";
}


/* =========================
   保存数据
========================= */

function saveNovels() {

    localStorage.setItem(
        "novels",
        JSON.stringify(novels)
    );
}


/* =========================
   默认封面
========================= */

function createDefaultCover() {

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="200"
                height="280"
            >

                <rect
                    width="100%"
                    height="100%"
                    fill="#eeeeee"
                />

                <text
                    x="50%"
                    y="50%"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    font-size="24"
                    fill="#999999"
                >
                    小说
                </text>

            </svg>
        `);
}


/* =========================
   防止 HTML 注入
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   启动
========================= */

renderNovels();

</script>

</body>
</html>
