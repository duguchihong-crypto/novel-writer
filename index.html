<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说家</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: white;
    padding: 22px 20px;
    border-bottom: 1px solid #e5e5e5;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #888;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.top h2 {
    margin: 0;
}

.new-button {
    background: #222;
    color: white;
    border: none;
    padding: 11px 18px;
    border-radius: 8px;
    font-size: 15px;
}

.novel-list {
    display: grid;
    gap: 16px;
}

.novel {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 20px;
}

.novel h3 {
    margin: 0 0 8px;
}

.novel p {
    margin: 5px 0;
    color: #888;
    font-size: 14px;
}

.continue {
    margin-top: 15px;
    background: #f0f0f0;
    border: none;
    padding: 9px 14px;
    border-radius: 7px;
}

.empty {
    text-align: center;
    color: #999;
    padding: 40px;
}
</style>
</head>

<body>

<header>
    <h1>小说家</h1>
    <p>小说作者创作平台</p>
</header>

<main class="container">

    <div class="top">
        <h2>📚 我的小说</h2>

        <button class="new-button"
                onclick="alert('新建小说功能正在开发中！')">
            ＋ 新建小说
        </button>
    </div>

    <div class="novel-list">

        <div class="novel">
            <h3>原创小说</h3>
            <p>章节：一章</p>
            <p>最近编辑：今天</p>

            <button class="continue"
                    onclick="alert('小说编辑页面正在开发中！')">
                继续写作 →
            </button>
        </div>

        <div class="novel">
            <h3>同人小说</h3>
            <p>章节：一章</p>
            <p>最近编辑：昨天</p>

            <button class="continue"
                    onclick="alert('小说编辑页面正在开发中！')">
                继续写作 →
            </button>
        </div>

    </div>

</main>

</body>
</html>
