<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说家</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: #f7f7f8;
    color: #222;
}

/* =========================
   页面
========================= */

.page {
    display: none;
    min-height: 100vh;
    padding-bottom: 90px;
}

.page.active {
    display: block;
}

/* =========================
   顶部
========================= */

.header {
    height: 62px;
    background: #fff;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 20px;
    font-weight: 700;
}

/* =========================
   主体
========================= */

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 22px 50px;
}

.page-title {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    margin: 10px 0 30px;
}

/* =========================
   顶部新建
========================= */

.create-menu-wrap {
    position: relative;
}

.create-btn {
    border: none;
    background: #222;
    color: #fff;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.create-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 44px;
    width: 165px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,.12);
    padding: 6px;
    z-index: 50;
}

.create-menu.show {
    display: block;
}

.create-menu button {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 11px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.create-menu button:hover {
    background: #f5f5f5;
}

/* =========================
   书架设置
========================= */

.library-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
}

.library-settings {
    position: relative;
}

.settings-btn {
    border: 1px solid #ddd;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.settings-panel {
    display: none;
    position: absolute;
    right: 0;
    top: 43px;
    width: 180px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 13px;
    box-shadow: 0 8px 25px rgba(0,0,0,.1);
    z-index: 40;
}

.settings-panel.show {
    display: block;
}

.settings-title {
    font-size: 13px;
    color: #888;
    margin-bottom: 10px;
}

.mode-buttons {
    display: flex;
    gap: 8px;
}

.mode-btn {
    flex: 1;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 7px;
    padding: 8px 4px;
    cursor: pointer;
}

.mode-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
}

/* =========================
   书架
========================= */

.novels.grid-mode {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 34px 25px;
}

.novels.grid-mode .novel-card {
    text-align: center;
    min-width: 0;
    cursor: pointer;
}

.novels.grid-mode .novel-cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    display: block;
    border-radius: 9px;
    background: #eee;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    transition: .2s;
}

.novels.grid-mode .novel-card:hover .novel-cover {
    transform: translateY(-4px);
    box-shadow: 0 7px 18px rgba(0,0,0,.13);
}

.novels.grid-mode .novel-name {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.novels.grid-mode .novel-description,
.novels.grid-mode .novel-meta,
.novels.grid-mode .continue-btn {
    display: none;
}

/* =========================
   列表
========================= */

.novels.list-mode {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.novels.list-mode .novel-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.novels.list-mode .novel-cover {
    width: 88px;
    height: 118px;
    object-fit: cover;
    border-radius: 7px;
    flex-shrink: 0;
}

.novels.list-mode .novel-info {
    flex: 1;
}

.novels.list-mode .novel-name {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
}

.novels.list-mode .novel-description {
    font-size: 14px;
    color: #888;
    margin-bottom: 8px;
}

.novels.list-mode .novel-meta {
    font-size: 12px;
    color: #aaa;
}

.continue-btn {
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 7px;
    padding: 8px 13px;
}

/* =========================
   空书架
========================= */

.empty-state {
    text-align: center;
    color: #999;
    padding: 90px 20px;
}

.empty-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.empty-title {
    font-size: 18px;
    color: #555;
    margin-bottom: 8px;
}

/* =========================
   底部导航
========================= */

.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72px;
    background: rgba(255,255,255,.97);
    border-top: 1px solid #e8e8e8;
    display: flex;
    justify-content: center;
    z-index: 200;
    padding-bottom: env(safe-area-inset-bottom);
}

.nav-inner {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-around;
}

.nav-item {
    flex: 1;
    max-width: 180px;
    border: none;
    background: transparent;
    color: #999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    font-size: 12px;
}

.nav-icon {
    font-size: 22px;
    line-height: 1;
}

.nav-item.active {
    color: #222;
    font-weight: 600;
}

/* ==================================================
   字数统计
================================================== */

.stats-intro {
    margin-bottom: 24px;
}

.stats-title {
    font-size: 27px;
    font-weight: 700;
}

.stats-subtitle {
    margin-top: 7px;
    color: #999;
    font-size: 14px;
}

.stats-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 18px;
}

.stats-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.stats-card-title {
    font-size: 16px;
    font-weight: 600;
}

.stats-period {
    border: none;
    background: transparent;
    color: #888;
    font-size: 13px;
    padding: 4px;
}

.big-number {
    font-size: 31px;
    font-weight: 700;
    margin-top: 12px;
}

.chart-area {
    display: flex;
    height: 220px;
    margin-top: 18px;
}

.chart-y-axis {
    width: 45px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 2px 0 20px;
    color: #aaa;
    font-size: 11px;
}

.chart-line-area {
    position: relative;
    flex: 1;
    height: 100%;
}

.chart-lines {
    position: absolute;
    inset: 0 0 20px 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.chart-lines i {
    width: 100%;
    border-top: 1px dashed #e8e8e8;
}

.chart-svg {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: calc(100% - 20px);
    overflow: visible;
}

.chart-line {
    fill: none;
    stroke: #222;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.chart-point {
    fill: #fff;
    stroke: #222;
    stroke-width: 3;
}

.chart-dates {
    margin-left: 45px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: #999;
    font-size: 11px;
    margin-top: -4px;
}

.daily-summary {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-top: 4px;
}

.distribution-content {
    display: flex;
    align-items: center;
    gap: 45px;
    margin-top: 25px;
}

.donut-area {
    width: 230px;
    min-width: 230px;
    display: flex;
    justify-content: center;
}

.donut-chart {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    position: relative;
    background: #e9e9e9;
}

.donut-chart::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    background: #fff;
    border-radius: 50%;
    left: 35px;
    top: 35px;
}

.donut-center {
    position: absolute;
    z-index: 2;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.donut-center strong {
    font-size: 27px;
}

.donut-center span {
    color: #999;
    font-size: 12px;
    margin-top: 4px;
}

.distribution-list {
    flex: 1;
}

.distribution-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 8px 0;
    font-size: 13px;
}

.distribution-name {
    display: flex;
    align-items: center;
    min-width: 0;
}

.distribution-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 9px;
    flex-shrink: 0;
}

.distribution-name span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.distribution-number {
    color: #888;
    white-space: nowrap;
}

.stats-empty {
    text-align: center;
    color: #999;
    padding: 40px 10px;
    font-size: 14px;
}

/* =========================
   我的
========================= */

.profile-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 30px;
    text-align: center;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #eee;
    margin: 0 auto 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.profile-name {
    font-size: 19px;
    font-weight: 600;
}

.profile-subtitle {
    color: #999;
    font-size: 13px;
    margin-top: 7px;
}

/* =========================
   新建作品弹窗
========================= */

.modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-mask.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 500px;
    background: #fff;
    border-radius: 14px;
    padding: 25px;
}

.modal h2 {
    margin: 0 0 22px;
}

.modal label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 18px 0 8px;
}

.modal input[type="text"],
.modal textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

.modal textarea {
    min-height: 110px;
    resize: vertical;
}

.cover-upload {
    width: 120px;
    height: 160px;
    border: 1px dashed #d5d5d5;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    cursor: pointer;
    overflow: hidden;
    background: #fafafa;
}

.cover-upload span {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
}

.cover-upload strong {
    font-size: 27px;
    font-weight: 300;
}

.cover-upload small {
    font-size: 13px;
}

.cover-upload img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 9px;
    margin-top: 25px;
}

.actions button {
    padding: 9px 16px;
    border-radius: 8px;
}

.actions .cancel {
    background: #fff;
    border: 1px solid #ddd;
}

.actions .create {
    background: #222;
    color: #fff;
    border: none;
}

/* =========================
   作品页
========================= */

.work-header {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 22px;
    display: flex;
    gap: 22px;
}

.work-cover {
    width: 130px;
    height: 175px;
    object-fit: cover;
    border-radius: 9px;
}

.work-info {
    flex: 1;
}

.work-info h1 {
    margin: 5px 0 12px;
}

.work-info p {
    color: #888;
    line-height: 1.7;
}

.back-btn {
    border: none;
    background: transparent;
    color: #666;
    padding: 0;
    margin-bottom: 22px;
}

.chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0 15px;
}

.new-chapter-btn {
    border: none;
    background: #222;
    color: #fff;
    border-radius: 8px;
    padding: 9px 14px;
}

.chapter-list {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
}

.chapter-item {
    padding: 16px 18px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
}

.chapter-item:last-child {
    border-bottom: none;
}

.chapter-date {
    color: #aaa;
    font-size: 12px;
}

/* =========================
   编辑器
========================= */

.editor-page {
    background: #fff;
}

.editor-toolbar {
    height: 62px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
}

.editor-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.editor-title {
    width: 300px;
    border: none;
    outline: none;
    font-size: 17px;
    font-weight: 600;
}

.save-btn {
    border: none;
    background: #222;
    color: #fff;
    border-radius: 8px;
    padding: 9px 17px;
}

.editor-area {
    max-width: 850px;
    margin: auto;
    padding: 45px 25px;
}

.editor-content {
    width: 100%;
    min-height: 65vh;
    border: none;
    outline: none;
    resize: none;
    font-size: 17px;
    line-height: 2;
}

.word-count {
    position: fixed;
    right: 18px;
    bottom: 82px;
    color: #999;
    font-size: 12px;
}

/* =========================
   手机
========================= */

@media (max-width: 900px) {

    .novels.grid-mode {
        grid-template-columns: repeat(4, 1fr);
    }

}

@media (max-width: 600px) {

    .header {
        padding: 0 15px;
    }

    .container {
        padding: 25px 15px 45px;
    }

    .page-title {
        font-size: 24px;
        margin-bottom: 25px;
    }

    .novels.grid-mode {
        grid-template-columns: repeat(3, 1fr);
        gap: 25px 12px;
    }

    .novels.grid-mode .novel-name {
        font-size: 13px;
    }

    .work-header {
        padding: 15px;
        gap: 15px;
    }

    .work-cover {
        width: 95px;
        height: 128px;
    }

    .editor-title {
        width: 180px;
    }

    .stats-card {
        padding: 17px;
    }

    .distribution-content {
        display: block;
    }

    .donut-area {
        width: 100%;
        margin-bottom: 25px;
    }

    .distribution-list {
        width: 100%;
    }

    .big-number {
        font-size: 27px;
    }

}
</style>
</head>

<body>


<!-- ==================================================
     书架
================================================== -->

<div id="libraryPage" class="page active">

    <header class="header">

        <div class="logo">
            小说家
        </div>

        <div class="create-menu-wrap">

            <button
                class="create-btn"
                onclick="toggleCreateMenu()">
                ＋ 新建
            </button>

            <div
                id="createMenu"
                class="create-menu">

                <button onclick="openNovelModal()">
                    📖 新建作品
                </button>

                <button onclick="createGroup()">
                    📁 新建分组
                </button>

                <button onclick="closeCreateMenu()">
                    取消
                </button>

            </div>

        </div>

    </header>


    <main class="container">

        <div class="page-title">
            我的小说
        </div>


        <div class="library-toolbar">

            <div class="library-settings">

                <button
                    class="settings-btn"
                    onclick="toggleSettings()">
                    ⚙️ 书架设置
                </button>

                <div
                    id="settingsPanel"
                    class="settings-panel">

                    <div class="settings-title">
                        书架模式
                    </div>

                    <div class="mode-buttons">

                        <button
                            id="gridModeBtn"
                            class="mode-btn"
                            onclick="setLibraryMode('grid')">
                            ▦ 网格
                        </button>

                        <button
                            id="listModeBtn"
                            class="mode-btn"
                            onclick="setLibraryMode('list')">
                            ☰ 列表
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <div
            id="emptyState"
            class="empty-state">

            <div class="empty-icon">
                📚
            </div>

            <div class="empty-title">
                还没有作品
            </div>

            <div>
                点击右上角「＋ 新建」开始创作
            </div>

        </div>


        <div
            id="novels"
            class="novels grid-mode">
        </div>

    </main>

</div>


<!-- ==================================================
     工具 / 字数统计
================================================== -->

<div id="toolsPage" class="page">

    <header class="header">

        <div class="logo">
            小说家
        </div>

    </header>

    <main class="container">

        <div class="stats-intro">

            <div class="stats-title">
                字数统计
            </div>

            <div class="stats-subtitle">
                统计每日码字字数
            </div>

        </div>


        <!-- =========================
             累计字数
        ========================= -->

        <section class="stats-card">

            <div class="stats-card-header">

                <div class="stats-card-title">
                    累计字数
                </div>

                <button
                    class="stats-period"
                    onclick="showStatsInfo('累计字数')">
                    近7天 ＞
                </button>

            </div>


            <div
                id="totalWordsNumber"
                class="big-number">
                0
            </div>


            <div class="chart-area">

                <div class="chart-y-axis">

                    <span id="totalY1">
                        0
                    </span>

                    <span id="totalY2">
                        0
                    </span>

                    <span id="totalY3">
                        0
                    </span>

                    <span id="totalY4">
                        0
                    </span>

                    <span>
                        0
                    </span>

                </div>


                <div class="chart-line-area">

                    <div class="chart-lines">

                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>

                    </div>


                    <svg
                        id="totalWordsChart"
                        class="chart-svg"
                        viewBox="0 0 700 200"
                        preserveAspectRatio="none">
                    </svg>

                </div>

            </div>


            <div
                id="totalWordsDates"
                class="chart-dates">
            </div>

        </section>


        <!-- =========================
             输入字数
        ========================= -->

        <section class="stats-card">

            <div class="stats-card-header">

                <div class="stats-card-title">
                    输入字数
                </div>

                <button
                    class="stats-period"
                    onclick="showStatsInfo('输入字数')">
                    近7天 ＞
                </button>

            </div>


            <div class="chart-area">

                <div class="chart-y-axis">

                    <span id="dailyY1">
                        0
                    </span>

                    <span id="dailyY2">
                        0
                    </span>

                    <span id="dailyY3">
                        0
                    </span>

                    <span id="dailyY4">
                        0
                    </span>

                    <span>
                        0
                    </span>

                </div>


                <div class="chart-line-area">

                    <div class="chart-lines">

                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>

                    </div>


                    <svg
                        id="dailyWordsChart"
                        class="chart-svg"
                        viewBox="0 0 700 200"
                        preserveAspectRatio="none">
                    </svg>

                </div>

            </div>


            <div
                id="dailyWordsDates"
                class="chart-dates">
            </div>


            <div
                id="dailyWordsSummary"
                class="daily-summary">
                今天 0 字
            </div>

        </section>


        <!-- =========================
             字数分布
        ========================= -->

        <section class="stats-card">

            <div class="stats-card-header">

                <div class="stats-card-title">
                    字数分布
                </div>

            </div>


            <div class="distribution-content">

                <div class="donut-area">

<script>

/* ==================================================
   数据
================================================== */

let novels =
    JSON.parse(
        localStorage.getItem("novels") || "[]"
    );

let selectedCover = "";

let currentNovelId = null;

let currentChapterId = null;

let currentChapterOldWordCount = 0;

let libraryMode =
    localStorage.getItem("libraryMode") || "grid";


/* ==================================================
   每日码字记录
================================================== */

let dailyWordStats =
    JSON.parse(
        localStorage.getItem("dailyWordStats") || "{}"
    );


/* ==================================================
   页面切换
================================================== */

function switchPage(page) {

    document
        .querySelectorAll(".page")
        .forEach(function(el) {

            el.classList.remove("active");

        });


    if (page === "library") {

        document
            .getElementById("libraryPage")
            .classList.add("active");

    }

    if (page === "tools") {

        document
            .getElementById("toolsPage")
            .classList.add("active");

        renderWordStatistics();

    }

    if (page === "profile") {

        document
            .getElementById("profilePage")
            .classList.add("active");

    }


    document
        .getElementById("navLibrary")
        .classList.toggle(
            "active",
            page === "library"
        );

    document
        .getElementById("navTools")
        .classList.toggle(
            "active",
            page === "tools"
        );

    document
        .getElementById("navProfile")
        .classList.toggle(
            "active",
            page === "profile"
        );

}


/* ==================================================
   保存作品
================================================== */

function saveNovels() {

    localStorage.setItem(
        "novels",
        JSON.stringify(novels)
    );

}


/* ==================================================
   保存每日统计
================================================== */

function saveDailyWordStats() {

    localStorage.setItem(
        "dailyWordStats",
        JSON.stringify(dailyWordStats)
    );

}


/* ==================================================
   新建菜单
================================================== */

function toggleCreateMenu() {

    document
        .getElementById("createMenu")
        .classList.toggle("show");

}


function closeCreateMenu() {

    document
        .getElementById("createMenu")
        .classList.remove("show");

}


function createGroup() {

    closeCreateMenu();

    alert("分组功能正在开发中。");

}


/* ==================================================
   书架设置
================================================== */

function toggleSettings() {

    document
        .getElementById("settingsPanel")
        .classList.toggle("show");

}


function setLibraryMode(mode) {

    libraryMode = mode;

    localStorage.setItem(
        "libraryMode",
        mode
    );

    renderNovels();

}


function updateModeButtons() {

    document
        .getElementById("gridModeBtn")
        .classList.toggle(
            "active",
            libraryMode === "grid"
        );

    document
        .getElementById("listModeBtn")
        .classList.toggle(
            "active",
            libraryMode === "list"
        );

}


/* ==================================================
   新建作品
================================================== */

function openNovelModal() {

    closeCreateMenu();

    document
        .getElementById("novelModal")
        .classList.add("show");

    document
        .getElementById("novelName")
        .value = "";

    document
        .getElementById("novelDescription")
        .value = "";

    selectedCover = "";

    document
        .getElementById("coverPreview")
        .style.display = "none";

    document
        .getElementById("coverText")
        .style.display = "flex";

}


function hideNovelModal() {

    document
        .getElementById("novelModal")
        .classList.remove("show");

}


function previewCover(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload =
        function(e) {

            selectedCover =
                e.target.result;

            document
                .getElementById("coverPreview")
                .src =
                selectedCover;

            document
                .getElementById("coverPreview")
                .style.display =
                "block";

            document
                .getElementById("coverText")
                .style.display =
                "none";

        };

    reader.readAsDataURL(file);

}


/* ==================================================
   默认封面
================================================== */

function createDefaultCover(name) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 300;

    canvas.height = 400;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "#eeeeee";

    ctx.fillRect(
        0,
        0,
        300,
        400
    );

    ctx.fillStyle = "#555";

    ctx.font =
        "bold 28px sans-serif";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    let title =
        name || "未命名作品";

    if (title.length > 8) {

        title =
            title.substring(0, 8) + "…";

    }

    ctx.fillText(
        title,
        150,
        200
    );

    return canvas.toDataURL(
        "image/jpeg",
        .8
    );

}


/* ==================================================
   创建作品
================================================== */

function createNovel() {

    const name =
        document
            .getElementById("novelName")
            .value
            .trim();

    const description =
        document
            .getElementById("novelDescription")
            .value
            .trim();

    if (!name) {

        alert("请输入作品名称");

        return;

    }

    novels.unshift({

        id:
            Date.now().toString(),

        name:
            name,

        description:
            description,

        cover:
            selectedCover ||
            createDefaultCover(name),

        chapters: [],

        created:
            Date.now(),

        updated:
            Date.now()

    });

    saveNovels();

    hideNovelModal();

    renderNovels();

}


/* ==================================================
   书架
================================================== */

function renderNovels() {

    const container =
        document.getElementById("novels");

    const empty =
        document.getElementById("emptyState");

    container.className =
        "novels " +
        (
            libraryMode === "grid"
            ? "grid-mode"
            : "list-mode"
        );

    updateModeButtons();


    if (!novels.length) {

        container.innerHTML = "";

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    container.innerHTML =
        novels.map(
            function(novel) {

                const chapterCount =
                    novel.chapters
                        ? novel.chapters.length
                        : 0;

                return `

                    <div
                        class="novel-card"
                        onclick="openWork('${novel.id}')">

                        <img
                            class="novel-cover"
                            src="${novel.cover}">

                        <div class="novel-info">

                            <div class="novel-name">
                                ${escapeHTML(novel.name)}
                            </div>

                            <div class="novel-description">
                                ${escapeHTML(
                                    novel.description ||
                                    "暂无简介"
                                )}
                            </div>

                            <div class="novel-meta">
                                ${chapterCount} 章
                            </div>

                        </div>

                        <button
                            class="continue-btn"
                            onclick="
                                event.stopPropagation();
                                openWork('${novel.id}');
                            ">
                            继续写作
                        </button>

                    </div>

                `;

            }
        ).join("");

}


/* ==================================================
   作品
================================================== */

function openWork(id) {

    currentNovelId = id;

    const novel =
        novels.find(
            n => n.id === id
        );

    if (!novel) return;

    document
        .querySelectorAll(".page")
        .forEach(
            el => el.classList.remove("active")
        );

    document
        .getElementById("workPage")
        .classList.add("active");

    document
        .getElementById("workName")
        .textContent =
        novel.name;

    document
        .getElementById("workDescription")
        .textContent =
        novel.description ||
        "暂无简介";

    document
        .getElementById("workCover")
        .src =
        novel.cover;

    renderChapters();

}


function backToLibrary() {

    document
        .getElementById("workPage")
        .classList.remove("active");

    document
        .getElementById("libraryPage")
        .classList.add("active");

    document
        .getElementById("navLibrary")
        .classList.add("active");

    document
        .getElementById("navTools")
        .classList.remove("active");

    document
        .getElementById("navProfile")
        .classList.remove("active");

    renderNovels();

}


/* ==================================================
   章节
================================================== */

function renderChapters() {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    const list =
        document.getElementById("chapterList");

    if (
        !novel ||
        !novel.chapters ||
        !novel.chapters.length
    ) {

        list.innerHTML = `

            <div
                style="
                    padding:50px;
                    text-align:center;
                    color:#999;
                ">
                还没有章节
            </div>

        `;

        return;

    }


    list.innerHTML =
        novel.chapters
            .map(
                function(chapter,index) {

                    return `

                        <div
                            class="chapter-item"
                            onclick="
                                openChapter('${chapter.id}')
                            ">

                            <div>
                                第 ${index + 1} 章
                                ${escapeHTML(
                                    chapter.title ||
                                    "未命名章节"
                                )}
                            </div>

                            <div class="chapter-date">
                                ${formatDate(
                                    chapter.updated
                                )}
                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* ==================================================
   新建章节
================================================== */

function newChapter() {

    currentChapterId = null;

    currentChapterOldWordCount = 0;

    document
        .getElementById("workPage")
        .classList.remove("active");

    document
        .getElementById("editorPage")
        .classList.add("active");

    document
        .getElementById("chapterTitle")
        .value = "";

    document
        .getElementById("chapterContent")
        .value = "";

    updateWordCount();

}


/* ==================================================
   打开章节
================================================== */

function openChapter(id) {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    if (!novel) return;

    const chapter =
        novel.chapters.find(
            c => c.id === id
        );

    if (!chapter) return;

    currentChapterId = id;

    currentChapterOldWordCount =
        countWords(
            chapter.content || ""
        );

    document
        .getElementById("workPage")
        .classList.remove("active");

    document
        .getElementById("editorPage")
        .classList.add("active");

    document
        .getElementById("chapterTitle")
        .value =
        chapter.title || "";

    document
        .getElementById("chapterContent")
        .value =
        chapter.content || "";

    updateWordCount();

}


/* ==================================================
   保存章节
================================================== */

function saveChapter() {

    const novel =
        novels.find(
            n => n.id === currentNovelId
        );

    if (!novel) return;

    const title =
        document
            .getElementById("chapterTitle")
            .value
            .trim();

    const content =
        document
            .getElementById("chapterContent")
            .value;

    if (!title) {

        alert("请输入章节标题");

        return;

    }


    const newWordCount =
        countWords(content);


    /*
       计算本次新增字数。

       如果是新章节：
       新增字数 = 当前章节字数

       如果是修改旧章节：
       新增字数 = 新字数 - 原字数

       删除文字不会产生负数。
    */

    let addedWords = 0;

    if (currentChapterId) {

        addedWords =
            Math.max(
                0,
                newWordCount -
                currentChapterOldWordCount
            );

    } else {

        addedWords =
            newWordCount;

    }


    if (!novel.chapters) {

        novel.chapters = [];

    }


    if (currentChapterId) {

        const chapter =
            novel.chapters.find(
                c => c.id === currentChapterId
            );

        if (chapter) {

            chapter.title =
                title;

            chapter.content =
                content;

            chapter.updated =
                Date.now();

        }

    } else {

        novel.chapters.push({

            id:
                Date.now().toString(),

            title:
                title,

            content:
                content,

            updated:
                Date.now()

        });

    }


    /*
       记录今天新增字数
    */

    if (addedWords > 0) {

        const today =
            getDateKey(
                new Date()
            );

        dailyWordStats[today] =
            (
                dailyWordStats[today] || 0
            ) +
            addedWords;

        saveDailyWordStats();

    }


    novel.updated =
        Date.now();

    saveNovels();

    alert(
        "已保存\n本次新增 " +
        addedWords.toLocaleString() +
        " 字"
    );

    backToWork();

}


/* ==================================================
   返回作品
================================================== */

function backToWork() {

    document
        .getElementById("editorPage")
        .classList.remove("active");

    document
        .getElementById("workPage")
        .classList.add("active");

    renderChapters();

}


/* ==================================================
   字数
================================================== */

function countWords(text) {

    return String(text || "")
        .replace(/\s/g, "")
        .length;

}


function updateWordCount() {

    const text =
        document
            .getElementById("chapterContent")
            .value;

    const count =
        countWords(text);

    document
        .getElementById("wordCount")
        .textContent =
        count.toLocaleString() +
        " 字";

}


/* ==================================================
   字数统计：日期
================================================== */

function getDateKey(date) {

    return (
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2, "0")
    );

}


function getLast7Days() {

    const days = [];

    const now =
        new Date();

    for (
        let i = 6;
        i >= 0;
        i--
    ) {

        const date =
            new Date(now);

        date.setDate(
            now.getDate() - i
        );

        const key =
            getDateKey(date);

        const label =
            String(
                date.getMonth() + 1
            ).padStart(2, "0") +
            "/" +
            String(
                date.getDate()
            ).padStart(2, "0");

        days.push({
            key: key,
            label: label
        });

    }

    return days;

}


/* ==================================================
   字数统计：所有作品
================================================== */

function getNovelWordStats() {

    return novels
        .map(
            function(novel) {

                let total = 0;

                if (novel.chapters) {

                    novel.chapters.forEach(
                        function(chapter) {

                            total +=
                                countWords(
                                    chapter.content || ""
                                );

                        }
                    );

                }

                return {
                    name: novel.name,
                    words: total
                };

            }
        )
        .filter(
            item => item.words > 0
        )
        .sort(
            (a,b) =>
                b.words - a.words
        );

}


/* ==================================================
   字数统计：总字数
================================================== */

function getTotalWords() {

    return getNovelWordStats()
        .reduce(
            (sum,item) =>
                sum + item.words,
            0
        );

}


/* ==================================================
   字数单位
================================================== */

function formatCompactNumber(number) {

    number =
        Number(number) || 0;

    if (number >= 1000000) {

        return (
            (number / 1000000)
                .toFixed(1)
                .replace(".0","")
            + "M"
        );

    }

    if (number >= 1000) {

        return (
            (number / 1000)
                .toFixed(1)
                .replace(".0","")
            + "K"
        );

    }

    return number.toString();

}


/* ==================================================
   Y轴数字
================================================== */

function renderYAxis(
    prefix,
    maxValue
) {

    const step =
        maxValue / 4;

    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        const element =
            document.getElementById(
                prefix + "Y" + i
            );

        if (!element) continue;

        element.textContent =
            formatCompactNumber(
                step * (5 - i)
            );

    }

}


/* ==================================================
   折线图
================================================== */

function drawLineChart(
    svgId,
    values,
    maxValue
) {

    const svg =
        document.getElementById(
            svgId
        );

    if (!svg) return;

    svg.innerHTML = "";

    const width = 700;

    const height = 200;

    const paddingX = 10;

    const usableWidth =
        width -
        paddingX * 2;

    const usableHeight =
        height - 15;


    if (!values.length) return;


    const points =
        values.map(
            function(value,index) {

                const x =
                    paddingX +
                    index *
                    (
                        usableWidth / 6
                    );

                const y =
                    maxValue <= 0
                    ? usableHeight
                    : usableHeight -
                        (
                            value /
                            maxValue
                        ) *
                        usableHeight;

                return {
                    x: x,
                    y: y
                };

            }
        );


    let path = "";

    points.forEach(
        function(point,index) {

            if (index === 0) {

                path =
                    "M " +
                    point.x +
                    " " +
                    point.y;

            } else {

                path +=
                    " L " +
                    point.x +
                    " " +
                    point.y;

            }

        }
    );


    const pathElement =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    pathElement.setAttribute(
        "d",
        path
    );

    pathElement.setAttribute(
        "class",
        "chart-line"
    );

    svg.appendChild(
        pathElement
    );


    points.forEach(
        function(point) {

            const circle =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );

            circle.setAttribute(
                "cx",
                point.x
            );

            circle.setAttribute(
                "cy",
                point.y
            );

            circle.setAttribute(
                "r",
                "4"
            );

            circle.setAttribute(
                "class",
                "chart-point"
            );

            svg.appendChild(
                circle
            );

        }
    );

}


/* ==================================================
   日期
================================================== */

/* ==================================================
   字数分布圆环
================================================== */

function renderDistribution() {

    const items =
        getNovelWordStats();

    const list =
        document.getElementById(
            "distributionList"
        );

    const donut =
        document.getElementById(
            "donutChart"
        );

    const percent =
        document.getElementById(
            "donutPercent"
        );


    if (!items.length) {

        list.innerHTML = `

            <div class="stats-empty">
                暂无作品字数
            </div>

        `;

        donut.style.background =
            "#e9e9e9";

        percent.textContent =
            "0%";

        return;

    }


    const total =
        items.reduce(
            (sum,item) =>
                sum + item.words,
            0
        );


    const colors = [
        "#222",
        "#444",
        "#666",
        "#888",
        "#999",
        "#aaa",
        "#bbb",
        "#ccc"
    ];


    let current = 0;

    const gradients = [];


    items.forEach(
        function(item,index) {

            const percentage =
                item.words /
                total *
                100;

            const start =
                current;

            current +=
                percentage;

            gradients.push(
                colors[
                    index %
                    colors.length
                ] +
                " " +
                start +
                "% " +
                current +
                "%"
            );

        }
    );


    donut.style.background =
        "conic-gradient(" +
        gradients.join(",") +
        ")";


    const largestPercentage =
        items[0].words /
        total *
        100;


    percent.textContent =
        largestPercentage
            .toFixed(1)
            .replace(".0","") +
        "%";


    list.innerHTML =
        items
            .map(
                function(item,index) {

                    return `

                        <div
                            class="distribution-item">

                            <div
                                class="distribution-name">

                                <i
                                    class="distribution-dot"
                                    style="
                                        background:
                                        ${
                                            colors[
                                                index %
                                                colors.length
                                            ]
                                        };
                                    ">
                                </i>

                                <span>
                                    ${
                                        escapeHTML(
                                            item.name
                                        )
                                    }
                                </span>

                            </div>

                            <div
                                class="distribution-number">

                                ${
                                    item.words
                                        .toLocaleString()
                                }字

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* ==================================================
   字数统计主程序
================================================== */

function renderWordStatistics() {

    /*
       总字数
    */

    const totalWords =
        getTotalWords();


    document
        .getElementById(
            "totalWordsNumber"
        )
        .textContent =
        totalWords.toLocaleString();


    /*
       最近7天
    */

    const days =
        getLast7Days();


    const dailyValues =
        days.map(
            day =>
                dailyWordStats[
                    day.key
                ] || 0
        );


    /*
       累计曲线

       注意：
       这里统计的是你每天实际
       新增的码字数量。

       从今天往前没有记录的日期
       会显示为0。
    */

    let runningTotal = 0;

    const cumulativeValues =
        dailyValues.map(
            value => {

                runningTotal +=
                    value;

                return runningTotal;

            }
        );


    /*
       累计字数图
    */

    const cumulativeMax =
        Math.max(
            ...cumulativeValues,
            1
        );


    renderYAxis(
        "total",
        cumulativeMax
    );


    drawLineChart(
        "totalWordsChart",
        cumulativeValues,
        cumulativeMax
    );


    /*
       每日输入字数图
    */

    const dailyMax =
        Math.max(
            ...dailyValues,
            1
        );


    renderYAxis(
        "daily",
        dailyMax
    );


    drawLineChart(
        "dailyWordsChart",
        dailyValues,
        dailyMax
    );


    /*
       日期
    */

    renderChartDates(
        "totalWordsDates",
        days
    );

    renderChartDates(
        "dailyWordsDates",
        days
    );


    /*
       今天
    */

    const todayKey =
        getDateKey(
            new Date()
        );

    const todayWords =
        dailyWordStats[
            todayKey
        ] || 0;


    document
        .getElementById(
            "dailyWordsSummary"
        )
        .textContent =
        "今天 " +
        todayWords.toLocaleString() +
        " 字";


    /*
       作品字数分布
    */

    renderDistribution();

}

/* ==================================================
   工具
================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function formatDate(timestamp) {

    if (!timestamp) return "";

    const date =
        new Date(timestamp);

    return (
        date.getFullYear() +
        "/" +
        String(
            date.getMonth() + 1
        ).padStart(2,"0") +
        "/" +
        String(
            date.getDate()
        ).padStart(2,"0")
    );

}
