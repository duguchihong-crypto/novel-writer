<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>我的书架</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f5f6f8;

    color: #222;

    padding-top: 70px;
}


/* ==================================================
   顶部
================================================== */

header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    background: #fff;

    border-bottom:
        1px solid #e5e5e5;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px;

    z-index: 1000;
}


.logo {

    font-size: 21px;

    font-weight: 700;

    color: #222;
}


.header-right {

    display: flex;

    align-items: center;

    gap: 10px;
}


.new-book-button {

    border: none;

    background: #4f7cff;

    color: #fff;

    padding:
        11px 18px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 15px;

    font-weight: 500;
}


.new-book-button:hover {

    background: #3d68e6;
}


/* ==================================================
   页面
================================================== */

.container {

    max-width: 1000px;

    margin:
        40px auto;

    padding:
        0 20px;
}


.page-title {

    margin-bottom: 25px;
}


.page-title h1 {

    margin: 0;

    font-size: 28px;
}


/* ==================================================
   书架
================================================== */

#books {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px, 1fr)
        );

    gap: 22px;
}


/* ==================================================
   书籍
================================================== */

.book {

    position: relative;

    background: #fff;

    border:
        1px solid #e5e5e5;

    border-radius: 12px;

    padding: 12px;

    cursor: pointer;

    transition:
        0.2s;

    min-width: 0;
}


.book:hover {

    border-color: #cfd5df;

    transform:
        translateY(-2px);

    box-shadow:
        0 5px 15px
        rgba(0,0,0,0.05);
}


/* ==================================================
   封面
================================================== */

.book-cover {

    width: 100%;

    aspect-ratio: 3 / 4;

    border-radius: 8px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #eef1f5,
            #dfe4eb
        );

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 12px;
}


.book-cover img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


.default-cover {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 48px;

    background:
        linear-gradient(
            145deg,
            #eef1f5,
            #dfe4eb
        );
}


/* ==================================================
   书名
================================================== */

.book-info {

    padding:
        0 3px 3px;
}


.book-title {

    font-size: 16px;

    font-weight: 600;

    line-height: 1.4;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* ==================================================
   删除
================================================== */

.delete-book-button {

    position: absolute;

    top: 17px;

    right: 17px;

    width: 30px;

    height: 30px;

    border: none;

    border-radius: 50%;

    background:
        rgba(0,0,0,0.55);

    color: #fff;

    cursor: pointer;

    z-index: 5;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 14px;
}


.delete-book-button:hover {

    background:
        rgba(220,50,50,0.85);
}


/* ==================================================
   空书架
================================================== */

.empty {

    grid-column: 1 / -1;

    text-align: center;

    padding:
        80px 20px;

    background: #fff;

    border-radius: 12px;

    color: #888;
}


/* ==================================================
   手机
================================================== */

@media (max-width: 600px) {

    header {

        padding:
            0 15px;
    }


    .logo {

        font-size: 18px;
    }


    .new-book-button {

        padding:
            9px 13px;

        font-size: 14px;
    }


    .container {

        margin-top: 25px;
    }


    .page-title h1 {

        font-size: 24px;
    }


    #books {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 14px;
    }


    .book {

        padding: 9px;

        border-radius: 10px;
    }


    .delete-book-button {

        top: 13px;

        right: 13px;

        width: 27px;

        height: 27px;

        font-size: 12px;
    }


    .book-title {

        font-size: 14px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     顶部
================================================== -->

<header>

    <div class="logo">
        🌍 我的世界
    </div>


    <div class="header-right">

        <button
            class="new-book-button"
            id="newBookButton"
            type="button"
        >
            ＋ 新建小说
        </button>

    </div>

</header>


<!-- ==================================================
     内容
================================================== -->

<div class="container">

    <div class="page-title">

        <h1>
            我的小说
        </h1>

    </div>


    <div id="books"></div>

</div>


<script>


// ==================================================
// DOM
// ==================================================

const booksContainer =
    document.getElementById(
        "books"
    );


const newBookButton =
    document.getElementById(
        "newBookButton"
    );


// ==================================================
// 新建小说
// ==================================================

newBookButton.addEventListener(
    "click",
    function() {

        window.location.href =
            "create-book.html";

    }
);


// ==================================================
// 读取书籍
// ==================================================

function loadBooks() {

    booksContainer.innerHTML =
        "";


    let books = [];


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    try {

        books =
            savedBooks
                ? JSON.parse(
                    savedBooks
                )
                : [];

    } catch (error) {

        console.error(
            "读取书架失败：",
            error
        );

        books = [];

    }


    if (!Array.isArray(books)) {

        books = [];

    }


    // ==================================================
    // 没有小说
    // ==================================================

    if (books.length === 0) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty";


        empty.textContent =
            "还没有小说，点击右上角「＋ 新建小说」开始创作。";


        booksContainer.appendChild(
            empty
        );


        return;

    }


    // ==================================================
    // 生成书籍
    // ==================================================

    books.forEach(
        function(book) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "book";


            // ------------------------------------------
            // 封面
            // ------------------------------------------

            let coverHTML = "";


            if (
                typeof book.cover === "string" &&
                book.cover.length > 0
            ) {

                coverHTML = `
                    <img
                        src="${escapeHTMLAttribute(book.cover)}"
                        alt="书籍封面"
                    >
                `;

            } else {

                coverHTML = `
                    <div class="default-cover">
                        📖
                    </div>
                `;

            }


            // ------------------------------------------
            // 内容
            // ------------------------------------------

            card.innerHTML = `

                <button
                    class="delete-book-button"
                    type="button"
                    title="删除小说"
                    aria-label="删除小说"
                >
                    🗑
                </button>


                <div class="book-cover">

                    ${coverHTML}

                </div>


                <div class="book-info">

                    <div class="book-title">

                        ${escapeHTML(
                            book.title ||
                            "未命名小说"
                        )}

                    </div>

                </div>

            `;


            // ==================================================
            // 点击书籍
            //
            // 点击封面 / 书名：
            // 打开小说
            // ==================================================

            card.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target.closest(
                            ".delete-book-button"
                        )
                    ) {

                        return;

                    }


                    openBook(
                        book.id
                    );

                }
            );


            // ==================================================
            // 删除
            // ==================================================

            const deleteButton =
                card.querySelector(
                    ".delete-book-button"
                );


            deleteButton.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    event.stopPropagation();


                    deleteBook(
                        book.id
                    );

                }
            );


            booksContainer.appendChild(
                card
            );

        }
    );

}


// ==================================================
// 打开小说
// ==================================================

function openBook(bookId) {

    localStorage.setItem(
        "currentBookId",
        String(bookId)
    );


    localStorage.removeItem(
        "currentChapterId"
    );


    window.location.href =
        "book.html";

}


// ==================================================
// 删除小说
// ==================================================

function deleteBook(bookId) {

    const confirmed =
        window.confirm(
            "确定要删除这本小说吗？\n\n删除后无法恢复。"
        );


    if (!confirmed) {

        return;

    }


    let books = [];


    try {

        const savedBooks =
            localStorage.getItem(
                "novelBooks"
            );


        books =
            savedBooks
                ? JSON.parse(
                    savedBooks
                )
                : [];

    } catch (error) {

        books = [];

    }


    if (!Array.isArray(books)) {

        books = [];

    }


    books =
        books.filter(
            function(book) {

                return String(book.id) !==
                    String(bookId);

            }
        );


    localStorage.setItem(
        "novelBooks",
        JSON.stringify(books)
    );


    const currentBookId =
        localStorage.getItem(
            "currentBookId"
        );


    if (
        String(currentBookId) ===
        String(bookId)
    ) {

        localStorage.removeItem(
            "currentBookId"
        );

        localStorage.removeItem(
            "currentChapterId"
        );

    }


    loadBooks();

}


// ==================================================
// HTML 转义
// ==================================================

function escapeHTML(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeHTMLAttribute(value) {

    return escapeHTML(
        value
    );

}


// ==================================================
// 初始化
// ==================================================

loadBooks();

</script>


</body>

</html>
