<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说家</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 300px;
            resize: vertical;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 小说家</h1>
    <p>你的中文小说创作空间</p>
</header>

<main>

    <div class="box">
        <h2>✍️ 开始创作</h2>

        <label>小说名称</label>
        <input type="text" placeholder="例如：宝可梦：赤红传">

        <label>章节名称</label>
        <input type="text" placeholder="例如：第一章 少年赤红">

        <label>正文</label>
        <textarea placeholder="在这里开始写你的小说……"></textarea>

        <button onclick="alert('章节已保存！')">
            保存章节
        </button>
    </div>

</main>

</body>
</html>
