<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="./css/book.css?v=9999"
    >

</head>


<body>

    <!-- 顶部固定栏 -->

    <header
        id="topBar"
        class="top-bar"
    >

        <button
            id="backButton"
            class="top-button"
            type="button"
        >
            ← 返回
        </button>


        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <button
            id="layoutButton"
            class="top-button"
            type="button"
        >
            ↕ 纵向
        </button>

    </header>


    <!-- 全书画布 -->

    <main
        id="canvas"
        class="canvas"
    >

        <!-- 连接线 -->

        <svg
            id="connections"
            class="connections"
        ></svg>


        <!-- 全书内部书名 -->

        <div
            id="bookTitle"
            class="book-title"
        >
            未命名书籍
        </div>


        <!-- 全书节点 -->

        <div
            id="tree"
            class="tree"
        ></div>


        <!-- 操作栏 -->

        <div
            id="actionBar"
            class="action-bar"
        >

            <button
                type="button"
                data-action="preface"
            >
                ＋序
            </button>


            <button
                type="button"
                data-action="volume"
            >
                ＋卷
            </button>


            <button
                type="button"
                data-action="part"
            >
                ＋篇
            </button>


            <button
                type="button"
                data-action="chapter"
            >
                ＋章
            </button>

        </div>

    </main>


    <!-- 全书主要功能 -->

    <script src="./js/book/main.js"></script>


    <!-- 返回功能 -->

    <script src="./js/book/back.js"></script>

</body>

</html>
