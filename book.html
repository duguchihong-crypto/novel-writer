<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="./css/book.css?v=10001"
    >

</head>


<body>

    <header
        id="topBar"
        class="top-bar"
    >

        <button
            id="backButton"
            class="top-button"
            type="button"
            onclick="window.location.href='./index.html';"
        >
            ← 返回
        </button>


        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <button
            id="layoutButton"
            class="top-button"
            type="button"
        >
            ↕ 纵向
        </button>

    </header>


    <main
        id="canvas"
        class="canvas"
    >

        <!-- 3000 × 3000 工作区 -->

        <div
            id="workspace"
            class="workspace"
        >

            <svg
                id="connections"
                class="connections"
            ></svg>


            <div
                id="bookTitle"
                class="book-title"
            >
                未命名书籍
            </div>


            <div
                id="tree"
                class="tree"
            ></div>

        </div>


        <div
            id="actionBar"
            class="action-bar"
        >

            <button
                type="button"
                data-action="preface"
            >
                ＋序
            </button>


            <button
                type="button"
                data-action="volume"
            >
                ＋卷
            </button>


            <button
                type="button"
                data-action="part"
            >
                ＋篇
            </button>


            <button
                type="button"
                data-action="chapter"
            >
                ＋章
            </button>

        </div>

    </main>


    <script src="./js/book/main.js"></script>

    <script src="./js/book/center-view.js"></script>

</body>

</html>
