<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>全书</title>

<link
    rel="stylesheet"
    href="css/book.css">

</head>


<body>


<header class="top-bar">

    <button
        id="backButton"
        class="back-button">

        ← 返回

    </button>


    <div class="page-title">

        全书

    </div>

</header>



<main
    id="main"
    class="main">

    <div
        id="structureArea"
        class="structure-area">

        <div
            id="canvas"
            class="tree-canvas">

            <svg
                id="connectionLayer"
                class="connection-layer">
            </svg>


            <div
                id="bookNode"
                class="book-node">

                <div
                    id="bookTitle"
                    class="book-box">

                    我的小说

                </div>

            </div>


            <div id="tree"></div>

        </div>

    </div>

</main>



<div
    id="bottomBar"
    class="bottom-bar">


    <button
        id="addPrefaceButton"
        class="add-button add-preface">

        ＋序

    </button>


    <button
        id="addChapterButton"
        class="add-button add-chapter">

        ＋章

    </button>


    <button
        id="addPartButton"
        class="add-button add-part">

        ＋篇

    </button>


    <button
        id="addVolumeButton"
        class="add-button add-volume">

        ＋卷

    </button>


</div>



<script
    src="js/book.js">
</script>


</body>

</html>
