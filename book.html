<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>


    <link
        rel="stylesheet"
        href="./css/book-base.css?v=50002"
    >

    <link
        rel="stylesheet"
        href="./css/book-node.css?v=50004"
    >

    <link
        rel="stylesheet"
        href="./css/book-line.css?v=50002"
    >

    <link
        rel="stylesheet"
        href="./css/book-layout.css?v=50003"
    >

    <link
        rel="stylesheet"
        href="./css/book-action.css?v=50002"
    >

</head>


<body>


    <header
        id="topBar"
        class="top-bar"
    >

        <button
            id="backButton"
            class="top-button"
            type="button"
            onclick="window.location.href='./index.html';"
        >
            ← 返回
        </button>


        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <button
            id="layoutButton"
            class="top-button"
            type="button"
        >
            ↕ 纵向
        </button>

    </header>


    <main
        id="canvas"
        class="canvas"
    >

        <div
            id="workspace"
            class="workspace"
        >

            <svg
                id="connections"
                class="connections"
            ></svg>


            <div
                id="bookTitle"
                class="book-title"
                onclick="document.getElementById('actionBar').classList.toggle('show');"
            >
                新书
            </div>


            <div
                id="actionBar"
                class="action-bar"
            >

                <button
                    type="button"
                    class="action-preface"
                    data-action="preface"
                >
                    ＋序
                </button>


                <button
                    type="button"
                    class="action-chapter"
                    data-action="chapter"
                >
                    ＋章
                </button>


                <button
                    type="button"
                    class="action-part"
                    data-action="part"
                >
                    ＋篇
                </button>


                <button
                    type="button"
                    class="action-volume"
                    data-action="volume"
                >
                    ＋卷
                </button>

            </div>


            <div
                id="tree"
                class="tree"
            ></div>

        </div>

    </main>


    <!-- ==================================================
         数据
    ================================================== -->

    <script
        src="./js/book/book-data.js?v=50002"
    ></script>


    <!-- ==================================================
         储存
    ================================================== -->

    <script
        src="./js/book/book-storage.js?v=50002"
    ></script>


    <!-- ==================================================
         树结构
    ================================================== -->

    <script
        src="./js/book/book-tree.js?v=50003"
    ></script>


    <!-- ==================================================
         节点
    ================================================== -->

    <script
        src="./js/book/book-node.js?v=50002"
    ></script>


    <!-- ==================================================
         连接线
    ================================================== -->

    <script
        src="./js/book/book-line.js?v=50002"
    ></script>


    <!-- ==================================================
         布局
    ================================================== -->

    <script
        src="./js/book/book-layout.js?v=50003"
    ></script>


    <!-- ==================================================
         页面主逻辑
    ================================================== -->

    <script
        src="./js/book/book-main.js?v=50004"
    ></script>


    <!-- ==================================================
         进入全书时定位
    ================================================== -->

    <script>

        /*
         * 不让浏览器恢复上一次的滚动位置
         */

        if (
            "scrollRestoration" in history
        ) {

            history.scrollRestoration =
                "manual";

        }


        /* ==================================================
           将书名放到 canvas 正中央
        ================================================== */

        function centerBookOnEnter() {

            const canvas =
                document.getElementById("canvas");

            const bookTitle =
                document.getElementById("bookTitle");


            if (
                !canvas ||
                !bookTitle
            ) {

                return;

            }


            /*
             * 取得书名在 workspace 中的位置
             */

            const titleLeft =
                bookTitle.offsetLeft;

            const titleTop =
                bookTitle.offsetTop;


            const titleWidth =
                bookTitle.offsetWidth;

            const titleHeight =
                bookTitle.offsetHeight;


            /*
             * 书名中心
             */

            const titleCenterX =
                titleLeft +
                titleWidth / 2;

            const titleCenterY =
                titleTop +
                titleHeight / 2;


            /*
             * canvas 可视区域中心
             */

            const viewCenterX =
                canvas.clientWidth / 2;

            const viewCenterY =
                canvas.clientHeight / 2;


            /*
             * 计算最终滚动位置
             */

            const scrollLeft =
                titleCenterX -
                viewCenterX;

            const scrollTop =
                titleCenterY -
                viewCenterY;


            /*
             * 直接设置
             */

            canvas.scrollLeft =
                scrollLeft;

            canvas.scrollTop =
                scrollTop;

        }


        /* ==================================================
           页面完全加载
        ================================================== */

        window.addEventListener(
            "load",
            function () {

                centerBookOnEnter();


                setTimeout(
                    centerBookOnEnter,
                    100
                );


                setTimeout(
                    centerBookOnEnter,
                    500
                );

            }
        );


        /* ==================================================
           Safari 返回页面
        ================================================== */

        window.addEventListener(
            "pageshow",
            function () {

                setTimeout(
                    centerBookOnEnter,
                    50
                );

            }
        );

    </script>


</body>

</html>
