<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #ffffff;
    color: #333;

    overflow: hidden;
}


/* =========================
   顶部
========================= */

.top-bar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 56px;

    background: rgba(255,255,255,0.97);

    border-bottom: 1px solid #eeeeee;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 1000;
}

.page-title {

    font-size: 18px;
    font-weight: 600;

    color: #222;
}

.back-button {

    position: absolute;

    left: 16px;

    border: none;

    background: none;

    font-size: 16px;

    color: #555;

    cursor: pointer;

    padding: 8px 4px;
}

.back-button:active {
    opacity: 0.5;
}


/* =========================
   主区域
========================= */

.main {

    position: fixed;

    top: 56px;
    left: 0;
    right: 0;

    bottom: 88px;

    overflow-y: auto;

    padding: 36px 20px 60px;

    -webkit-overflow-scrolling: touch;
}


/* =========================
   结构区域
========================= */

.structure-area {

    width: 100%;

    max-width: 760px;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* =========================
   书名
========================= */

.book-node {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;
}

.book-box {

    min-width: 180px;

    max-width: 90vw;

    min-height: 52px;

    padding: 13px 28px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    /* 赤 */

    border: 1.5px solid #e59a9a;

    background: #fff0f0;

    color: #8f2424;

    font-size: 19px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.04);

    user-select: none;
}


/* 书名下面的线 */

.book-down-line {

    width: 1.5px;

    height: 34px;

    background: #d7d7d7;
}


/* =========================
   结构树
========================= */

.tree {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* 根节点 */

.root-node {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;
}


/* =========================
   节点
========================= */

.node-row {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    min-height: 56px;
}


.node-box {

    position: relative;

    min-width: 150px;

    max-width: calc(100vw - 120px);

    min-height: 48px;

    padding: 11px 20px;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    user-select: none;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.035);
}


/* =========================
   五色体系
========================= */


/*
    赤
    书名
*/

.book-box {

    border-color: #e59a9a;

    background: #fff0f0;

    color: #8f2424;
}


/*
    青
    序
*/

.node-preface {

    border: 1.5px solid #8bbfc2;

    background: #edf9fa;

    color: #17666b;
}


/*
    黄
    卷
*/

.node-volume {

    border: 1.5px solid #e1ca72;

    background: #fffbea;

    color: #806800;
}


/*
    白
    篇

    白色不能直接用纯白，
    否则会和页面背景融在一起。
*/

.node-part {

    border: 1.5px solid #c9c9c9;

    background: #fafafa;

    color: #4b4b4b;
}


/*
    黑
    章

    黑色也不使用纯黑背景，
    保持浅底深字。
*/

.node-chapter {

    border: 1.5px solid #8d8d8d;

    background: #f2f2f2;

    color: #202020;
}


/* =========================
   右侧操作
========================= */

.node-actions {

    position: absolute;

    left: calc(50% + 95px);

    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 7px;

    white-space: nowrap;
}


.action-button {

    height: 32px;

    padding: 0 9px;

    border: 1px solid #e5e5e5;

    border-radius: 7px;

    background: #ffffff;

    color: #666;

    font-size: 13px;

    cursor: pointer;

    box-shadow:
        0 1px 4px rgba(0,0,0,0.04);
}

.action-button:active {

    background: #f5f5f5;
}


/* 删除 */

.delete-button {

    width: 32px;

    padding: 0;

    font-size: 15px;

    color: #888;
}


/* =========================
   连接线
========================= */

.vertical-line {

    width: 1.5px;

    height: 28px;

    background: #d7d7d7;
}


/* =========================
   子结构
========================= */

.children {

    position: relative;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 0;
}


/* 多个子节点的横线 */

.children.has-multiple::before {

    content: "";

    position: absolute;

    top: 0;

    left: 50%;

    width: calc(100% - 60px);

    height: 1.5px;

    background: #d7d7d7;

    transform: translateX(-50%);
}


.child-node {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;
}


.child-node::before {

    content: "";

    width: 1.5px;

    height: 20px;

    background: #d7d7d7;
}


/* =========================
   空状态
========================= */

.empty-hint {

    margin-top: 35px;

    color: #aaa;

    font-size: 14px;

    text-align: center;

    line-height: 1.8;
}


/* =========================
   底部固定按钮
========================= */

.bottom-bar {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 88px;

    background: rgba(255,255,255,0.98);

    border-top: 1px solid #eeeeee;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    padding:
        12px
        16px
        calc(12px + env(safe-area-inset-bottom));

    z-index: 1000;
}


/* =========================
   底部按钮
========================= */

.add-button {

    height: 44px;

    min-width: 72px;

    padding: 0 13px;

    border-radius: 9px;

    background: #ffffff;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}


/* 赤 */

.add-preface {

    border: 1.5px solid #8bbfc2;

    color: #17666b;

    background: #edf9fa;
}


/* 黑 */

.add-chapter {

    border: 1.5px solid #8d8d8d;

    color: #202020;

    background: #f2f2f2;
}


/* 白 */

.add-part {

    border: 1.5px solid #c9c9c9;

    color: #4b4b4b;

    background: #fafafa;
}


/* 黄 */

.add-volume {

    border: 1.5px solid #e1ca72;

    color: #806800;

    background: #fffbea;
}


.add-button:active {

    transform: scale(0.96);
}


/* 序已经存在 */

.add-button.disabled {

    opacity: 0.4;

    cursor: not-allowed;
}


/* =========================
   手机
========================= */

@media (max-width: 600px) {

    .main {

        padding-left: 10px;

        padding-right: 10px;
    }

    .book-box {

        min-width: 150px;

        font-size: 17px;

        padding-left: 22px;

        padding-right: 22px;
    }

    .node-box {

        min-width: 125px;

        font-size: 14px;

        padding-left: 14px;

        padding-right: 14px;
    }

    .node-actions {

        left: calc(50% + 70px);

        gap: 4px;
    }

    .action-button {

        padding: 0 6px;

        font-size: 11px;

        height: 29px;
    }

    .delete-button {

        width: 29px;
    }

    .bottom-bar {

        gap: 6px;

        padding-left: 8px;

        padding-right: 8px;
    }

    .add-button {

        min-width: 0;

        flex: 1;

        padding: 0 5px;

        font-size: 14px;
    }

}

</style>
