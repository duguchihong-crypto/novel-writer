<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="css/book.css"
    >

</head>


<body>


    <!-- ==================================================
         顶部栏
    ================================================== -->

    <header class="top-bar">


        <!-- 返回 -->

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ← 返回
        </button>


        <!-- 页面标题 -->

        <div class="page-title">
            全书
        </div>


        <!-- 布局方向 -->

        <button
            id="layoutToggle"
            class="layout-toggle"
            type="button"
            aria-label="切换布局方向"
        >
            ↕ 纵向
        </button>


    </header>



    <!-- ==================================================
         全书画布

         固定坐标系统：

         3000 × 3000

         中心：

         X = 1500
         Y = 1500

         以下元素全部使用同一个坐标系统：

         1. 小说书名
         2. 序 / 卷 / 篇 / 章
         3. SVG连接线
         4. + / − 操作按钮
    ================================================== -->

    <main class="tree-canvas">


        <!-- ==================================================
             SVG连接线

             横向布局示例：

             小说名 ───────── 卷
                              │
                              ├──────── 章
                              │
                              ├──────── 章
                              │
                              └──────── 章


             纵向布局示例：

             小说名
                │
                ├──── 卷
                │
                ├──── 卷
                │
                └──── 卷
        ================================================== -->

        <svg
            id="connections"
            class="connections"
            aria-hidden="true"
        ></svg>



        <!-- ==================================================
             小说书名

             注意：

             HTML中不设置：

                 left
                 top

             由 JavaScript 控制。

             第一次打开时：

                 3000 × 3000

                 中心 = 1500 / 1500

             用户可以之后自由拖动。
        ================================================== -->

        <div
            id="bookTitle"
            class="book-title"
        >
            未命名书籍
        </div>



        <!-- ==================================================
             全书树结构

             节点：

                 序
                 卷
                 篇
                 章

             节点的位置由 layout.js 计算。
        ================================================== -->

        <div
            id="tree"
            class="tree"
        ></div>



        <!-- ==================================================
             操作栏

             由 actions.js 控制。

             选择书名时：

                 ＋序
                 ＋卷
                 ＋篇
                 ＋章

             选择节点时：

                 ＋同级
                 ＋篇
                 ＋章

             具体按钮由 actions.js 动态生成。
        ================================================== -->

        <div
            id="bookActions"
            class="book-actions"
            style="display: none;"
        ></div>


    </main>



    <!-- ==================================================
         JavaScript

         ★★★ 非常重要 ★★★

         正确加载顺序：

         1. state.js
         2. storage.js
         3. nodes.js
         4. layout.js
         5. connections.js
         6. actions.js
         7. events.js
         8. main.js


         为什么 events.js 必须在 main.js 前面？

         因为：

             main.js
                 ↓
             init()
                 ↓
             setupEvents()

         setupEvents() 是在 events.js 中定义的。

         所以必须：

             events.js
                 ↓
             main.js


         否则可能出现：

             ReferenceError:
             setupEvents is not defined
    ================================================== -->



    <!-- 1. 状态 -->

    <script src="js/book/state.js"></script>



    <!-- 2. 数据存储 -->

    <script src="js/book/storage.js"></script>



    <!-- 3. 节点 -->

    <script src="js/book/nodes.js"></script>



    <!-- 4. 自动布局 -->

    <script src="js/book/layout.js"></script>



    <!-- 5. 连接线 -->

    <script src="js/book/connections.js"></script>



    <!-- 6. 操作栏 -->

    <script src="js/book/actions.js"></script>



    <!-- 7. 鼠标 / 触摸 / 拖动事件 -->

    <script src="js/book/events.js"></script>



    <!-- 8. 页面初始化 -->

    <script src="js/book/main.js"></script>


</body>

</html>
