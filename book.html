<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>全书</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f8fa;
    color: #222;

    min-height: 100vh;

    padding-top: 72px;
}


/* =========================
   顶部固定栏
========================= */

.top-bar {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 72px;

    background: #fff;

    border-bottom: 1px solid #e8e8e8;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 100;
}

.page-title {
    font-size: 20px;

    font-weight: 700;
}


/* 左侧返回 */

.back-button {
    position: absolute;

    left: 20px;

    border: none;

    background: none;

    color: #4f7cff;

    font-size: 15px;

    cursor: pointer;

    padding: 8px;
}


/* =========================
   主体
========================= */

.container {
    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 45px 20px 80px;
}


/* =========================
   书名区域
========================= */

.book-title-area {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;
}


/* 书名 */

.book-title {

    font-size: 25px;

    font-weight: 700;

    text-align: center;

    cursor: grab;

    user-select: none;

    padding: 8px 25px;

    min-width: 120px;

    max-width: 90%;

    word-break: break-word;

    position: relative;
}

.book-title:active {
    cursor: grabbing;
}


/* =========================
   书名下面的线
========================= */

.title-line {

    width: 100%;

    height: 1px;

    background: #dfe2e7;

    position: relative;

    margin-top: 12px;
}


/* =========================
   中间的 + / -
========================= */

.expand-button {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    top: -15px;

    width: 30px;

    height: 30px;

    border-radius: 50%;

    border: 1px solid #d8dce2;

    background: #fff;

    color: #666;

    font-size: 20px;

    line-height: 26px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    z-index: 5;
}

.expand-button:hover {
    background: #f5f6f8;
}


/* =========================
   添加结构区域
========================= */

.add-panel {

    width: 100%;

    display: none;

    justify-content: center;

    gap: 12px;

    padding-top: 28px;

    padding-bottom: 25px;
}


.add-panel.show {
    display: flex;
}


/* 添加按钮 */

.add-structure-button {

    border: 1px solid #dfe2e7;

    background: #fff;

    color: #444;

    border-radius: 9px;

    padding: 10px 15px;

    font-size: 14px;

    cursor: pointer;

    white-space: nowrap;

    transition:
        background 0.15s ease,
        border-color 0.15s ease;
}

.add-structure-button:hover {
    background: #f5f7fa;

    border-color: #cfd4dc;
}


/* 已经添加过的序 */

.add-structure-button.disabled {

    color: #bbb;

    background: #f1f2f4;

    border-color: #e5e6e8;

    cursor: not-allowed;
}


/* =========================
   内容区域
========================= */

.structure-list {

    width: 100%;

    margin-top: 5px;
}


/* 每一个结构 */

.structure-item {

    background: #fff;

    border: 1px solid #e7e9ed;

    border-radius: 10px;

    min-height: 54px;

    margin-bottom: 10px;

    display: flex;

    align-items: center;

    padding: 0 17px;

    cursor: pointer;

    transition:
        background 0.15s ease,
        transform 0.15s ease;
}

.structure-item:hover {

    background: #fafbfc;

    transform: translateX(2px);
}


/* 左边类型 */

.structure-type {

    font-size: 13px;

    color: #999;

    width: 42px;

    flex-shrink: 0;
}


/* 名称 */

.structure-name {

    font-size: 15px;

    font-weight: 600;

    flex: 1;
}


/* 右边箭头 */

.structure-arrow {

    color: #aaa;

    font-size: 19px;
}


/* =========================
   空状态
========================= */

.empty-text {

    text-align: center;

    color: #aaa;

    font-size: 14px;

    padding-top: 25px;
}


/* =========================
   移动书名时的状态
========================= */

.book-title.dragging {

    opacity: 0.55;

}


/* =========================
   手机
========================= */

@media (max-width: 600px) {

    .back-button {
        left: 12px;
    }

    .container {
        padding:
            35px 14px 60px;
    }

    .book-title {
        font-size: 22px;
    }

    .add-panel {

        gap: 7px;

        padding-top: 25px;

    }

    .add-structure-button {

        padding:
            9px 10px;

        font-size: 13px;
    }

}
</style>
</head>

<body>


<!-- =========================
     顶部
========================= -->

<header class="top-bar">

    <button
        class="back-button"
        onclick="goBack()">

        ← 返回

    </button>


    <div class="page-title">

        全书

    </div>

</header>



<!-- =========================
     主体
========================= -->

<main class="container">


    <!-- =====================
         书名
    ====================== -->

    <section
        id="bookTitleArea"
        class="book-title-area">


        <div
            id="bookTitle"
            class="book-title"
            draggable="true">

            我的小说

        </div>


        <!-- 横线 -->

        <div class="title-line">


            <!-- + / - -->

            <button
                id="expandButton"
                class="expand-button"
                onclick="toggleAddPanel()">

                +

            </button>

        </div>


        <!-- =================
             添加栏
        ================== -->

        <div
            id="addPanel"
            class="add-panel">


            <button
                id="addPrefaceButton"
                class="add-structure-button"
                onclick="addPreface()">

                ＋序

            </button>


            <button
                class="add-structure-button"
                onclick="addChapter()">

                ＋章

            </button>


            <button
                class="add-structure-button"
                onclick="addPart()">

                ＋篇

            </button>


            <button
                class="add-structure-button"
                onclick="addVolume()">

                ＋卷

            </button>


        </div>


    </section>



    <!-- =====================
         全书结构
    ====================== -->

    <section
        id="structureList"
        class="structure-list">

    </section>


</main>



<script>

/* =========================
   当前书籍
========================= */

let currentBook = null;


/* =========================
   读取书籍
========================= */

function loadBook() {

    const currentBookId =
        localStorage.getItem(
            "currentBookId"
        );


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    const books =
        savedBooks
        ? JSON.parse(savedBooks)
        : [];


    if (!currentBookId) {

        alert("没有选择书籍");

        window.location.href =
            "index.html";

        return;

    }


    currentBook =
        books.find(function(book) {

            return String(book.id) ===
                String(currentBookId);

        });


    if (!currentBook) {

        alert("找不到这本书");

        window.location.href =
            "index.html";

        return;

    }


    /* 显示书名 */

    document.getElementById(
        "bookTitle"
    ).textContent =
        currentBook.title ||
        "未命名书籍";


    /* 初始化结构 */

    if (!currentBook.structure) {

        currentBook.structure = [];

    }


    renderStructure();

}


/* =========================
   展开 / 收起
========================= */

function toggleAddPanel() {

    const panel =
        document.getElementById(
            "addPanel"
        );

    const button =
        document.getElementById(
            "expandButton"
        );


    if (
        panel.classList.contains("show")
    ) {

        panel.classList.remove("show");

        button.textContent = "+";

    } else {

        panel.classList.add("show");

        button.textContent = "−";

    }

}


/* =========================
   添加序
========================= */

function addPreface() {

    if (!currentBook) {
        return;
    }


    /* 序只能存在一个 */

    const alreadyExists =
        currentBook.structure.some(
            function(item) {

                return item.type === "序";

            }
        );


    if (alreadyExists) {

        return;

    }


    const item = {

        id: Date.now(),

        type: "序",

        name: "序",

        order:
            currentBook.structure.length

    };


    currentBook.structure.push(item);


    saveBook();

    renderStructure();


    /* 序添加后按钮变灰 */

    updatePrefaceButton();

}


/* =========================
   添加章
========================= */

function addChapter() {

    addStructure(
        "章",
        "第" +
        getNextNumber("章") +
        "章"
    );

}


/* =========================
   添加篇
========================= */

function addPart() {

    addStructure(
        "篇",
        "第" +
        getNextNumber("篇") +
        "篇"
    );

}


/* =========================
   添加卷
========================= */

function addVolume() {

    addStructure(
        "卷",
        "第" +
        getNextNumber("卷") +
        "卷"
    );

}


/* =========================
   通用添加
========================= */

function addStructure(
    type,
    name
) {

    if (!currentBook) {
        return;
    }


    const item = {

        id: Date.now(),

        type: type,

        name: name,

        order:
            currentBook.structure.length

    };


    currentBook.structure.push(item);


    saveBook();

    renderStructure();

}


/* =========================
   自动编号
========================= */

function getNextNumber(type) {

    const count =
        currentBook.structure.filter(
            function(item) {

                return item.type === type;

            }
        ).length;


    return count + 1;

}


/* =========================
   显示结构
========================= */

function renderStructure() {

    const list =
        document.getElementById(
            "structureList"
        );


    list.innerHTML = "";


    if (
        !currentBook ||
        !currentBook.structure ||
        currentBook.structure.length === 0
    ) {

        list.innerHTML = `
            <div class="empty-text">
                还没有添加全书结构
            </div>
        `;

        updatePrefaceButton();

        return;

    }


    currentBook.structure.forEach(
        function(item) {


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "structure-item";


            element.onclick =
                function() {

                    openStructure(
                        item.id
                    );

                };


            element.innerHTML = `

                <div class="structure-type">
                    ${item.type}
                </div>

                <div class="structure-name">
                    ${escapeHTML(item.name)}
                </div>

                <div class="structure-arrow">
                    ›
                </div>

            `;


            list.appendChild(element);

        }
    );


    updatePrefaceButton();

}


/* =========================
   序按钮状态
========================= */

function updatePrefaceButton() {

    const button =
        document.getElementById(
            "addPrefaceButton"
        );


    if (!currentBook) {
        return;
    }


    const exists =
        currentBook.structure.some(
            function(item) {

                return item.type === "序";

            }
        );


    if (exists) {

        button.classList.add(
            "disabled"
        );

        button.textContent =
            "序 ✓";

        button.onclick =
            function() {};

    } else {

        button.classList.remove(
            "disabled"
        );

        button.textContent =
            "＋序";

        button.onclick =
            addPreface;

    }

}


/* =========================
   打开结构
========================= */

function openStructure(id) {

    const item =
        currentBook.structure.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!item) {
        return;
    }


    alert(
        item.type +
        "：" +
        item.name +
        "\n\n" +
        "下一步可以进入该结构继续添加内容。"
    );

}


/* =========================
   保存
========================= */

function saveBook() {

    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    const books =
        savedBooks
        ? JSON.parse(savedBooks)
        : [];


    const index =
        books.findIndex(
            function(book) {

                return String(book.id) ===
                    String(currentBook.id);

            }
        );


    if (index !== -1) {

        books[index] =
            currentBook;

        localStorage.setItem(
            "novelBooks",
            JSON.stringify(books)
        );

    }

}


/* =========================
   返回
========================= */

function goBack() {

    window.location.href =
        "index.html";

}


/* =========================
   防止文字破坏页面
========================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   书名拖动
========================= */

const titleElement =
    document.getElementById(
        "bookTitle"
    );


titleElement.addEventListener(
    "dragstart",
    function() {

        titleElement.classList.add(
            "dragging"
        );

    }
);


titleElement.addEventListener(
    "dragend",
    function() {

        titleElement.classList.remove(
            "dragging"
        );

    }
);


/* =========================
   页面启动
========================= */

loadBook();

</script>

</body>
</html>
