<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="./css/book-base.css?v=50002"
    >

    <link
        rel="stylesheet"
        href="./css/book-node.css?v=50004"
    >

    <link
        rel="stylesheet"
        href="./css/book-line.css?v=50002"
    >

    <link
        rel="stylesheet"
        href="./css/book-layout.css?v=50003"
    >

    <link
        rel="stylesheet"
        href="./css/book-action.css?v=50002"
    >

</head>

<body>

    <header
        id="topBar"
        class="top-bar"
    >

        <button
            id="backButton"
            class="top-button"
            type="button"
            onclick="window.location.href='./index.html';"
        >
            ← 返回
        </button>


        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <button
            id="layoutButton"
            class="top-button"
            type="button"
        >
            ↕ 纵向
        </button>

    </header>


    <main
        id="canvas"
        class="canvas"
    >

        <div
            id="workspace"
            class="workspace"
        >

            <svg
                id="connections"
                class="connections"
            ></svg>


            <div
                id="bookTitle"
                class="book-title"
            >
                新书
            </div>


            <div
                id="actionBar"
                class="action-bar"
            >

                <button
                    type="button"
                    class="action-preface"
                    data-action="preface"
                >
                    ＋序
                </button>


                <button
                    type="button"
                    class="action-chapter"
                    data-action="chapter"
                >
                    ＋章
                </button>


                <button
                    type="button"
                    class="action-part"
                    data-action="part"
                >
                    ＋篇
                </button>


                <button
                    type="button"
                    class="action-volume"
                    data-action="volume"
                >
                    ＋卷
                </button>

            </div>


            <div
                id="tree"
                class="tree"
            ></div>

        </div>

    </main>


    <!-- 数据 -->

    <script
        src="./js/book/book-data.js?v=50002"
    ></script>


    <!-- 储存 -->

    <script
        src="./js/book/book-storage.js?v=50002"
    ></script>


    <!-- 树结构 -->

    <script
        src="./js/book/book-tree.js?v=50003"
    ></script>


    <!-- 节点 -->

    <script
        src="./js/book/book-node.js?v=50002"
    ></script>


    <!-- 连接线 -->

    <script
        src="./js/book/book-line.js?v=50002"
    ></script>


    <!-- 布局 -->

    <script
        src="./js/book/book-layout.js?v=50003"
    ></script>


    <!-- 页面主逻辑 -->

    <script
        src="./js/book/book-main.js?v=50003"
    ></script>


</body>

</html>
