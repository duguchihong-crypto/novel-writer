<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>


    <!-- ==================================================
         原有样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book.css?v=40001"
    >


    <!-- ==================================================
         新树系统样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book/tree.css?v=10001"
    >

</head>


<body>

    <!-- ==================================================
         顶部栏
    ================================================== -->

    <header
        id="topBar"
        class="top-bar"
    >

        <button
            id="backButton"
            class="top-button"
            type="button"
            onclick="window.location.href='./index.html';"
        >
            ← 返回
        </button>


        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <button
            id="layoutButton"
            class="top-button"
            type="button"
        >
            ↕ 纵向
        </button>

    </header>


    <!-- ==================================================
         画布
    ================================================== -->

    <main
        id="canvas"
        class="canvas"
    >

        <div
            id="workspace"
            class="workspace"
        >

            <!-- ==================================================
                 连接线
            ================================================== -->

            <svg
                id="connections"
                class="connections"
            ></svg>


            <!-- ==================================================
                 原来的书名节点
                 
                 新 tree.js 会自己生成书名节点。
                 这里保留 HTML 结构，但由 tree.css 隐藏。
            ================================================== -->

            <div
                id="bookTitle"
                class="book-title"
            >
                新书
            </div>


            <!-- ==================================================
                 树
            ================================================== -->

            <div
                id="tree"
                class="tree"
            ></div>


            <!-- ==================================================
                 底部固定操作栏
                 
                 顺序：
                 序 → 章 → 篇 → 卷
            ================================================== -->

            <div
                id="actionBar"
                class="action-bar"
            >

                <button
                    type="button"
                    class="action-preface"
                    data-action="preface"
                >
                    ＋序
                </button>


                <button
                    type="button"
                    class="action-chapter"
                    data-action="chapter"
                >
                    ＋章
                </button>


                <button
                    type="button"
                    class="action-part"
                    data-action="part"
                >
                    ＋篇
                </button>


                <button
                    type="button"
                    class="action-volume"
                    data-action="volume"
                >
                    ＋卷
                </button>

            </div>

        </div>

    </main>


    <!-- ==================================================
         新树系统
         
         注意：
         不再加载旧 main.js
    ================================================== -->

    <script src="./js/book/tree.js?v=10001"></script>


    <!-- ==================================================
         自动居中
    ================================================== -->

    <script src="./js/book/center-view.js?v=40001"></script>

</body>

</html>
