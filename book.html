<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全书</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 sans-serif;
    background: #fafafa;
    color: #222;
}

button,
input,
textarea {
    font: inherit;
}

/* =========================
   顶部
========================= */

.top-bar {
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 56px;
    background: rgba(255,255,255,0.96);
    border-bottom: 1px solid #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
}

.back-button {
    position: absolute;
    left: 14px;
    border: 0;
    background: transparent;
    color: #333;
    font-size: 16px;
    padding: 8px 4px;
}

.top-title {
    font-size: 18px;
    font-weight: 600;
}

/* =========================
   画布
========================= */

.canvas {
    position: absolute;
    left: 0;
    right: 0;
    top: 56px;
    bottom: 0;
    overflow: auto;
    background:
        radial-gradient(circle at 1px 1px, #eeeeee 1px, transparent 1px);
    background-size: 24px 24px;
    touch-action: pan-x pan-y;
}

.tree {
    position: relative;
    min-width: 1000px;
    min-height: 1000px;
    padding-top: 100px;
    padding-bottom: 180px;
}

/* =========================
   书名
========================= */

.book-root {
    position: relative;
    width: max-content;
    max-width: 280px;
    min-width: 150px;
    margin: 0 auto;
    z-index: 20;
}

.book-box {
    position: relative;
    min-width: 150px;
    max-width: 280px;
    min-height: 70px;
    padding: 14px 26px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    line-height: 1.45;
    word-break: break-all;

    background: #fde8e8;
    color: #a52828;

    border: 2px solid #d96b6b;
    border-radius: 38px;

    box-shadow: 0 4px 14px rgba(160, 50, 50, 0.10);

    cursor: pointer;
    user-select: none;
}

.book-box.selected {
    box-shadow:
        0 0 0 3px rgba(217,107,107,0.18),
        0 5px 18px rgba(160,50,50,0.16);
}

/* 书名自由移动状态 */
.book-root.free-move {
    position: absolute;
    left: 50%;
    top: 100px;
    transform: translateX(-50%);
    margin: 0;
    cursor: grab;
}

.book-root.free-move.dragging {
    cursor: grabbing;
}

/* =========================
   结构区域
========================= */

.structure-area {
    position: relative;
    width: 100%;
    margin-top: 55px;
}

/*
  每一个层级都采用 flex 自动排列。
  这样卷、篇、章可以自然向左右展开。
*/

.node-level {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 46px;
    width: max-content;
    margin: 0 auto;
    position: relative;
}

.node-column {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   节点
========================= */

.node-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 150px;
}

.node-box {
    position: relative;
    z-index: 10;

    min-width: 130px;
    max-width: 220px;
    min-height: 50px;

    padding: 12px 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    line-height: 1.4;
    word-break: break-all;

    border-radius: 10px;
    border: 1px solid;

    cursor: pointer;
    user-select: none;

    transition:
        box-shadow 0.15s,
        transform 0.15s;
}

.node-box.selected {
    transform: translateY(-1px);
}

/* 序：青 */
.node-preface {
    background: #e3f6f5;
    color: #08706c;
    border-color: #72c9c3;
}

/* 卷：黄 */
.node-volume {
    background: #fff6d9;
    color: #8a6710;
    border-color: #e3c65c;
}

/* 篇：白 */
.node-part {
    background: #f7f7f5;
    color: #555;
    border-color: #cfcfca;
}

/* 章：黑 */
.node-chapter {
    background: #ededed;
    color: #222;
    border-color: #777;
}

/* =========================
   节点操作
========================= */

.node-actions {
    position: absolute;
    left: calc(100% + 12px);
    top: 50%;
    transform: translateY(-50%);

    display: flex;
    align-items: center;
    gap: 5px;

    white-space: nowrap;
    z-index: 50;
}

.action-button {
    height: 30px;
    padding: 0 9px;

    border: 1px solid #ddd;
    border-radius: 7px;

    background: #fff;
    color: #555;

    font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.action-button:active {
    transform: scale(0.96);
}

.delete-button {
    color: #b73535;
    border-color: #e2bcbc;
    background: #fff5f5;
}

/* =========================
   连线
========================= */

.connector {
    position: relative;
    z-index: 1;
    pointer-events: none;
}

/* 竖线 */
.vertical-line {
    width: 1px;
    height: 34px;
    background: #bdbdbd;
}

/* 横线 */
.horizontal-line {
    height: 1px;
    background: #bdbdbd;
}

/* 连线上的 +/- */

.line-toggle {
    position: absolute;
    z-index: 30;
    width: 22px;
    height: 22px;

    margin-left: -11px;
    margin-top: -11px;

    border: 1px solid #cfcfcf;
    border-radius: 50%;

    background: #fff;
    color: #777;

    font-size: 14px;
    line-height: 20px;
    text-align: center;

    pointer-events: auto;
    cursor: pointer;

    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

.line-toggle:active {
    transform: scale(0.92);
}

/* =========================
   子节点区域
========================= */

.children-area {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.children-area.collapsed {
    display: none;
}

/*
  父节点 -> 子节点
*/
.parent-child-line {
    width: 1px;
    height: 38px;
    background: #bdbdbd;
    position: relative;
}

/*
  子节点横向连接线
*/
.children-row {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 46px;
}

.children-row::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: #bdbdbd;
}

/* 子节点上方的竖线 */
.child-column {
    position: relative;
    padding-top: 28px;
}

.child-column::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: 1px;
    height: 28px;
    background: #bdbdbd;
}

/* =========================
   空状态
========================= */

.empty-structure {
    display: none;
}

/* =========================
   底部固定操作栏
========================= */

.bottom-bar {
    position: fixed;
    z-index: 1000;

    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);

    min-height: 52px;
    padding: 7px;

    display: none;
    align-items: center;
    justify-content: center;
    gap: 7px;

    background: rgba(255,255,255,0.96);
    border: 1px solid #e4e4e4;
    border-radius: 15px;

    box-shadow: 0 5px 22px rgba(0,0,0,0.12);
}

.bottom-bar.show {
    display: flex;
}

.add-button {
    height: 38px;
    padding: 0 14px;

    border: 1px solid #ddd;
    border-radius: 9px;

    background: #fff;
    font-size: 14px;
}

.add-button:active {
    transform: scale(0.96);
}

.add-preface {
    color: #08706c;
    background: #e3f6f5;
    border-color: #72c9c3;
}

.add-volume {
    color: #8a6710;
    background: #fff6d9;
    border-color: #e3c65c;
}

.add-part {
    color: #555;
    background: #f7f7f5;
}

.add-chapter {
    color: #222;
    background: #ededed;
}

/* =========================
   手机屏幕
========================= */

@media (max-width: 600px) {

    .tree {
        min-width: 850px;
    }

    .node-level,
    .children-row {
        gap: 34px;
    }

    .node-box {
        min-width: 120px;
        max-width: 190px;
        padding: 10px 17px;
        font-size: 14px;
    }

    .book-box {
        max-width: 240px;
        min-width: 140px;
        font-size: 16px;
    }

    .node-actions {
        left: calc(100% + 8px);
    }
}
</style>
</head>

<body>

<!-- 顶部 -->
<div class="top-bar">
    <button class="back-button" onclick="goBack()">← 返回</button>
    <div class="top-title">全书</div>
</div>

<!-- 画布 -->
<div class="canvas" id="canvas">

    <div class="tree" id="tree">

        <!-- 书名 -->
        <div class="book-root free-move" id="bookRoot">
            <div class="book-box" id="bookBox" onclick="selectBook(event)">
                书名
            </div>
        </div>

        <!-- 结构 -->
        <div class="structure-area" id="structureArea"></div>

    </div>

</div>

<!-- 书名被点击后出现 -->
<div class="bottom-bar" id="bottomBar">

    <button
        class="add-button add-preface"
        id="addPrefaceButton"
        onclick="addRootPreface(event)">
        ＋序
    </button>

    <button
        class="add-button add-chapter"
        onclick="addRootChapter(event)">
        ＋章
    </button>

    <button
        class="add-button add-part"
        onclick="addRootPart(event)">
        ＋篇
    </button>

    <button
        class="add-button add-volume"
        onclick="addRootVolume(event)">
        ＋卷
    </button>

</div>

<script>

/* =========================================================
   全局数据
========================================================= */

let currentBook = null;

let selectedNodeId = null;
let selectedIsBook = false;

let draggedBook = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

const canvas = document.getElementById("canvas");
const tree = document.getElementById("tree");
const structureArea = document.getElementById("structureArea");
const bookRoot = document.getElementById("bookRoot");
const bookBox = document.getElementById("bookBox");
const bottomBar = document.getElementById("bottomBar");


/* =========================================================
   初始化
========================================================= */

function init() {

    const currentBookId =
        localStorage.getItem("currentBookId");

    const savedBooks =
        localStorage.getItem("novelBooks");

    if (!currentBookId || !savedBooks) {
        return;
    }

    const books = JSON.parse(savedBooks);

    currentBook =
        books.find(
            book => String(book.id) === String(currentBookId)
        );

    if (!currentBook) {
        return;
    }

    if (!currentBook.structure) {
        currentBook.structure = [];
    }

    document.title =
        currentBook.title || "全书";

    bookBox.textContent =
        currentBook.title || "未命名书籍";

    renderTree();

    clearSelection();
}


/* =========================================================
   返回
========================================================= */

function goBack() {
    window.location.href = "index.html";
}


/* =========================================================
   ID
========================================================= */

function createId() {

    return Date.now().toString(36)
        + Math.random().toString(36).slice(2);
}


/* =========================================================
   创建节点
========================================================= */

function createNode(type, name) {

    return {
        id: createId(),
        type: type,
        name: name,
        children: [],
        collapsed: false
    };
}


/* =========================================================
   书名选择
========================================================= */

function selectBook(event) {

    event.stopPropagation();

    selectedNodeId = null;
    selectedIsBook = true;

    renderTree();

    bottomBar.classList.add("show");
}


/* =========================================================
   选择结构
========================================================= */

function selectNode(nodeId, event) {

    if (event) {
        event.stopPropagation();
    }

    selectedNodeId = nodeId;
    selectedIsBook = false;

    renderTree();

    bottomBar.classList.remove("show");
}


/* =========================================================
   清除选择
========================================================= */

function clearSelection() {

    selectedNodeId = null;
    selectedIsBook = false;

    bottomBar.classList.remove("show");

    renderTree();
}


/* =========================================================
   空白区域点击
========================================================= */

document.addEventListener("click", function(event) {

    if (
        event.target.closest(".node-box") ||
        event.target.closest(".book-box") ||
        event.target.closest(".node-actions") ||
        event.target.closest(".bottom-bar") ||
        event.target.closest(".line-toggle")
    ) {
        return;
    }

    clearSelection();
});


/* =========================================================
   序
========================================================= */

function addRootPreface(event) {

    event.stopPropagation();

    if (
        currentBook.structure.some(
            node => node.type === "preface"
        )
    ) {
        alert("序只能添加一次");
        return;
    }

    currentBook.structure.push(
        createNode("preface", "序")
    );

    saveBook();

    selectedNodeId = null;
    selectedIsBook = true;

    renderTree();
}


/* =========================================================
   根章
========================================================= */

function addRootChapter(event) {

    event.stopPropagation();

    const number =
        getNextNumberFromArray(
            currentBook.structure,
            "chapter"
        );

    currentBook.structure.push(
        createNode(
            "chapter",
            "第" + number + "章："
        )
    );

    saveBook();

    renderTree();
}


/* =========================================================
   根篇
========================================================= */

function addRootPart(event) {

    event.stopPropagation();

    const number =
        getNextNumberFromArray(
            currentBook.structure,
            "part"
        );

    currentBook.structure.push(
        createNode(
            "part",
            "第" + number + "篇："
        )
    );

    saveBook();

    renderTree();
}


/* =========================================================
   根卷
========================================================= */

function addRootVolume(event) {

    event.stopPropagation();

    const number =
        getNextNumberFromArray(
            currentBook.structure,
            "volume"
        );

    currentBook.structure.push(
        createNode(
            "volume",
            "第" + number + "卷："
        )
    );

    saveBook();

    renderTree();
}


/* =========================================================
   数字
========================================================= */

function getNextNumberFromArray(array, type) {

    let count = 0;

    array.forEach(node => {

        if (node.type === type) {
            count++;
        }

    });

    return chineseNumber(count + 1);
}


/* =========================================================
   中文数字
========================================================= */

function chineseNumber(number) {

    const nums = [
        "零",
        "一",
        "二",
        "三",
        "四",
        "五",
        "六",
        "七",
        "八",
        "九",
        "十"
    ];

    if (number <= 10) {
        return nums[number];
    }

    if (number < 20) {
        return "十" + nums[number - 10];
    }

    if (number < 100) {

        const tens =
            Math.floor(number / 10);

        const ones =
            number % 10;

        return nums[tens] +
            "十" +
            (ones ? nums[ones] : "");
    }

    return String(number);
}


/* =========================================================
   渲染整个树
========================================================= */

function renderTree() {

    if (!currentBook) {
        return;
    }

    structureArea.innerHTML = "";

    const structures =
        currentBook.structure || [];

    if (structures.length === 0) {

        bookRoot.classList.add("free-move");

        return;
    }

    bookRoot.classList.remove("free-move");

    const rootLine =
        document.createElement("div");

    rootLine.className =
        "parent-child-line";

    structureArea.appendChild(rootLine);

    renderChildren(
        structures,
        structureArea
    );
}


/* =========================================================
   渲染子节点
========================================================= */

function renderChildren(nodes, parentElement) {

    if (!nodes || nodes.length === 0) {
        return;
    }

    const row =
        document.createElement("div");

    row.className =
        "children-row";

    parentElement.appendChild(row);

    nodes.forEach(node => {

        const column =
            document.createElement("div");

        column.className =
            "child-column";

        row.appendChild(column);

        renderNode(node, column);
    });
}


/* =========================================================
   渲染节点
========================================================= */

function renderNode(node, parentElement) {

    const wrap =
        document.createElement("div");

    wrap.className =
        "node-wrap";

    parentElement.appendChild(wrap);


    /* 节点 */

    const box =
        document.createElement("div");

    box.className =
        "node-box " +
        getNodeClass(node.type);

    box.textContent =
        node.name;

    if (selectedNodeId === node.id) {

        box.classList.add("selected");
    }

    box.addEventListener("click", function(event) {

        selectNode(node.id, event);

    });

    wrap.appendChild(box);


    /* 操作 */

    if (selectedNodeId === node.id) {

        const actions =
            createNodeActions(node);

        wrap.appendChild(actions);
    }


    /* 子节点 */

    if (
        node.children &&
        node.children.length > 0
    ) {

        const toggleLine =
            document.createElement("div");

        toggleLine.className =
            "parent-child-line";

        wrap.appendChild(toggleLine);


        /* +/- */

        const toggle =
            document.createElement("button");

        toggle.className =
            "line-toggle";

        toggle.textContent =
            node.collapsed ? "＋" : "−";

        toggle.style.top =
            "100%";

        toggle.style.left =
            "50%";

        toggle.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                node.collapsed =
                    !node.collapsed;

                saveBook();

                renderTree();
            }
        );

        wrap.appendChild(toggle);


        if (!node.collapsed) {

            const childArea =
                document.createElement("div");

            childArea.className =
                "children-area";

            wrap.appendChild(childArea);

            renderChildren(
                node.children,
                childArea
            );
        }
    }
}


/* =========================================================
   节点颜色
========================================================= */

function getNodeClass(type) {

    if (type === "preface") {
        return "node-preface";
    }

    if (type === "volume") {
        return "node-volume";
    }

    if (type === "part") {
        return "node-part";
    }

    return "node-chapter";
}


/* =========================================================
   节点操作栏
========================================================= */

function createNodeActions(node) {

    const actions =
        document.createElement("div");

    actions.className =
        "node-actions";


    /* 删除 */

    const deleteButton =
        createActionButton(
            "🗑",
            function(event) {

                event.stopPropagation();

                deleteNode(node.id);
            }
        );

    deleteButton.classList.add(
        "delete-button"
    );

    actions.appendChild(deleteButton);


    /* 序和章没有其他操作 */

    if (
        node.type === "preface" ||
        node.type === "chapter"
    ) {
        return actions;
    }


    /* 卷：同级、篇、章 */

    if (node.type === "volume") {

        actions.appendChild(
            createActionButton(
                "＋同级",
                function(event) {

                    event.stopPropagation();

                    addSameLevel(
                        node,
                        "volume"
                    );
                }
            )
        );

        actions.appendChild(
            createActionButton(
                "＋篇",
                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "part"
                    );
                }
            )
        );

        actions.appendChild(
            createActionButton(
                "＋章",
                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "chapter"
                    );
                }
            )
        );
    }


    /* 篇：同级、章 */

    if (node.type === "part") {

        actions.appendChild(
            createActionButton(
                "＋同级",
                function(event) {

                    event.stopPropagation();

                    addSameLevel(
                        node,
                        "part"
                    );
                }
            )
        );

        actions.appendChild(
            createActionButton(
                "＋章",
                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "chapter"
                    );
                }
            )
        );
    }


    return actions;
}


/* =========================================================
   创建按钮
========================================================= */

function createActionButton(text, callback) {

    const button =
        document.createElement("button");

    button.className =
        "action-button";

    button.textContent =
        text;

    button.addEventListener(
        "click",
        callback
    );

    return button;
}


/* =========================================================
   添加同级
========================================================= */

function addSameLevel(node, type) {

    const result =
        findParentArray(
            currentBook.structure,
            node.id
        );

    if (!result) {
        return;
    }

    const array =
        result.array;

    const index =
        array.findIndex(
            item => item.id === node.id
        );

    const number =
        getNextNumberFromArray(
            array,
            type
        );

    let name = "";

    if (type === "volume") {
        name = "第" + number + "卷：";
    }

    if (type === "part") {
        name = "第" + number + "篇：";
    }

    if (type === "chapter") {
        name = "第" + number + "章：";
    }

    const newNode =
        createNode(type, name);

    array.splice(
        index + 1,
        0,
        newNode
    );

    saveBook();

    renderTree();
}


/* =========================================================
   添加子节点
========================================================= */

function addChild(parent, type) {

    if (!parent.children) {
        parent.children = [];
    }

    const number =
        getNextNumberFromArray(
            parent.children,
            type
        );

    let name = "";

    if (type === "part") {
        name = "第" + number + "篇：";
    }

    if (type === "chapter") {
        name = "第" + number + "章：";
    }

    if (type === "volume") {
        name = "第" + number + "卷：";
    }

    const newNode =
        createNode(type, name);

    parent.children.push(
        newNode
    );

    parent.collapsed = false;

    saveBook();

    renderTree();
}


/* =========================================================
   查找父级数组
========================================================= */

function findParentArray(array, id) {

    for (let node of array) {

        if (node.id === id) {

            return {
                array: array,
                node: node
            };
        }

        if (
            node.children &&
            node.children.length
        ) {

            const result =
                findParentArray(
                    node.children,
                    id
                );

            if (result) {
                return result;
            }
        }
    }

    return null;
}


/* =========================================================
   删除
========================================================= */

function deleteNode(id) {

    const result =
        findParentArray(
            currentBook.structure,
            id
        );

    if (!result) {
        return;
    }

    const array =
        result.array;

    const index =
        array.findIndex(
            node => node.id === id
        );

    if (index === -1) {
        return;
    }

    array.splice(index, 1);

    selectedNodeId = null;
    selectedIsBook = false;

    saveBook();

    renderTree();

    bottomBar.classList.remove("show");
}


/* =========================================================
   保存
========================================================= */

function saveBook() {

    const savedBooks =
        localStorage.getItem("novelBooks");

    if (!savedBooks) {
        return;
    }

    const books =
        JSON.parse(savedBooks);

    const index =
        books.findIndex(
            book =>
                String(book.id) ===
                String(currentBook.id)
        );

    if (index === -1) {
        return;
    }

    books[index] =
        currentBook;

    localStorage.setItem(
        "novelBooks",
        JSON.stringify(books)
    );
}


/* =========================================================
   书名自由拖动
========================================================= */

bookBox.addEventListener(
    "pointerdown",
    function(event) {

        if (
            currentBook &&
            currentBook.structure &&
            currentBook.structure.length > 0
        ) {
            return;
        }

        draggedBook = true;

        bookRoot.classList.add(
            "dragging"
        );

        const rect =
            bookRoot.getBoundingClientRect();

        dragOffsetX =
            event.clientX - rect.left;

        dragOffsetY =
            event.clientY - rect.top;

        bookBox.setPointerCapture(
            event.pointerId
        );
    }
);


bookBox.addEventListener(
    "pointermove",
    function(event) {

        if (!draggedBook) {
            return;
        }

        const canvasRect =
            canvas.getBoundingClientRect();

        const treeRect =
            tree.getBoundingClientRect();

        let left =
            event.clientX -
            canvasRect.left +
            canvas.scrollLeft -
            dragOffsetX;

        let top =
            event.clientY -
            canvasRect.top +
            canvas.scrollTop -
            dragOffsetY;

        left -=
            treeRect.left -
            canvasRect.left +
            canvas.scrollLeft;

        top -=
            treeRect.top -
            canvasRect.top +
            canvas.scrollTop;

        bookRoot.style.left =
            left + "px";

        bookRoot.style.top =
            top + "px";

        bookRoot.style.transform =
            "none";

    }
);


bookBox.addEventListener(
    "pointerup",
    function() {

        draggedBook = false;

        bookRoot.classList.remove(
            "dragging"
        );
    }
);


bookBox.addEventListener(
    "pointercancel",
    function() {

        draggedBook = false;

        bookRoot.classList.remove(
            "dragging"
        );
    }
);


/* =========================================================
   启动
========================================================= */

init();

</script>
