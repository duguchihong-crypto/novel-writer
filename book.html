<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>


    <!-- ==================================================
         全书基础样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-base.css?v=40001"
    >


    <!-- ==================================================
         书名、节点样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-node.css?v=40001"
    >


    <!-- ==================================================
         连接线样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-line.css?v=40001"
    >


    <!-- ==================================================
         布局样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-layout.css?v=40001"
    >


    <!-- ==================================================
         底部操作栏样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-action.css?v=40001"
    >

</head>


<body>

    <!-- ==================================================
         顶部栏
    ================================================== -->

    <header
        id="topBar"
        class="top-bar"
    >

        <button
            id="backButton"
            class="top-button"
            type="button"
            onclick="window.location.href='./index.html';"
        >
            ← 返回
        </button>


        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <button
            id="layoutButton"
            class="top-button"
            type="button"
        >
            ↕ 纵向
        </button>

    </header>


    <!-- ==================================================
         画布
    ================================================== -->

    <main
        id="canvas"
        class="canvas"
    >

        <div
            id="workspace"
            class="workspace"
        >

            <!-- ==================================================
                 连接线
            ================================================== -->

            <svg
                id="connections"
                class="connections"
            ></svg>


            <!-- ==================================================
                 全书书名
            ================================================== -->

            <div
                id="bookTitle"
                class="book-title"
            >
                新书
            </div>


            <!-- ==================================================
                 底部固定操作栏

                 顺序：
                 序 → 章 → 篇 → 卷
            ================================================== -->

            <div
                id="actionBar"
                class="action-bar"
            >

                <button
                    type="button"
                    class="action-preface"
                    data-action="preface"
                >
                    ＋序
                </button>


                <button
                    type="button"
                    class="action-chapter"
                    data-action="chapter"
                >
                    ＋章
                </button>


                <button
                    type="button"
                    class="action-part"
                    data-action="part"
                >
                    ＋篇
                </button>


                <button
                    type="button"
                    class="action-volume"
                    data-action="volume"
                >
                    ＋卷
                </button>

            </div>


            <!-- ==================================================
                 树
            ================================================== -->

            <div
                id="tree"
                class="tree"
            ></div>

        </div>

    </main>


    <!-- ==================================================
         全书数据
    ================================================== -->

    <script
        src="./js/book/book-data.js?v=40001"
    ></script>


    <!-- ==================================================
         全书存储
    ================================================== -->

    <script
        src="./js/book/book-storage.js?v=40001"
    ></script>


    <!-- ==================================================
         全书树结构
    ================================================== -->

    <script
        src="./js/book/book-tree.js?v=40001"
    ></script>


    <!-- ==================================================
         全书节点
    ================================================== -->

    <script
        src="./js/book/book-node.js?v=40001"
    ></script>


    <!-- ==================================================
         全书主程序
    ================================================== -->

    <script
        src="./js/book/book-main.js?v=40001"
    ></script>


    <!-- ==================================================
         全书布局
    ================================================== -->

    <script
        src="./js/book/book-layout.js?v=40001"
    ></script>

</body>

</html>
