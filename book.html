<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="css/book.css"
    >

</head>

<body>

    <!-- ==================================================
         顶部栏
    ================================================== -->

    <header class="top-bar">

        <!-- 返回书架 -->

        <button
            id="backButton"
            class="back-button"
            type="button"
            onclick="returnToShelf()"
        >
            ← 返回
        </button>


        <!-- 页面标题 -->

        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <!-- 布局方向 -->

        <button
            id="layoutToggle"
            class="layout-toggle"
            type="button"
            aria-label="切换布局方向"
        >
            ↕ 纵向
        </button>

    </header>


    <!-- ==================================================
         全书画布

         固定坐标系统：

         3000 × 3000

         中心：

         X = 1500
         Y = 1500

         所有内容使用同一个坐标系统：

         1. 小说书名
         2. 序
         3. 卷
         4. 篇
         5. 章
         6. SVG连接线
         7. 操作按钮
    ================================================== -->

    <main class="tree-canvas">


        <!-- ==================================================
             SVG连接线
        ================================================== -->

        <svg
            id="connections"
            class="connections"
            aria-hidden="true"
        ></svg>


        <!-- ==================================================
             小说书名

             注意：

             这里绝对不要写：

             未命名书籍
             未命名小说
             任何固定书名

             书名统一由：

             js/book/main.js

             从：

             currentBookId
                    ↓
             novelBooks
                    ↓
             book.title

             读取。

             防止多个 JavaScript 同时修改书名。
        ================================================== -->

        <div
            id="bookTitle"
            class="book-title"
        ></div>


        <!-- ==================================================
             全书树结构
        ================================================== -->

        <div
            id="tree"
            class="tree"
        ></div>


        <!-- ==================================================
             操作栏
        ================================================== -->

        <div
            id="bookActions"
            class="book-actions"
            style="display: none;"
        ></div>

    </main>


    <!-- ==================================================
         JavaScript

         必须按照以下顺序加载：

         1. state.js
         2. storage.js
         3. nodes.js
         4. layout.js
         5. connections.js
         6. actions.js
         7. events.js
         8. main.js

         main.js 最后执行页面初始化。
    ================================================== -->


    <!-- 1. 状态 -->

    <script src="js/book/state.js"></script>


    <!-- 2. 数据存储 -->

    <script src="js/book/storage.js"></script>


    <!-- 3. 节点 -->

    <script src="js/book/nodes.js"></script>


    <!-- 4. 自动布局 -->

    <script src="js/book/layout.js"></script>


    <!-- 5. 连接线 -->

    <script src="js/book/connections.js"></script>


    <!-- 6. 操作栏 -->

    <script src="js/book/actions.js"></script>


    <!-- 7. 鼠标 / 触摸 / 拖动事件 -->

    <script src="js/book/events.js"></script>


    <!-- 8. 页面初始化 -->

    <script src="js/book/main.js"></script>


    <!-- ==================================================
         返回书架

         注意：

         书名加载不再放在这里。

         书名统一由 main.js 管理。
    ================================================== -->

    <script>

        function returnToShelf() {

            /* ------------------------------------------
               保存当前小说
            ------------------------------------------ */

            try {

                if (
                    typeof saveBook ===
                    "function"
                ) {

                    saveBook();

                }

            } catch (error) {

                console.error(
                    "保存小说失败：",
                    error
                );

            }


            /* ------------------------------------------
               清除当前章节
            ------------------------------------------ */

            try {

                localStorage.removeItem(
                    "currentChapterId"
                );

            } catch (error) {

                console.error(
                    "清除当前章节失败：",
                    error
                );

            }


            /* ------------------------------------------
               清除返回标记
            ------------------------------------------ */

            try {

                sessionStorage.removeItem(
                    "returnToShelfAfterCreate"
                );

            } catch (error) {

                console.error(
                    "清除返回标记失败：",
                    error
                );

            }


            /* ------------------------------------------
               返回书架
            ------------------------------------------ */

            window.location.replace(
                "index.html"
            );

        }

    </script>

</body>

</html>
