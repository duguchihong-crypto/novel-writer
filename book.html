<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>


    <!-- ==================================================
         基础样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-base.css?v=60002"
    >


    <!-- ==================================================
         节点样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-node.css?v=60002"
    >


    <!-- ==================================================
         连接线样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-line.css?v=60002"
    >


    <!-- ==================================================
         布局样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-layout.css?v=70002"
    >


    <!-- ==================================================
         操作栏样式
    ================================================== -->

    <link
        rel="stylesheet"
        href="./css/book-action.css?v=60002"
    >

</head>


<body>


    <!-- ==================================================
         顶部栏
    ================================================== -->

    <header
        id="topBar"
        class="top-bar"
    >


        <!-- ==================================================
             返回书架
        ================================================== -->

        <button
            id="backButton"
            class="top-button"
            type="button"
        >
            ← 返回
        </button>


        <!-- ==================================================
             页面标题
        ================================================== -->

        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <!-- ==================================================
             布局切换
        ================================================== -->

        <button
            id="layoutButton"
            class="top-button"
            type="button"
        >
            ↕ 纵向
        </button>

    </header>



    <!-- ==================================================
         画布
    ================================================== -->

    <main
        id="canvas"
        class="canvas"
    >

        <div
            id="workspace"
            class="workspace"
        >


            <!-- ==================================================
                 SVG 连接线
            ================================================== -->

            <svg
                id="connections"
                class="connections"
            ></svg>



            <!-- ==================================================
                 书名
            ================================================== -->

            <div
                id="bookTitle"
                class="book-title"
            >
                新书
            </div>



            <!-- ==================================================
                 书名操作栏
            ================================================== -->

            <div
                id="actionBar"
                class="action-bar"
            >


                <!-- 序 -->

                <button
                    type="button"
                    class="action-preface"
                    data-action="preface"
                >
                    ＋序
                </button>


                <!-- 章 -->

                <button
                    type="button"
                    class="action-chapter"
                    data-action="chapter"
                >
                    ＋章
                </button>


                <!-- 篇 -->

                <button
                    type="button"
                    class="action-part"
                    data-action="part"
                >
                    ＋篇
                </button>


                <!-- 卷 -->

                <button
                    type="button"
                    class="action-volume"
                    data-action="volume"
                >
                    ＋卷
                </button>

            </div>



            <!-- ==================================================
                 树
            ================================================== -->

            <div
                id="tree"
                class="tree"
            ></div>

        </div>

    </main>



    <!-- ==================================================
         全书数据
    ================================================== -->

    <script
        src="./js/book/book-data.js?v=60002"
    ></script>



    <!-- ==================================================
         全书存储
    ================================================== -->

    <script
        src="./js/book/book-storage.js?v=60002"
    ></script>



    <!-- ==================================================
         树结构
    ================================================== -->

    <script
        src="./js/book/book-tree.js?v=60002"
    ></script>



    <!-- ==================================================
         节点
    ================================================== -->

    <script
        src="./js/book/book-node.js?v=60002"
    ></script>



    <!-- ==================================================
         连接线
    ================================================== -->

    <script
        src="./js/book/book-line.js?v=60002"
    ></script>



    <!-- ==================================================
         布局
    ================================================== -->

    <script
        src="./js/book/book-layout.js?v=70002"
    ></script>



    <!-- ==================================================
         主程序
    ================================================== -->

    <script
        src="./js/book/book-main.js?v=90003"
    ></script>



    <!-- ==================================================
         全书页面控制
    ================================================== -->

    <script>

        /* ==================================================
           禁止恢复上一次滚动位置
        ================================================== */

        if (
            "scrollRestoration" in history
        ) {

            history.scrollRestoration =
                "manual";

        }



        /* ==================================================
           返回书架
        ================================================== */

        const backButton =
            document.getElementById(
                "backButton"
            );


        if (backButton) {

            backButton.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    window.location.href =
                        "./index.html";

                }
            );

        }



        /* ==================================================
           居中书名
        ================================================== */

        function centerBookOnEnter() {

            const bookTitle =
                document.getElementById(
                    "bookTitle"
                );


            if (!bookTitle) {

                return;

            }


            bookTitle.scrollIntoView({

                behavior: "auto",

                block: "center",

                inline: "center"

            });

        }



        /* ==================================================
           页面加载
        ================================================== */

        window.addEventListener(
            "load",
            function () {

                centerBookOnEnter();

            }
        );



        /* ==================================================
           Safari 页面恢复
        ================================================== */

        window.addEventListener(
            "pageshow",
            function () {

                setTimeout(
                    function () {

                        centerBookOnEnter();

                    },
                    50
                );

            }
        );



        /* ==================================================
           最后校正
        ================================================== */

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        centerBookOnEnter();

                    },
                    300
                );

            }
        );

    </script>


</body>

</html>
