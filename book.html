<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="css/book.css"
    >

</head>


<body>


    <!-- ==================================================
         顶部栏
    ================================================== -->

    <header class="top-bar">


        <!-- 返回 -->

        <button
            id="backButton"
            class="back-button"
            type="button"
            onclick="returnToShelf()"
        >
            ← 返回
        </button>


        <!-- 页面标题 -->

        <div
            id="pageTitle"
            class="page-title"
        >
            全书
        </div>


        <!-- 布局方向 -->

        <button
            id="layoutToggle"
            class="layout-toggle"
            type="button"
            aria-label="切换布局方向"
        >
            ↕ 纵向
        </button>


    </header>



    <!-- ==================================================
         全书画布

         固定坐标系统：

         3000 × 3000

         中心：

         X = 1500
         Y = 1500

         以下元素全部使用同一个坐标系统：

         1. 小说书名
         2. 序 / 卷 / 篇 / 章
         3. SVG连接线
         4. + / − 操作按钮
    ================================================== -->

    <main class="tree-canvas">


        <!-- ==================================================
             SVG连接线
        ================================================== -->

        <svg
            id="connections"
            class="connections"
            aria-hidden="true"
        ></svg>



        <!-- ==================================================
             小说书名

             ★★★ 这里不再写死「未命名书籍」 ★★★

             JavaScript 会根据：

                 currentBookId
                     ↓
                 novelBooks
                     ↓
                 book.title

             自动显示真正的小说名称。
        ================================================== -->

        <div
            id="bookTitle"
            class="book-title"
        ></div>



        <!-- ==================================================
             全书树结构
        ================================================== -->

        <div
            id="tree"
            class="tree"
        ></div>



        <!-- ==================================================
             操作栏
        ================================================== -->

        <div
            id="bookActions"
            class="book-actions"
            style="display: none;"
        ></div>


    </main>



    <!-- ==================================================
         JavaScript

         正确加载顺序：

         1. state.js
         2. storage.js
         3. nodes.js
         4. layout.js
         5. connections.js
         6. actions.js
         7. events.js
         8. main.js
    ================================================== -->


    <!-- 1. 状态 -->

    <script src="js/book/state.js"></script>


    <!-- 2. 数据存储 -->

    <script src="js/book/storage.js"></script>


    <!-- 3. 节点 -->

    <script src="js/book/nodes.js"></script>


    <!-- 4. 自动布局 -->

    <script src="js/book/layout.js"></script>


    <!-- 5. 连接线 -->

    <script src="js/book/connections.js"></script>


    <!-- 6. 操作栏 -->

    <script src="js/book/actions.js"></script>


    <!-- 7. 鼠标 / 触摸 / 拖动事件 -->

    <script src="js/book/events.js"></script>


    <!-- 8. 页面初始化 -->

    <script src="js/book/main.js"></script>



    <!-- ==================================================
         ★★★ 小说书名加载 ★★★

         从 LocalStorage 中读取真正的小说名称。

         数据结构：

             novelBooks
                 ↓
             [
                 {
                     id: "...",
                     title: "宝可梦：赤红传",
                     cover: "...",
                     ...
                 }
             ]

             currentBookId
                 ↓
             找到对应 book
                 ↓
             book.title
                 ↓
             #bookTitle
    ================================================== -->

    <script>

        function loadCurrentBookTitle() {

            const titleElement =
                document.getElementById(
                    "bookTitle"
                );


            if (!titleElement) {

                return;

            }


            /* ------------------------------------------
               获取当前小说 ID
            ------------------------------------------ */

            let currentBookId = null;


            try {

                currentBookId =
                    localStorage.getItem(
                        "currentBookId"
                    );

            } catch (error) {

                console.error(
                    "读取 currentBookId 失败：",
                    error
                );

            }


            /* ------------------------------------------
               没有当前小说
            ------------------------------------------ */

            if (!currentBookId) {

                titleElement.textContent =
                    "未命名小说";

                document.title =
                    "全书";

                return;

            }


            /* ------------------------------------------
               获取所有小说
            ------------------------------------------ */

            let savedBooks = null;


            try {

                savedBooks =
                    localStorage.getItem(
                        "novelBooks"
                    );

            } catch (error) {

                console.error(
                    "读取 novelBooks 失败：",
                    error
                );

            }


            if (!savedBooks) {

                titleElement.textContent =
                    "未命名小说";

                document.title =
                    "全书";

                return;

            }


            /* ------------------------------------------
               解析小说数据
            ------------------------------------------ */

            let books = [];


            try {

                const parsedBooks =
                    JSON.parse(
                        savedBooks
                    );


                if (
                    Array.isArray(
                        parsedBooks
                    )
                ) {

                    books =
                        parsedBooks;

                }

            } catch (error) {

                console.error(
                    "解析 novelBooks 失败：",
                    error
                );

            }


            /* ------------------------------------------
               查找当前小说
            ------------------------------------------ */

            const currentBook =
                books.find(
                    function(book) {

                        return (
                            String(book.id) ===
                            String(currentBookId)
                        );

                    }
                );


            /* ------------------------------------------
               显示小说名称
            ------------------------------------------ */

            if (
                currentBook &&
                currentBook.title
            ) {

                titleElement.textContent =
                    currentBook.title;


                /*
                 * 浏览器标签页
                 */

                document.title =
                    currentBook.title +
                    " - 全书";

            } else {

                titleElement.textContent =
                    "未命名小说";

                document.title =
                    "全书";

            }

        }


        /* ==================================================
           页面加载完成后读取小说名称
        ================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                loadCurrentBookTitle();

            }
        );

    </script>



    <!-- ==================================================
         返回书架
    ================================================== -->

    <script>

        function returnToShelf() {

            try {

                if (
                    typeof saveBook ===
                    "function"
                ) {

                    saveBook();

                }

            } catch (error) {

                console.error(
                    "保存小说失败：",
                    error
                );

            }


            try {

                localStorage.removeItem(
                    "currentChapterId"
                );

            } catch (error) {

                console.error(
                    "清除当前章节失败：",
                    error
                );

            }


            try {

                sessionStorage.removeItem(
                    "returnToShelfAfterCreate"
                );

            } catch (error) {

                console.error(
                    "清除返回标记失败：",
                    error
                );

            }


            window.location.replace(
                "index.html"
            );

        }

    </script>


</body>

</html>
