<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>全书</title>


<style>

/* ==================================================
   基础
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #ffffff;

    color: #222;

    overflow: hidden;

    -webkit-user-select: none;
    user-select: none;
}


/* ==================================================
   顶部
================================================== */

.top-bar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 56px;

    background: rgba(255,255,255,0.98);

    border-bottom: 1px solid #eeeeee;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 1000;
}

.page-title {

    font-size: 18px;

    font-weight: 600;

    color: #222;
}

.back-button {

    position: absolute;

    left: 16px;

    border: none;

    background: transparent;

    color: #555;

    font-size: 16px;

    padding: 8px 4px;

    cursor: pointer;
}

.back-button:active {

    opacity: 0.5;
}


/* ==================================================
   主区域
================================================== */

.main {

    position: fixed;

    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: auto;

    -webkit-overflow-scrolling: touch;

    background: #ffffff;
}


/* ==================================================
   画布
================================================== */

.structure-area {

    position: relative;

    min-width: 100%;

    min-height: 100%;

    padding: 60px 60px 140px;

    overflow: visible;
}


/*
   真正的树状布局画布
*/

.tree-canvas {

    position: relative;

    width: 100%;

    min-height: 500px;

}


/* ==================================================
   SVG 连线层
================================================== */

.connection-layer {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

    pointer-events: none;

    z-index: 1;
}


/* 普通连接线 */

.connection-line {

    fill: none;

    stroke: #d2d2d2;

    stroke-width: 1.5;

    vector-effect: non-scaling-stroke;
}


/* ==================================================
   书名
================================================== */

.book-node {

    position: absolute;

    z-index: 10;
}

.book-box {

    min-width: 190px;

    max-width: min(360px, 75vw);

    min-height: 62px;

    padding: 13px 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    border-radius: 22px;

    background: #fff1f1;

    border: 1.5px solid #e5a0a0;

    color: #9b2222;

    font-size: 19px;

    font-weight: 650;

    line-height: 1.45;

    word-break: break-word;

    overflow-wrap: anywhere;

    box-shadow:
        0 2px 7px rgba(0,0,0,0.035);

    cursor: pointer;

    user-select: none;

    transition:
        box-shadow 0.12s,
        transform 0.12s;
}

.book-box.selected {

    box-shadow:
        0 0 0 2px rgba(155,34,34,0.10),
        0 3px 10px rgba(0,0,0,0.06);
}


/* ==================================================
   结构节点
================================================== */

.node {

    position: absolute;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;
}


.node-box {

    min-width: 155px;

    max-width: 230px;

    min-height: 48px;

    padding: 11px 21px;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    line-height: 1.4;

    word-break: break-word;

    overflow-wrap: anywhere;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    user-select: none;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.035);

    transition:
        box-shadow 0.12s,
        transform 0.12s;
}


/* ==================================================
   节点被选中
================================================== */

.node.selected .node-box {

    box-shadow:
        0 0 0 2px rgba(0,0,0,0.08),
        0 3px 10px rgba(0,0,0,0.07);

    transform: translateY(-1px);
}


/* ==================================================
   序
================================================== */

.node-preface {

    background: #eef9f8;

    border: 1.5px solid #8fc9c5;

    color: #176d68;
}


/* ==================================================
   卷
================================================== */

.node-volume {

    background: #fffbea;

    border: 1.5px solid #dfca70;

    color: #806900;
}


/* ==================================================
   篇
================================================== */

.node-part {

    background: #fafafa;

    border: 1.5px solid #c9c9c9;

    color: #555555;
}


/* ==================================================
   章
================================================== */

.node-chapter {

    background: #f3f3f3;

    border: 1.5px solid #999999;

    color: #202020;
}


/* ==================================================
   右侧操作区域
================================================== */

.node-actions {

    position: absolute;

    left: calc(100% + 10px);

    top: 50%;

    transform: translateY(-50%);

    display: none;

    align-items: center;

    gap: 6px;

    white-space: nowrap;

    z-index: 50;
}


/*
   只有选中的节点显示操作
*/

.node.selected .node-actions {

    display: flex;
}


/* ==================================================
   操作按钮
================================================== */

.action-button {

    height: 32px;

    padding: 0 9px;

    border: 1px solid #e3e3e3;

    border-radius: 7px;

    background: #ffffff;

    color: #666;

    font-size: 13px;

    cursor: pointer;

    box-shadow:
        0 1px 4px rgba(0,0,0,0.04);

    white-space: nowrap;
}

.action-button:active {

    background: #f5f5f5;
}


/* ==================================================
   垃圾桶
================================================== */

.delete-button {

    width: 32px;

    padding: 0;

    color: #888;

    font-size: 15px;
}


/* ==================================================
   连线中间的 + / -
================================================== */

.line-control {

    position: absolute;

    width: 24px;

    height: 24px;

    border-radius: 50%;

    border: 1px solid #d3d3d3;

    background: #ffffff;

    color: #777;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 16px;

    line-height: 1;

    cursor: pointer;

    z-index: 30;

    box-shadow:
        0 1px 4px rgba(0,0,0,0.06);

    pointer-events: auto;
}

.line-control:active {

    background: #f5f5f5;

    transform: scale(0.94);
}


/* ==================================================
   空状态
================================================== */

.empty-hint {

    position: absolute;

    left: 50%;

    top: 190px;

    transform: translateX(-50%);

    color: #aaa;

    font-size: 14px;

    line-height: 1.9;

    text-align: center;

    white-space: nowrap;
}


/* ==================================================
   底部固定操作栏
================================================== */

.bottom-bar {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 88px;

    background: rgba(255,255,255,0.98);

    border-top: 1px solid #eeeeee;

    display: none;

    align-items: center;

    justify-content: center;

    gap: 9px;

    padding:
        12px 16px
        calc(12px + env(safe-area-inset-bottom));

    z-index: 1000;
}


/*
   书名被选中时才显示
*/

.bottom-bar.visible {

    display: flex;
}


/* ==================================================
   底部添加按钮
================================================== */

.add-button {

    height: 44px;

    min-width: 72px;

    padding: 0 14px;

    border-radius: 9px;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.1s,
        opacity 0.1s;
}

.add-button:active {

    transform: scale(0.96);
}


/* ==================================================
   ＋序
================================================== */

.add-preface {

    background: #eef9f8;

    border: 1.5px solid #8fc9c5;

    color: #176d68;
}


/* ==================================================
   ＋章
================================================== */

.add-chapter {

    background: #f3f3f3;

    border: 1.5px solid #999999;

    color: #202020;
}


/* ==================================================
   ＋篇
================================================== */

.add-part {

    background: #fafafa;

    border: 1.5px solid #c9c9c9;

    color: #555555;
}


/* ==================================================
   ＋卷
================================================== */

.add-volume {

    background: #fffbea;

    border: 1.5px solid #dfca70;

    color: #806900;
}


/* ==================================================
   序已经存在
================================================== */

.add-button.disabled {

    opacity: 0.38;

    cursor: not-allowed;
}


/* ==================================================
   手机
================================================== */

@media (max-width: 600px) {

    .structure-area {

        padding:
            50px 30px 140px;
    }


    .book-box {

        min-width: 155px;

        max-width: 250px;

        min-height: 56px;

        font-size: 17px;

        padding:
            12px 22px;
    }


    .node-box {

        min-width: 125px;

        max-width: 185px;

        min-height: 46px;

        padding:
            10px 14px;

        font-size: 14px;
    }


    .node-actions {

        left: calc(100% + 7px);

        gap: 4px;
    }


    .action-button {

        height: 29px;

        padding: 0 6px;

        font-size: 11px;
    }


    .delete-button {

        width: 29px;
    }


    .bottom-bar {

        gap: 6px;

        padding-left: 8px;

        padding-right: 8px;
    }


    .add-button {

        min-width: 0;

        flex: 1;

        padding:
            0 5px;

        font-size: 14px;
    }


    .empty-hint {

        font-size: 13px;

        white-space: normal;

        width: 260px;

        top: 170px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     顶部
================================================== -->

<header class="top-bar">

    <button
        class="back-button"
        onclick="goBack()">

        ← 返回

    </button>


    <div class="page-title">

        全书

    </div>

</header>



<!-- ==================================================
     主区域
================================================== -->

<main
    id="main"
    class="main">

    <div
        id="structureArea"
        class="structure-area">

        <div
            id="canvas"
            class="tree-canvas">

            <!-- SVG 连线 -->

            <svg
                id="connectionLayer"
                class="connection-layer">

            </svg>


            <!-- 书名 -->

            <div
                id="bookNode"
                class="book-node">

                <div
                    id="bookTitle"
                    class="book-box">

                    我的小说

                </div>

            </div>


            <!-- 树 -->

            <div
                id="tree">
            </div>


        </div>

    </div>

</main>



<!-- ==================================================
     底部固定添加
================================================== -->

<div
    id="bottomBar"
    class="bottom-bar">


    <button
        id="addPrefaceButton"
        class="add-button add-preface">

        ＋序

    </button>


    <button
        id="addChapterButton"
        class="add-button add-chapter">

        ＋章

    </button>


    <button
        id="addPartButton"
        class="add-button add-part">

        ＋篇

    </button>


    <button
        id="addVolumeButton"
        class="add-button add-volume">

        ＋卷

    </button>


</div>



<script>

/* ==================================================
   当前书籍
================================================== */

let currentBook = null;


/* ==================================================
   当前选中
================================================== */

let selectedNodeId = null;

let selectedIsBook = false;


/* ==================================================
   书名自由拖动位置
================================================== */

let bookPosition = {

    x: null,

    y: null

};


/* ==================================================
   拖动状态
================================================== */

let draggingBook = false;

let dragStartX = 0;

let dragStartY = 0;

let dragOriginalX = 0;

let dragOriginalY = 0;


/* ==================================================
   树布局参数
================================================== */

const NODE_WIDTH = 155;

const NODE_HEIGHT = 48;

const LEVEL_GAP = 95;

const SIBLING_GAP = 35;


/* ==================================================
   初始化
================================================== */

function init() {

    const currentBookId =
        localStorage.getItem(
            "currentBookId"
        );


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    const books =
        savedBooks
        ? JSON.parse(savedBooks)
        : [];


    currentBook =
        books.find(
            function(book) {

                return String(book.id) ===
                    String(currentBookId);

            }
        );


    if (!currentBook) {

        alert("没有找到这本书。");

        window.location.href =
            "index.html";

        return;
    }


    /*
       兼容旧书
    */

    if (
        !Array.isArray(
            currentBook.structure
        )
    ) {

        currentBook.structure = [];

    }


    if (
        currentBook.rootPosition &&
        typeof currentBook.rootPosition.x === "number" &&
        typeof currentBook.rootPosition.y === "number"
    ) {

        bookPosition.x =
            currentBook.rootPosition.x;

        bookPosition.y =
            currentBook.rootPosition.y;

    }


    document.getElementById(
        "bookTitle"
    ).textContent =
        currentBook.title ||
        "未命名小说";


    setupEvents();

    renderTree();

    updatePrefaceButton();

}


/* ==================================================
   返回
================================================== */

function goBack() {

    window.location.href =
        "index.html";

}


/* ==================================================
   创建 ID
================================================== */

function createId() {

    return Date.now() +
        Math.floor(
            Math.random() * 100000
        );

}


/* ==================================================
   创建节点
================================================== */

function createNode(
    type,
    name
) {

    return {

        id: createId(),

        type: type,

        name: name,

        children: [],

        collapsed: false

    };

}


/* ==================================================
   设置事件
================================================== */

function setupEvents() {

    const bookTitle =
        document.getElementById(
            "bookTitle"
        );


    /*
       点击书名
    */

    bookTitle.addEventListener(
        "click",
        function(event) {

            if (draggingBook) return;

            event.stopPropagation();

            selectBook();

        }
    );


    /*
       长按/拖动书名
    */

    bookTitle.addEventListener(
        "pointerdown",
        startBookDrag
    );


    /*
       空白区域
    */

    document
        .getElementById("main")
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                        document.getElementById("main") ||

                    event.target ===
                        document.getElementById("structureArea") ||

                    event.target ===
                        document.getElementById("canvas") ||

                    event.target.id === "tree"
                ) {

                    clearSelection();

                }

            }
        );


    /*
       底部按钮
    */

    document
        .getElementById(
            "addPrefaceButton"
        )
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                addRootPreface();

            }
        );


    document
        .getElementById(
            "addChapterButton"
        )
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                addRootChapter();

            }
        );


    document
        .getElementById(
            "addPartButton"
        )
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                addRootPart();

            }
        );


    document
        .getElementById(
            "addVolumeButton"
        )
        .addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                addRootVolume();

            }
        );

}


/* ==================================================
   选中书名
================================================== */

function selectBook() {

    selectedNodeId = null;

    selectedIsBook = true;


    document
        .querySelectorAll(
            ".node.selected"
        )
        .forEach(
            function(element) {

                element.classList.remove(
                    "selected"
                );

            }
        );


    document
        .getElementById(
            "bookTitle"
        )
        .classList.add(
            "selected"
        );


    document
        .getElementById(
            "bottomBar"
        )
        .classList.add(
            "visible"
        );

}


/* ==================================================
   选中节点
================================================== */

function selectNode(node) {

    selectedNodeId =
        node.id;

    selectedIsBook = false;


    document
        .getElementById(
            "bottomBar"
        )
        .classList.remove(
            "visible"
        );


    document
        .getElementById(
            "bookTitle"
        )
        .classList.remove(
            "selected"
        );


    document
        .querySelectorAll(
            ".node.selected"
        )
        .forEach(
            function(element) {

                element.classList.remove(
                    "selected"
                );

            }
        );


    const element =
        document.querySelector(
            '[data-node-id="' +
            node.id +
            '"]'
        );


    if (element) {

        element.classList.add(
            "selected"
        );

    }

}


/* ==================================================
   清除选择
================================================== */

function clearSelection() {

    selectedNodeId = null;

    selectedIsBook = false;


    document
        .getElementById(
            "bottomBar"
        )
        .classList.remove(
            "visible"
        );


    document
        .getElementById(
            "bookTitle"
        )
        .classList.remove(
            "selected"
        );


    document
        .querySelectorAll(
            ".node.selected"
        )
        .forEach(
            function(element) {

                element.classList.remove(
                    "selected"
                );

            }
        );

}


/* ==================================================
   书名拖动
   只有没有任何结构时允许自由移动
================================================== */

function startBookDrag(event) {

    if (
        currentBook &&
        currentBook.structure &&
        currentBook.structure.length > 0
    ) {

        return;

    }


    event.preventDefault();

    event.stopPropagation();


    const bookNode =
        document.getElementById(
            "bookNode"
        );


    const rect =
        bookNode.getBoundingClientRect();


    const canvasRect =
        document
            .getElementById("canvas")
            .getBoundingClientRect();


    dragStartX =
        event.clientX;

    dragStartY =
        event.clientY;


    dragOriginalX =
        rect.left -
        canvasRect.left;

    dragOriginalY =
        rect.top -
        canvasRect.top;


    draggingBook = false;


    bookNode.setPointerCapture(
        event.pointerId
    );


    function move(pointerEvent) {

        const dx =
            pointerEvent.clientX -
            dragStartX;


        const dy =
            pointerEvent.clientY -
            dragStartY;


        if (
            Math.abs(dx) > 4 ||
            Math.abs(dy) > 4
        ) {

            draggingBook = true;

        }


        if (!draggingBook) return;


        bookPosition.x =
            dragOriginalX + dx;


        bookPosition.y =
            dragOriginalY + dy;


        applyBookPosition();

    }


    function end(pointerEvent) {

        try {

            bookNode.releasePointerCapture(
                pointerEvent.pointerId
            );

        } catch (error) {}


        document.removeEventListener(
            "pointermove",
            move
        );


        document.removeEventListener(
            "pointerup",
            end
        );


        if (draggingBook) {

            if (
                !currentBook.rootPosition
            ) {

                currentBook.rootPosition = {};

            }


            currentBook.rootPosition.x =
                bookPosition.x;


            currentBook.rootPosition.y =
                bookPosition.y;


            saveBook();


            setTimeout(
                function() {

                    draggingBook = false;

                },
                50
            );

        }

    }


    document.addEventListener(
        "pointermove",
        move
    );


    document.addEventListener(
        "pointerup",
        end
    );

}


/* ==================================================
   应用书名位置
================================================== */

function applyBookPosition() {

    const bookNode =
        document.getElementById(
            "bookNode"
        );


    if (
        currentBook.structure.length > 0
    ) {

        return;

    }


    if (
        bookPosition.x === null ||
        bookPosition.y === null
    ) {

        const canvas =
            document.getElementById(
                "canvas"
            );


        const rect =
            canvas.getBoundingClientRect();


        const book =
            document
                .getElementById(
                    "bookTitle"
                )
                .getBoundingClientRect();


        bookPosition.x =
            (rect.width -
                book.width) / 2;


        bookPosition.y =
            60;

    }


    bookNode.style.left =
        bookPosition.x +
        "px";


    bookNode.style.top =
        bookPosition.y +
        "px";

}


/* ==================================================
   根目录：序
================================================== */

function addRootPreface() {

    if (!currentBook) return;


    const exists =
        currentBook.structure.some(
            function(item) {

                return item.type === "序";

            }
        );


    if (exists) return;


    currentBook.structure.push(

        createNode(
            "序",
            "序章："
        )

    );


    saveBook();

    renderTree();

    updatePrefaceButton();

    selectBook();

}


/* ==================================================
   根目录：章
================================================== */

function addRootChapter() {

    addRootNode(

        "章",

        getNextRootNumber("章")
        + "章："

    );

}


/* ==================================================
   根目录：篇
================================================== */

function addRootPart() {

    addRootNode(

        "篇",

        getNextRootNumber("篇")
        + "篇："

    );

}


/* ==================================================
   根目录：卷
================================================== */

function addRootVolume() {

    addRootNode(

        "卷",

        getNextRootNumber("卷")
        + "卷："

    );

}


/* ==================================================
   添加根节点
================================================== */

function addRootNode(
    type,
    name
) {

    if (!currentBook) return;


    currentBook.structure.push(

        createNode(
            type,
            name
        )

    );


    saveBook();

    renderTree();

    updatePrefaceButton();

    selectBook();

}


/* ==================================================
   根节点编号
================================================== */

function getNextRootNumber(type) {

    let count = 0;


    currentBook.structure.forEach(
        function(item) {

            if (
                item.type === type
            ) {

                count++;

            }

        }
    );


    return "第" +
        (count + 1);

}


/* ==================================================
   子节点编号
================================================== */

function getNextNumberFromArray(
    array,
    type
) {

    let count = 0;


    array.forEach(
        function(item) {

            if (
                item.type === type
            ) {

                count++;

            }

        }
    );


    return "第" +
        (count + 1);

}


/* ==================================================
   渲染整个树
================================================== */

function renderTree() {

    const canvas =
        document.getElementById(
            "canvas"
        );


    const tree =
        document.getElementById(
            "tree"
        );


    const svg =
        document.getElementById(
            "connectionLayer"
        );


    tree.innerHTML = "";


    svg.innerHTML = "";


    /*
       没有结构
    */

    if (
        !currentBook.structure ||
        currentBook.structure.length === 0
    ) {

        const hint =
            document.createElement(
                "div"
            );


        hint.className =
            "empty-hint";


        hint.innerHTML =
            "点击书名或拖动书名开始建立全书目录";


        tree.appendChild(
            hint
        );


        applyBookPosition();


        canvas.style.height =
            "600px";


        return;

    }


    /*
       有结构后：
       自动布局
    */

    const layout =
        calculateLayout();


    canvas.style.height =
        Math.max(
            layout.height + 160,
            600
        ) +
        "px";


    /*
       放置书名
    */

    const bookNode =
        document.getElementById(
            "bookNode"
        );


    bookNode.style.left =
        layout.book.x +
        "px";


    bookNode.style.top =
        layout.book.y +
        "px";


    /*
       放置节点
    */

    layout.nodes.forEach(
        function(info) {

            const nodeElement =
                createNodeElement(
                    info.node,
                    info.x,
                    info.y
                );


            tree.appendChild(
                nodeElement
            );

        }
    );


    /*
       画连接线
    */

    drawConnections(
        layout
    );


    /*
       恢复选择状态
    */

    if (selectedNodeId) {

        const selectedElement =
            document.querySelector(
                '[data-node-id="' +
                selectedNodeId +
                '"]'
            );


        if (selectedElement) {

            selectedElement.classList.add(
                "selected"
            );

        }

    }

}


/* ==================================================
   自动布局
================================================== */

function calculateLayout() {

    const canvas =
        document.getElementById(
            "canvas"
        );


    const canvasWidth =
        Math.max(
            canvas.clientWidth,
            window.innerWidth
        );


    const nodes = [];

    const leafWidths =
        new Map();


    /*
       计算子树宽度
    */

    function calculateWidth(node) {

        if (
            node.collapsed ||
            !node.children ||
            node.children.length === 0
        ) {

            leafWidths.set(
                node.id,
                NODE_WIDTH
            );

            return NODE_WIDTH;

        }


        let width = 0;


        node.children.forEach(
            function(child, index) {

                width +=
                    calculateWidth(
                        child
                    );


                if (
                    index <
                    node.children.length - 1
                ) {

                    width +=
                        SIBLING_GAP;

                }

            }
        );


        width =
            Math.max(
                width,
                NODE_WIDTH
            );


        leafWidths.set(
            node.id,
            width
        );


        return width;

    }


    currentBook.structure.forEach(
        calculateWidth
    );


    let totalWidth = 0;


    currentBook.structure.forEach(
        function(node, index) {

            totalWidth +=
                leafWidths.get(
                    node.id
                );


            if (
                index <
                currentBook.structure.length - 1
            ) {

                totalWidth +=
                    SIBLING_GAP;

            }

        }
    );


    totalWidth =
        Math.max(
            totalWidth,
            NODE_WIDTH
        );


    const contentWidth =
        Math.max(
            canvasWidth,
            totalWidth + 120
        );


    /*
       书名放在顶部中央
    */

    const bookWidth =
        Math.min(
            360,
            Math.max(
                190,
                Math.min(
                    75 * window.innerWidth / 100,
                    360
                )
            )
        );


    const bookX =
        (contentWidth -
            bookWidth) / 2;


    const bookY = 50;


    /*
       根节点 Y
    */

    const rootY =
        bookY + 115;


    /*
       计算根节点 X
    */

    let currentX =
        (contentWidth -
            totalWidth) / 2;


    function placeNode(
        node,
        subtreeX,
        y
    ) {

        const subtreeWidth =
            leafWidths.get(
                node.id
            );


        const x =
            subtreeX +
            (subtreeWidth -
                NODE_WIDTH) / 2;


        nodes.push({

            node: node,

            x: x,

            y: y

        });


        /*
           收起
        */

        if (
            node.collapsed ||
            !node.children ||
            node.children.length === 0
        ) {

            return;

        }


        let childX =
            subtreeX;


        node.children.forEach(
            function(child) {

                const childWidth =
                    leafWidths.get(
                        child.id
                    );


                placeNode(

                    child,

                    childX,

                    y + LEVEL_GAP

                );


                childX +=
                    childWidth +
                    SIBLING_GAP;

            }
        );

    }


    currentBook.structure.forEach(
        function(node) {

            const width =
                leafWidths.get(
                    node.id
                );


            placeNode(
                node,
                currentX,
                rootY
            );


            currentX +=
                width +
                SIBLING_GAP;

        }
    );


    let maxY =
        rootY + NODE_HEIGHT;


    nodes.forEach(
        function(item) {

            maxY =
                Math.max(
                    maxY,
                    item.y +
                    NODE_HEIGHT
                );

        }
    );


    return {

        width: contentWidth,

        height: maxY,

        book: {

            x: bookX,

            y: bookY

        },

        nodes: nodes

    };

}


/* ==================================================
   创建节点 DOM
================================================== */

function createNodeElement(
    node,
    x,
    y
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "node";


    wrapper.dataset.nodeId =
        node.id;


    wrapper.style.left =
        x + "px";


    wrapper.style.top =
        y + "px";


    /*
       节点框
    */

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "node-box " +
        getNodeClass(
            node.type
        );


    box.textContent =
        node.name;


    box.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            selectNode(node);

        }
    );


    wrapper.appendChild(
        box
    );


    /*
       右侧操作
    */

    const actions =
        document.createElement(
            "div"
        );


    actions.className =
        "node-actions";


    /*
       垃圾桶
    */

    const deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "action-button delete-button";


    deleteButton.textContent =
        "🗑";


    deleteButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            deleteNode(
                node.id
            );

        }
    );


    actions.appendChild(
        deleteButton
    );


    /*
       卷
    */

    if (
        node.type === "卷"
    ) {

        actions.appendChild(

            createActionButton(
                "＋同级",
                function(event) {

                    event.stopPropagation();

                    addSameLevel(
                        node,
                        "卷"
                    );

                }
            )

        );


        actions.appendChild(

            createActionButton(
                "＋篇",
                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "篇"
                    );

                }
            )

        );


        actions.appendChild(

            createActionButton(
                "＋章",
                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "章"
                    );

                }
            )

        );

    }


    /*
       篇
    */

    if (
        node.type === "篇"
    ) {

        actions.appendChild(

            createActionButton(
                "＋同级",
                function(event) {

                    event.stopPropagation();

                    addSameLevel(
                        node,
                        "篇"
                    );

                }
            )

        );


        actions.appendChild(

            createActionButton(
                "＋章",
                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "章"
                    );

                }
            )

        );

    }


    /*
       序 / 章
       只有垃圾桶
    */


    wrapper.appendChild(
        actions
    );


    return wrapper;

}


/* ==================================================
   获取节点颜色
================================================== */

function getNodeClass(type) {

    switch (type) {

        case "序":

            return "node-preface";


        case "卷":

            return "node-volume";


        case "篇":

            return "node-part";


        case "章":

            return "node-chapter";


        default:

            return "node-chapter";

    }

}


/* ==================================================
   创建操作按钮
================================================== */

function createActionButton(
    text,
    callback
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "action-button";


    button.textContent =
        text;


    button.addEventListener(
        "click",
        callback
    );


    return button;

}


/* ==================================================
   画所有连接线
================================================== */

function drawConnections(layout) {

    const svg =
        document.getElementById(
            "connectionLayer"
        );


    const canvas =
        document.getElementById(
            "canvas"
        );


    const canvasWidth =
        Math.max(
            canvas.clientWidth,
            layout.width
        );


    svg.setAttribute(
        "width",
        canvasWidth
    );


    svg.setAttribute(
        "height",
        layout.height + 100
    );


    svg.setAttribute(
        "viewBox",
        "0 0 " +
        canvasWidth +
        " " +
        (layout.height + 100)
    );


    /*
       创建 SVG path
    */

    function createPath(
        d
    ) {

        const path =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "path"
            );


        path.setAttribute(
            "d",
            d
        );


        path.setAttribute(
            "class",
            "connection-line"
        );


        svg.appendChild(
            path
        );

    }


    /*
       节点位置表
    */

    const positions =
        new Map();


    layout.nodes.forEach(
        function(info) {

            positions.set(
                info.node.id,
                info
            );

        }
    );


    /*
       书名中心
    */

    const bookWidth =
        document
            .getElementById(
                "bookTitle"
            )
            .offsetWidth;


    const bookHeight =
        document
            .getElementById(
                "bookTitle"
            )
            .offsetHeight;


    const bookCenterX =
        layout.book.x +
        bookWidth / 2;


    const bookBottomY =
        layout.book.y +
        bookHeight;


    /*
       根节点连接书名
    */

    const roots =
        currentBook.structure;


    if (
        roots.length === 1
    ) {

        const child =
            positions.get(
                roots[0].id
            );


        if (child) {

            const childCenterX =
                child.x +
                NODE_WIDTH / 2;


            const childTopY =
                child.y;


            const midY =
                bookBottomY +
                (childTopY -
                    bookBottomY) / 2;


            createPath(

                "M " +
                bookCenterX +
                " " +
                bookBottomY +

                " L " +
                bookCenterX +
                " " +
                midY +

                " L " +
                childCenterX +
                " " +
                midY +

                " L " +
                childCenterX +
                " " +
                childTopY

            );


            if (
                roots[0].children &&
                roots[0].children.length > 0
            ) {

                addLineControl(
                    midY,
                    bookCenterX,
                    childCenterX,
                    roots[0]
                );

            }

        }

    } else if (
        roots.length > 1
    ) {

        /*
           先画书名到总分叉点
        */

        const first =
            positions.get(
                roots[0].id
            );


        const last =
            positions.get(
                roots[
                    roots.length - 1
                ].id
            );


        if (
            first &&
            last
        ) {

            const firstX =
                first.x +
                NODE_WIDTH / 2;


            const lastX =
                last.x +
                NODE_WIDTH / 2;


            const firstTop =
                first.y;


            const branchY =
                bookBottomY +
                (firstTop -
                    bookBottomY) / 2;


            createPath(

                "M " +
                bookCenterX +
                " " +
                bookBottomY +

                " L " +
                bookCenterX +
                " " +
                branchY

            );


            createPath(

                "M " +
                firstX +
                " " +
                branchY +

                " L " +
                lastX +
                " " +
                branchY

            );


            roots.forEach(
                function(root) {

                    const info =
                        positions.get(
                            root.id
                        );


                    if (!info) return;


                    const centerX =
                        info.x +
                        NODE_WIDTH / 2;


                    createPath(

                        "M " +
                        centerX +
                        " " +
                        branchY +

                        " L " +
                        centerX +
                        " " +
                        info.y

                    );

                }
            );


            addLineControl(
                branchY,
                bookCenterX,
                bookCenterX,
                null
            );

        }

    }


    /*
       节点之间的连接
    */

    layout.nodes.forEach(
        function(info) {

            const node =
                info.node;


            if (
                node.collapsed ||
                !node.children ||
                node.children.length === 0
            ) {

                return;

            }


            const parentX =
                info.x +
                NODE_WIDTH / 2;


            const parentY =
                info.y +
                NODE_HEIGHT;


            const children =
                node.children;


            const first =
                positions.get(
                    children[0].id
                );


            const last =
                positions.get(
                    children[
                        children.length - 1
                    ].id
                );


            if (
                !first ||
                !last
            ) {

                return;

            }


            const firstX =
                first.x +
                NODE_WIDTH / 2;


            const lastX =
                last.x +
                NODE_WIDTH / 2;


            const childY =
                first.y;


            /*
               一个孩子
            */

            if (
                children.length === 1
            ) {

                const childX =
                    firstX;


                const midY =
                    parentY +
                    (childY -
                        parentY) / 2;


                createPath(

                    "M " +
                    parentX +
                    " " +
                    parentY +

                    " L " +
                    parentX +
                    " " +
                    midY +

                    " L " +
                    childX +
                    " " +
                    midY +

                    " L " +
                    childX +
                    " " +
                    childY

                );


                addLineControl(
                    midY,
                    parentX,
                    childX,
                    node
                );

            }


            /*
               多个孩子
            */

            else {

                const branchY =
                    parentY +
                    (childY -
                        parentY) / 2;


                createPath(

                    "M " +
                    parentX +
                    " " +
                    parentY +

                    " L " +
                    parentX +
                    " " +
                    branchY

                );


                createPath(

                    "M " +
                    firstX +
                    " " +
                    branchY +

                    " L " +
                    lastX +
                    " " +
                    branchY

                );


                children.forEach(
                    function(child) {

                        const childInfo =
                            positions.get(
                                child.id
                            );


                        if (!childInfo) return;


                        const childX =
                            childInfo.x +
                            NODE_WIDTH / 2;


                        createPath(

                            "M " +
                            childX +
                            " " +
                            branchY +

                            " L " +
                            childX +
                            " " +
                            childInfo.y

                        );

                    }
                );


                addLineControl(
                    branchY,
                    parentX,
                    parentX,
                    node
                );

            }

        }
    );

}


/* ==================================================
   添加连接线 + / -
================================================== */

function addLineControl(
    y,
    x1,
    x2,
    node
) {

    /*
       只有真正拥有下级结构的节点
       才显示展开/收起按钮。
    */

    if (!node) return;


    if (
        !node.children ||
        node.children.length === 0
    ) {

        return;

    }


    let x =
        x1;


    if (
        x1 !== x2
    ) {

        x =
            x1 +
            (x2 - x1) / 2;

    }


    const control =
        document.createElement(
            "button"
        );


    control.className =
        "line-control";


    control.textContent =
        node.collapsed
        ? "+"
        : "−";


    control.style.left =
        (x - 12) +
        "px";


    control.style.top =
        (y - 12) +
        "px";


    control.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            toggleNode(
                node.id
            );

        }
    );


    document
        .getElementById("canvas")
        .appendChild(
            control
        );

}


/* ==================================================
   收起 / 展开
================================================== */

function toggleNode(id) {

    const result =
        findParentArray(
            currentBook.structure,
            id
        );


    if (!result) return;


    result.node.collapsed =
        !result.node.collapsed;


    saveBook();

    renderTree();

}


/* ==================================================
   添加同级
================================================== */

function addSameLevel(
    node,
    type
) {

    const result =
        findParentArray(
            currentBook.structure,
            node.id
        );


    if (!result) return;


    const newNode =
        createNode(

            type,

            getNextNumberFromArray(
                result.array,
                type
            )
            + type
            + "："

        );


    const index =
        result.array.findIndex(
            function(item) {

                return item.id ===
                    node.id;

            }
        );


    result.array.splice(

        index + 1,

        0,

        newNode

    );


    saveBook();

    renderTree();

    selectNode(newNode);

}


/* ==================================================
   添加下级
================================================== */

function addChild(
    parent,
    type
) {

    if (
        !Array.isArray(
            parent.children
        )
    ) {

        parent.children = [];

    }


    const number =
        getNextNumberFromArray(
            parent.children,
            type
        );


    const newNode =
        createNode(

            type,

            number +
            type +
            "："

        );


    parent.children.push(
        newNode
    );


    /*
       如果原来是收起状态，
       加完之后自动展开。
    */

    parent.collapsed =
        false;


    saveBook();

    renderTree();

    selectNode(newNode);

}


/* ==================================================
   查找节点所在数组
================================================== */

function findParentArray(
    array,
    id
) {

    for (
        let i = 0;
        i < array.length;
        i++
    ) {

        if (
            String(array[i].id) ===
            String(id)
        ) {

            return {

                array: array,

                node: array[i]

            };

        }


        if (
            array[i].children &&
            array[i].children.length
        ) {

            const result =
                findParentArray(

                    array[i].children,

                    id

                );


            if (result) {

                return result;

            }

        }

    }


    return null;

}


/* ==================================================
   删除
================================================== */

function deleteNode(id) {

    const result =
        findParentArray(

            currentBook.structure,

            id

        );


    if (!result) return;


    const node =
        result.node;


    let message =
        "确定删除「" +
        node.name +
        "」吗？";


    if (
        node.children &&
        node.children.length > 0
    ) {

        message +=
            "\n\n此结构下面还有 " +
            node.children.length +
            " 个直接下级结构，它们也会一起删除。";

    }


    if (
        !confirm(message)
    ) {

        return;

    }


    const index =
        result.array.findIndex(
            function(item) {

                return String(item.id) ===
                    String(id);

            }
        );


    if (
        index !== -1
    ) {

        result.array.splice(
            index,
            1
        );

    }


    selectedNodeId = null;

    selectedIsBook = false;


    saveBook();

    renderTree();

    updatePrefaceButton();

}


/* ==================================================
   序按钮状态
================================================== */

function updatePrefaceButton() {

    const button =
        document.getElementById(
            "addPrefaceButton"
        );


    if (!currentBook) return;


    const exists =
        currentBook.structure.some(
            function(item) {

                return item.type ===
                    "序";

            }
        );


    if (exists) {

        button.classList.add(
            "disabled"
        );


        button.textContent =
            "序 ✓";

    } else {

        button.classList.remove(
            "disabled"
        );


        button.textContent =
            "＋序";

    }

}


/* ==================================================
   保存
================================================== */

function saveBook() {

    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    const books =
        savedBooks
        ? JSON.parse(savedBooks)
        : [];


    const index =
        books.findIndex(
            function(book) {

                return String(book.id) ===
                    String(currentBook.id);

            }
        );


    if (
        index !== -1
    ) {

        books[index] =
            currentBook;


        localStorage.setItem(

            "novelBooks",

            JSON.stringify(
                books
            )

        );

    }

}


/* ==================================================
   窗口变化
================================================== */

window.addEventListener(
    "resize",
    function() {

        renderTree();

    }
);


/* ==================================================
   启动
================================================== */

init();

</script>
