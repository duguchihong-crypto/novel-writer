<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="css/book.css"
    >

</head>


<body>

    <!-- ==================================================
         顶部栏
    ================================================== -->

    <header class="top-bar">

        <!-- 返回 -->

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ← 返回
        </button>


        <!-- 页面标题 -->

        <div class="page-title">
            全书
        </div>


        <!-- 布局方向 -->

        <button
            id="layoutToggle"
            class="layout-toggle"
            type="button"
            aria-label="切换布局方向"
        >
            ↕ 纵向
        </button>

    </header>



    <!-- ==================================================
         全书画布

         这里是整个 3000 × 3000 的坐标系统。

         书名、树节点、连接线
         全部使用同一个坐标系。
    ================================================== -->

    <main class="tree-canvas">


        <!-- ==================================================
             连接线 SVG

             用于绘制：

             书名 ───── 卷
                       │
                       ├──── 章
                       ├──── 章
                       └──── 章

             以及：

             + / −
        ================================================== -->

        <svg
            id="connections"
            class="connections"
            aria-hidden="true"
        ></svg>



        <!-- ==================================================
             小说书名

             注意：

             这里不写 left / top。

             位置全部由 JS 控制。

             默认：

             3000 × 3000
             中心 = 1500 / 1500
        ================================================== -->

        <div
            id="bookTitle"
            class="book-title"
        >
            未命名书籍
        </div>



        <!-- ==================================================
             树结构

             序
             卷
             篇
             章
        ================================================== -->

        <div
            id="tree"
            class="tree"
        ></div>



        <!-- ==================================================
             底部操作栏

             由 events.js / actions.js
             根据当前选择动态生成。

             例如：

             ＋序
             ＋卷
             ＋篇
             ＋章

             或：

             ＋同级
             ＋篇
             ＋章
        ================================================== -->

        <div
            id="bookActions"
            class="book-actions"
            style="display: none;"
        ></div>

    </main>



    <!-- ==================================================
         JavaScript

         加载顺序：

         1. state
         2. storage
         3. nodes
         4. layout
         5. connections
         6. actions
         7. main
         8. events

         main.js 在 events.js 前面，
         确保页面初始化逻辑已经准备完成。
    ================================================== -->

    <script src="js/book/state.js"></script>

    <script src="js/book/storage.js"></script>

    <script src="js/book/nodes.js"></script>

    <script src="js/book/layout.js"></script>

    <script src="js/book/connections.js"></script>

    <script src="js/book/actions.js"></script>

    <script src="js/book/main.js"></script>

    <script src="js/book/events.js"></script>

</body>

</html>
