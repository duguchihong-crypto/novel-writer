<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="css/book.css"
    >
</head>


<body>

    <!-- ==========================
         顶部栏
    =========================== -->

    <header class="top-bar">

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ← 返回
        </button>


        <div class="page-title">
            全书
        </div>


        <div class="top-placeholder"></div>

    </header>



    <!-- ==========================
         全书画布
    =========================== -->

    <main class="tree-canvas">

        <!--
            SVG 用来绘制书名、
            序、卷、篇、章之间的连接线
        -->

        <svg
            id="connections"
            class="connections"
        ></svg>


        <!-- ======================
             书名
        ======================= -->

        <div
            id="bookTitle"
            class="book-title"
        >
            未命名书籍
        </div>


        <!-- ======================
             树结构
        ======================= -->

        <div
            id="tree"
            class="tree"
        ></div>


        <!-- ======================
             书级操作栏
        ======================= -->

        <div
            id="bookActions"
            class="book-actions"
            style="display: none;"
        >

            <button
                id="addPreface"
                type="button"
            >
                ＋序
            </button>


            <button
                id="addChapter"
                type="button"
            >
                ＋章
            </button>


            <button
                id="addPart"
                type="button"
            >
                ＋篇
            </button>


            <button
                id="addVolume"
                type="button"
            >
                ＋卷
            </button>

        </div>

    </main>



    <!-- ==========================
         JavaScript
         
         注意：
         顺序不能改变
    =========================== -->

    <script src="js/book/state.js"></script>

    <script src="js/book/storage.js"></script>

    <script src="js/book/nodes.js"></script>

    <script src="js/book/layout.js"></script>

    <script src="js/book/connections.js"></script>

    <script src="js/book/actions.js"></script>

    <script src="js/book/events.js"></script>

    <script src="js/book/main.js"></script>

</body>

</html>
