<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>全书</title>


<style>

/* ==================================================
   基础
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #ffffff;

    color: #222;

    overflow: hidden;
}


/* ==================================================
   顶部
================================================== */

.top-bar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 56px;

    background: rgba(255,255,255,0.98);

    border-bottom: 1px solid #eeeeee;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 1000;
}

.page-title {

    font-size: 18px;

    font-weight: 600;

    color: #222;
}

.back-button {

    position: absolute;

    left: 16px;

    border: none;

    background: transparent;

    color: #555;

    font-size: 16px;

    padding: 8px 4px;

    cursor: pointer;
}

.back-button:active {

    opacity: 0.5;
}


/* ==================================================
   主区域
================================================== */

.main {

    position: fixed;

    top: 56px;
    left: 0;
    right: 0;
    bottom: 88px;

    overflow-y: auto;

    padding:
        36px 20px 80px;

    -webkit-overflow-scrolling: touch;
}


/* ==================================================
   整体结构
================================================== */

.structure-area {

    width: 100%;

    max-width: 820px;

    margin: 0 auto;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* ==================================================
   书名
================================================== */

.book-node {

    display: flex;

    flex-direction: column;

    align-items: center;

    width: 100%;
}

.book-box {

    min-width: 190px;

    max-width: 90vw;

    min-height: 56px;

    padding: 13px 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 10px;

    /*
       赤
       浅赤底 + 深赤字
    */

    background: #fff1f1;

    border: 1.5px solid #e5a0a0;

    color: #9b2222;

    font-size: 19px;

    font-weight: 650;

    box-shadow:
        0 2px 7px rgba(0,0,0,0.035);

    user-select: none;
}


/* 书名下面的线 */

.book-down-line {

    width: 1.5px;

    height: 34px;

    background: #d7d7d7;
}


/* ==================================================
   结构树
================================================== */

.tree {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* ==================================================
   根节点
================================================== */

.root-node {

    position: relative;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* ==================================================
   每一行
================================================== */

.node-row {

    position: relative;

    width: 100%;

    min-height: 58px;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* ==================================================
   节点框
================================================== */

.node-box {

    min-width: 155px;

    max-width: calc(100vw - 150px);

    min-height: 48px;

    padding: 11px 21px;

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    user-select: none;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.035);
}


/* ==================================================
   赤
   书名
================================================== */

.book-box {

    background: #fff1f1;

    border-color: #e5a0a0;

    color: #9b2222;
}


/* ==================================================
   青
   序
================================================== */

.node-preface {

    background: #eef9f8;

    border: 1.5px solid #8fc9c5;

    color: #176d68;
}


/* ==================================================
   黄
   卷
================================================== */

.node-volume {

    background: #fffbea;

    border: 1.5px solid #dfca70;

    color: #806900;
}


/* ==================================================
   白
   篇

   不能直接使用纯白，
   所以使用非常浅的灰白色。
================================================== */

.node-part {

    background: #fafafa;

    border: 1.5px solid #c9c9c9;

    color: #555555;
}


/* ==================================================
   黑
   章

   不是纯黑底，而是浅灰黑。
================================================== */

.node-chapter {

    background: #f3f3f3;

    border: 1.5px solid #999999;

    color: #202020;
}


/* ==================================================
   右侧操作区域
================================================== */

.node-actions {

    position: absolute;

    left: calc(50% + 100px);

    top: 50%;

    transform: translateY(-50%);

    display: flex;

    align-items: center;

    gap: 6px;

    white-space: nowrap;
}


/* ==================================================
   操作按钮
================================================== */

.action-button {

    height: 32px;

    padding: 0 9px;

    border: 1px solid #e3e3e3;

    border-radius: 7px;

    background: #ffffff;

    color: #666;

    font-size: 13px;

    cursor: pointer;

    box-shadow:
        0 1px 4px rgba(0,0,0,0.04);
}

.action-button:active {

    background: #f5f5f5;
}


/* ==================================================
   垃圾桶
================================================== */

.delete-button {

    width: 32px;

    padding: 0;

    color: #888;

    font-size: 15px;
}


/* ==================================================
   垂直连接线
================================================== */

.vertical-line {

    width: 1.5px;

    height: 28px;

    background: #d5d5d5;
}


/* ==================================================
   子节点
================================================== */

.children {

    position: relative;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* ==================================================
   多个同级节点的横线
================================================== */

.children.has-multiple::before {

    content: "";

    position: absolute;

    top: 0;

    left: 50%;

    width: calc(100% - 70px);

    height: 1.5px;

    background: #d5d5d5;

    transform: translateX(-50%);
}


/* ==================================================
   子节点
================================================== */

.child-node {

    position: relative;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* 子节点顶部连接线 */

.child-node::before {

    content: "";

    width: 1.5px;

    height: 20px;

    background: #d5d5d5;
}


/* ==================================================
   空状态
================================================== */

.empty-hint {

    margin-top: 36px;

    color: #aaa;

    font-size: 14px;

    line-height: 1.9;

    text-align: center;
}


/* ==================================================
   底部固定区域
================================================== */

.bottom-bar {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 88px;

    background: rgba(255,255,255,0.98);

    border-top: 1px solid #eeeeee;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;

    padding:
        12px 16px
        calc(12px + env(safe-area-inset-bottom));

    z-index: 1000;
}


/* ==================================================
   底部添加按钮
================================================== */

.add-button {

    height: 44px;

    min-width: 72px;

    padding: 0 14px;

    border-radius: 9px;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.1s,
        opacity 0.1s;
}

.add-button:active {

    transform: scale(0.96);
}


/* ==================================================
   ＋序
   青
================================================== */

.add-preface {

    background: #eef9f8;

    border: 1.5px solid #8fc9c5;

    color: #176d68;
}


/* ==================================================
   ＋章
   黑
================================================== */

.add-chapter {

    background: #f3f3f3;

    border: 1.5px solid #999999;

    color: #202020;
}


/* ==================================================
   ＋篇
   白
================================================== */

.add-part {

    background: #fafafa;

    border: 1.5px solid #c9c9c9;

    color: #555555;
}


/* ==================================================
   ＋卷
   黄
================================================== */

.add-volume {

    background: #fffbea;

    border: 1.5px solid #dfca70;

    color: #806900;
}


/* ==================================================
   序已经存在
================================================== */

.add-button.disabled {

    opacity: 0.38;

    cursor: not-allowed;
}


/* ==================================================
   手机
================================================== */

@media (max-width: 600px) {

    .main {

        padding-left: 8px;

        padding-right: 8px;
    }


    .book-box {

        min-width: 155px;

        min-height: 52px;

        font-size: 17px;

        padding:
            12px 22px;
    }


    .node-box {

        min-width: 125px;

        max-width: calc(100vw - 125px);

        min-height: 46px;

        padding:
            10px 14px;

        font-size: 14px;
    }


    .node-actions {

        left: calc(50% + 72px);

        gap: 4px;
    }


    .action-button {

        height: 29px;

        padding: 0 6px;

        font-size: 11px;
    }


    .delete-button {

        width: 29px;
    }


    .bottom-bar {

        gap: 6px;

        padding-left: 8px;

        padding-right: 8px;
    }


    .add-button {

        min-width: 0;

        flex: 1;

        padding:
            0 5px;

        font-size: 14px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     顶部
================================================== -->

<header class="top-bar">

    <button
        class="back-button"
        onclick="goBack()">

        ← 返回

    </button>


    <div class="page-title">

        全书

    </div>

</header>



<!-- ==================================================
     主区域
================================================== -->

<main class="main">

    <div class="structure-area">


        <!-- 书名 -->

        <div class="book-node">

            <div
                id="bookTitle"
                class="book-box">

                我的小说

            </div>


            <div
                class="book-down-line">
            </div>

        </div>


        <!-- 目录树 -->

        <div
            id="tree"
            class="tree">
        </div>


    </div>

</main>



<!-- ==================================================
     底部固定添加
================================================== -->

<div class="bottom-bar">


    <button
        id="addPrefaceButton"
        class="add-button add-preface"
        onclick="addRootPreface()">

        ＋序

    </button>


    <button
        class="add-button add-chapter"
        onclick="addRootChapter()">

        ＋章

    </button>


    <button
        class="add-button add-part"
        onclick="addRootPart()">

        ＋篇

    </button>


    <button
        class="add-button add-volume"
        onclick="addRootVolume()">

        ＋卷

    </button>


</div>



<script>

/* ==================================================
   当前书籍
================================================== */

let currentBook = null;


/* ==================================================
   初始化
================================================== */

function init() {

    const currentBookId =
        localStorage.getItem(
            "currentBookId"
        );


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    const books =
        savedBooks
        ? JSON.parse(savedBooks)
        : [];


    currentBook =
        books.find(
            function(book) {

                return String(book.id) ===
                    String(currentBookId);

            }
        );


    if (!currentBook) {

        alert("没有找到这本书。");

        window.location.href =
            "index.html";

        return;
    }


    /*
       如果是以前创建的书，
       没有 structure 就自动建立。
    */

    if (
        !Array.isArray(
            currentBook.structure
        )
    ) {

        currentBook.structure = [];

    }


    document.getElementById(
        "bookTitle"
    ).textContent =
        currentBook.title ||
        "未命名小说";


    renderTree();

    updatePrefaceButton();
}


/* ==================================================
   返回
================================================== */

function goBack() {

    window.location.href =
        "index.html";
}


/* ==================================================
   创建 ID
================================================== */

function createId() {

    return Date.now() +
        Math.floor(
            Math.random() * 100000
        );
}


/* ==================================================
   创建节点
================================================== */

function createNode(
    type,
    name
) {

    return {

        id: createId(),

        type: type,

        name: name,

        children: []

    };

}


/* ==================================================
   根目录：序
================================================== */

function addRootPreface() {

    if (!currentBook) return;


    const exists =
        currentBook.structure.some(
            function(item) {

                return item.type === "序";

            }
        );


    if (exists) return;


    currentBook.structure.push(

        createNode(
            "序",
            "序章："
        )

    );


    saveBook();

    renderTree();

    updatePrefaceButton();
}


/* ==================================================
   根目录：章
================================================== */

function addRootChapter() {

    addRootNode(

        "章",

        getNextRootNumber("章")
        + "章："

    );

}


/* ==================================================
   根目录：篇
================================================== */

function addRootPart() {

    addRootNode(

        "篇",

        getNextRootNumber("篇")
        + "篇："

    );

}


/* ==================================================
   根目录：卷
================================================== */

function addRootVolume() {

    addRootNode(

        "卷",

        getNextRootNumber("卷")
        + "卷："

    );

}


/* ==================================================
   添加根节点
================================================== */

function addRootNode(
    type,
    name
) {

    currentBook.structure.push(

        createNode(
            type,
            name
        )

    );


    saveBook();

    renderTree();
}


/* ==================================================
   根节点编号
================================================== */

function getNextRootNumber(type) {

    let count = 0;


    currentBook.structure.forEach(
        function(item) {

            if (
                item.type === type
            ) {

                count++;

            }

        }
    );


    return "第" +
        (count + 1);

}


/* ==================================================
   子节点编号
================================================== */

function getNextNumberFromArray(
    array,
    type
) {

    let count = 0;


    array.forEach(
        function(item) {

            if (
                item.type === type
            ) {

                count++;

            }

        }
    );


    return "第" +
        (count + 1);

}


/* ==================================================
   渲染整个树
================================================== */

function renderTree() {

    const tree =
        document.getElementById(
            "tree"
        );


    tree.innerHTML = "";


    if (
        !currentBook.structure ||
        currentBook.structure.length === 0
    ) {

        const hint =
            document.createElement(
                "div"
            );


        hint.className =
            "empty-hint";


        hint.innerHTML =
            "从下面选择一种结构开始建立全书目录";


        tree.appendChild(
            hint
        );


        return;
    }


    currentBook.structure.forEach(
        function(node) {

            tree.appendChild(
                renderNode(
                    node,
                    true
                )
            );

        }
    );

}


/* ==================================================
   渲染节点
================================================== */

function renderNode(
    node,
    isRoot
) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        isRoot
        ? "root-node"
        : "child-node";


    /*
       非根节点顶部连接线
    */

    if (!isRoot) {

        const line =
            document.createElement(
                "div"
            );


        line.className =
            "vertical-line";


        wrapper.appendChild(
            line
        );

    }


    /*
       行
    */

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "node-row";


    /*
       节点框
    */

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "node-box " +
        getNodeClass(
            node.type
        );


    box.textContent =
        node.name;


    box.onclick =
        function() {

            openNode(node);

        };


    row.appendChild(
        box
    );


    /*
       右侧操作
    */

    const actions =
        document.createElement(
            "div"
        );


    actions.className =
        "node-actions";


    /*
       垃圾桶
    */

    const deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "action-button delete-button";


    deleteButton.textContent =
        "🗑";


    deleteButton.onclick =
        function(event) {

            event.stopPropagation();

            deleteNode(
                node.id
            );

        };


    actions.appendChild(
        deleteButton
    );


    /*
       卷
       🗑 ＋同级 ＋篇 ＋章
    */

    if (
        node.type === "卷"
    ) {

        actions.appendChild(

            createActionButton(
                "＋同级",

                function(event) {

                    event.stopPropagation();

                    addSameLevel(
                        node,
                        "卷"
                    );

                }
            )

        );


        actions.appendChild(

            createActionButton(
                "＋篇",

                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "篇"
                    );

                }
            )

        );


        actions.appendChild(

            createActionButton(
                "＋章",

                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "章"
                    );

                }
            )

        );

    }


    /*
       篇
       🗑 ＋同级 ＋章
    */

    if (
        node.type === "篇"
    ) {

        actions.appendChild(

            createActionButton(
                "＋同级",

                function(event) {

                    event.stopPropagation();

                    addSameLevel(
                        node,
                        "篇"
                    );

                }
            )

        );


        actions.appendChild(

            createActionButton(
                "＋章",

                function(event) {

                    event.stopPropagation();

                    addChild(
                        node,
                        "章"
                    );

                }
            )

        );

    }


    /*
       序：
       只有垃圾桶

       章：
       只有垃圾桶
    */


    row.appendChild(
        actions
    );


    wrapper.appendChild(
        row
    );


    /*
       子节点
    */

    if (
        node.children &&
        node.children.length > 0
    ) {

        const children =
            document.createElement(
                "div"
            );


        children.className =
            "children";


        if (
            node.children.length > 1
        ) {

            children.classList.add(
                "has-multiple"
            );

        }


        node.children.forEach(
            function(child) {

                children.appendChild(

                    renderNode(
                        child,
                        false
                    )

                );

            }
        );


        wrapper.appendChild(
            children
        );

    }


    return wrapper;
}


/* ==================================================
   获取节点颜色
================================================== */

function getNodeClass(type) {

    switch (type) {

        case "序":

            return "node-preface";


        case "卷":

            return "node-volume";


        case "篇":

            return "node-part";


        case "章":

            return "node-chapter";


        default:

            return "node-chapter";

    }

}


/* ==================================================
   创建操作按钮
================================================== */

function createActionButton(
    text,
    callback
) {

    const button =
        document.createElement(
            "button"
        );


    button.className =
        "action-button";


    button.textContent =
        text;


    button.onclick =
        callback;


    return button;
}


/* ==================================================
   添加同级
================================================== */

function addSameLevel(
    node,
    type
) {

    const result =
        findParentArray(
            currentBook.structure,
            node.id
        );


    if (!result) return;


    const newNode =
        createNode(

            type,

            getNextNumberFromArray(
                result.array,
                type
            )
            + type
            + "："

        );


    const index =
        result.array.findIndex(
            function(item) {

                return item.id ===
                    node.id;

            }
        );


    result.array.splice(

        index + 1,

        0,

        newNode

    );


    saveBook();

    renderTree();
}


/* ==================================================
   添加下级
================================================== */

function addChild(
    parent,
    type
) {

    if (
        !Array.isArray(
            parent.children
        )
    ) {

        parent.children = [];

    }


    const number =
        getNextNumberFromArray(
            parent.children,
            type
        );


    parent.children.push(

        createNode(

            type,

            number +
            type +
            "："

        )

    );


    saveBook();

    renderTree();
}


/* ==================================================
   查找节点所在数组
================================================== */

function findParentArray(
    array,
    id
) {

    for (
        let i = 0;
        i < array.length;
        i++
    ) {

        if (
            array[i].id === id
        ) {

            return {

                array: array,

                node: array[i]

            };

        }


        if (
            array[i].children &&
            array[i].children.length
        ) {

            const result =
                findParentArray(

                    array[i].children,

                    id

                );


            if (result) {

                return result;

            }

        }

    }


    return null;
}


/* ==================================================
   删除
================================================== */

function deleteNode(id) {

    const result =
        findParentArray(

            currentBook.structure,

            id

        );


    if (!result) return;


    const node =
        result.node;


    let message =
        "确定删除「" +
        node.name +
        "」吗？";


    if (
        node.children &&
        node.children.length > 0
    ) {

        message +=
            "\n\n此结构下面还有 " +
            node.children.length +
            " 个直接下级结构，它们也会一起删除。";

    }


    if (
        !confirm(message)
    ) {

        return;

    }


    const index =
        result.array.findIndex(
            function(item) {

                return item.id === id;

            }
        );


    if (
        index !== -1
    ) {

        result.array.splice(
            index,
            1
        );

    }


    saveBook();

    renderTree();

    updatePrefaceButton();
}


/* ==================================================
   点击节点
================================================== */

function openNode(node) {

    localStorage.setItem(
        "currentNodeId",
        node.id
    );


    /*
       以后这里连接正文编辑器：

       editor.html
    */

}


/* ==================================================
   序按钮状态
================================================== */

function updatePrefaceButton() {

    const button =
        document.getElementById(
            "addPrefaceButton"
        );


    if (!currentBook) return;


    const exists =
        currentBook.structure.some(
            function(item) {

                return item.type ===
                    "序";

            }
        );


    if (exists) {

        button.classList.add(
            "disabled"
        );


        button.textContent =
            "序 ✓";


        button.onclick =
            function() {};


    } else {

        button.classList.remove(
            "disabled"
        );


        button.textContent =
            "＋序";


        button.onclick =
            addRootPreface;

    }

}


/* ==================================================
   保存
================================================== */

function saveBook() {

    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    const books =
        savedBooks
        ? JSON.parse(savedBooks)
        : [];


    const index =
        books.findIndex(
            function(book) {

                return String(book.id) ===
                    String(currentBook.id);

            }
        );


    if (
        index !== -1
    ) {

        books[index] =
            currentBook;


        localStorage.setItem(

            "novelBooks",

            JSON.stringify(
                books
            )

        );

    }

}


/* ==================================================
   启动
================================================== */

init();

</script>
