<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>全书</title>

    <link
        rel="stylesheet"
        href="css/book.css"
    >
</head>


<body>

    <!-- ==========================
         顶部栏
    =========================== -->

    <header class="top-bar">

        <!-- 返回 -->

        <button
            id="backButton"
            class="back-button"
            type="button"
        >
            ← 返回
        </button>


        <!-- 页面标题 -->

        <div class="page-title">
            全书
        </div>


        <!-- ======================
             布局切换
        ======================= -->

        <button
            id="layoutToggle"
            class="layout-toggle"
            type="button"
            aria-label="切换布局方向"
        >
            ↕ 纵向
        </button>

    </header>



    <!-- ==========================
         全书画布
    =========================== -->

    <main class="tree-canvas">

        <!--
            SVG：

            用来绘制：

            书名
              ↓
            序 / 卷 / 篇 / 章

            以及：

            + / −
            对应的连接线
        -->

        <svg
            id="connections"
            class="connections"
        ></svg>



        <!-- ======================
             书名
        ======================= -->

        <div
            id="bookTitle"
            class="book-title"
        >
            未命名书籍
        </div>



        <!-- ======================
             树结构
        ======================= -->

        <div
            id="tree"
            class="tree"
        ></div>



        <!-- ======================
             底部操作栏
             
             注意：

             这里不再预先写
             ＋序
             ＋章
             ＋篇
             ＋卷

             events.js 会根据
             当前选择动态生成。
        ======================= -->

        <div
            id="bookActions"
            class="book-actions"
            style="display: none;"
        ></div>

    </main>



    <!-- ==========================
         JavaScript

         顺序不能改变
    =========================== -->

    <script src="js/book/state.js"></script>

    <script src="js/book/storage.js"></script>

    <script src="js/book/nodes.js"></script>

    <script src="js/book/layout.js"></script>

    <script src="js/book/connections.js"></script>

    <script src="js/book/actions.js"></script>

    <script src="js/book/events.js"></script>

    <script src="js/book/main.js"></script>

</body>

</html>
