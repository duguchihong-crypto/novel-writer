<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>正文</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            background: #f5f6f8;

            color: #222;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;
        }


        .top-bar {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 60px;

            background: #fff;

            border-bottom:
                1px solid #e5e5e5;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 18px;

            z-index: 1000;
        }


        .back-button {

            border: none;

            background: none;

            font-size: 15px;

            color: #555;

            cursor: pointer;
        }


        .chapter-title {

            position: absolute;

            left: 50%;

            transform:
                translateX(-50%);

            font-size: 17px;

            font-weight: 600;

            white-space: nowrap;
        }


        .save-status {

            font-size: 13px;

            color: #999;
        }


        .editor-page {

            padding-top: 60px;

            min-height: 100vh;
        }


        .editor {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            padding:
                45px 24px 120px;
        }


        .chapter-name {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 30px;
        }


        .content {

            width: 100%;

            min-height: 70vh;

            border: none;

            outline: none;

            resize: none;

            background: transparent;

            font-family: inherit;

            font-size: 18px;

            line-height: 2;
        }


        @media (max-width: 600px) {

            .editor {

                padding:
                    35px 20px 100px;
            }


            .chapter-name {

                font-size: 26px;
            }


            .content {

                font-size: 17px;

                line-height: 1.9;
            }
        }

    </style>

</head>


<body>


<header class="top-bar">


    <button
        id="backButton"
        class="back-button"
        type="button"
    >
        ← 全书
    </button>


    <div
        id="chapterTitle"
        class="chapter-title"
    >
        正文
    </div>


    <div
        id="saveStatus"
        class="save-status"
    >
        已保存
    </div>


</header>


<main class="editor-page">

    <div class="editor">


        <input
            id="chapterName"
            class="chapter-name"
            type="text"
            placeholder="章节标题"
        >


        <textarea
            id="content"
            class="content"
            placeholder="开始写作……"
        ></textarea>


    </div>

</main>


<script>

// ==================================================
// 当前小说
// ==================================================

let currentBook = null;


// 当前章节

let currentChapter = null;


// ==================================================
// 找节点
// ==================================================

function findNode(
    nodes,
    nodeId
) {

    if (
        !Array.isArray(nodes)
    ) {

        return null;
    }


    for (
        const node of nodes
    ) {

        if (
            String(node.id) ===
            String(nodeId)
        ) {

            return node;
        }


        const result =
            findNode(
                node.children,
                nodeId
            );


        if (result) {

            return result;
        }
    }


    return null;
}


// ==================================================
// 读取小说
// ==================================================

function loadBook() {

    const bookId =
        localStorage.getItem(
            "currentBookId"
        );


    const chapterId =
        localStorage.getItem(
            "currentChapterId"
        );


    if (
        !bookId ||
        !chapterId
    ) {

        return false;
    }


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    if (!savedBooks) {

        return false;
    }


    try {

        const books =
            JSON.parse(
                savedBooks
            );


        if (
            !Array.isArray(books)
        ) {

            return false;
        }


        currentBook =
            books.find(
                book =>
                    String(book.id) ===
                    String(bookId)
            );


        if (!currentBook) {

            return false;
        }


        if (
            !Array.isArray(
                currentBook.structure
            )
        ) {

            currentBook.structure =
                [];
        }


        currentChapter =
            findNode(
                currentBook.structure,
                chapterId
            );


        if (!currentChapter) {

            return false;
        }


        return true;

    } catch (error) {

        console.error(
            "读取小说失败：",
            error
        );

        return false;
    }
}


// ==================================================
// 初始化
// ==================================================

function init() {

    const success =
        loadBook();


    if (!success) {

        console.warn(
            "没有找到当前章节"
        );

        return;
    }


    // ------------------------------
    // 标题
    // ------------------------------

    const title =
        currentChapter.title ||
        "未命名章节";


    document.title =
        title;


    document.querySelector(
        "#chapterTitle"
    ).textContent =
        title;


    document.querySelector(
        "#chapterName"
    ).value =
        title;


    // ------------------------------
    // 正文
    // ------------------------------

    document.querySelector(
        "#content"
    ).value =
        currentChapter.content ||
        "";
}


// ==================================================
// 保存
// ==================================================

function saveChapter() {

    if (
        !currentBook ||
        !currentChapter
    ) {

        return;
    }


    currentChapter.title =
        document.querySelector(
            "#chapterName"
        ).value;


    currentChapter.content =
        document.querySelector(
            "#content"
        ).value;


    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    let books = [];


    try {

        books =
            JSON.parse(
                savedBooks || "[]"
            );

    } catch (error) {

        books = [];
    }


    const index =
        books.findIndex(
            book =>
                String(book.id) ===
                String(currentBook.id)
        );


    if (index === -1) {

        return;
    }


    books[index] =
        currentBook;


    localStorage.setItem(
        "novelBooks",
        JSON.stringify(
            books
        )
    );


    document.querySelector(
        "#saveStatus"
    ).textContent =
        "已保存";
}


// ==================================================
// 自动保存
// ==================================================

let saveTimer = null;


function scheduleSave() {

    document.querySelector(
        "#saveStatus"
    ).textContent =
        "正在保存…";


    clearTimeout(
        saveTimer
    );


    saveTimer =
        setTimeout(
            saveChapter,
            500
        );
}


document.querySelector(
    "#chapterName"
).addEventListener(
    "input",
    scheduleSave
);


document.querySelector(
    "#content"
).addEventListener(
    "input",
    scheduleSave
);


// ==================================================
// 返回全书
// ==================================================

document.querySelector(
    "#backButton"
).addEventListener(
    "click",
    function() {

        saveChapter();

        window.location.href =
            "./book.html";
    }
);


// ==================================================
// 开始
// ==================================================

init();

</script>


</body>

</html>
