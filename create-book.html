<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>新建小说</title>


<style>

/* ==================================================
   基础
================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {
    min-height: 100%;
}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    background: #f7f8fa;

    color: #222;

    min-height: 100vh;
}


/* ==================================================
   顶部
================================================== */

.top-bar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 64px;

    background: #fff;

    border-bottom:
        1px solid #e8e8e8;

    display: flex;

    align-items: center;

    padding:
        0 20px;

    z-index: 100;
}


.back-button {

    border: none;

    background: none;

    color: #555;

    font-family: inherit;

    font-size: 15px;

    cursor: pointer;

    padding:
        8px 4px;

    -webkit-tap-highlight-color: transparent;
}


.back-button:active {

    opacity: 0.6;
}


.page-title {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 17px;

    font-weight: 600;

    white-space: nowrap;
}


/* ==================================================
   页面
================================================== */

.page {

    min-height: 100vh;

    padding:
        104px 20px 50px;
}


.create-container {

    width: 100%;

    max-width: 560px;

    margin: 0 auto;
}


/* ==================================================
   标题
================================================== */

.main-title {

    font-size: 28px;

    font-weight: 700;

    margin-bottom: 8px;
}


.sub-title {

    font-size: 14px;

    color: #888;

    margin-bottom: 32px;

    line-height: 1.6;
}


/* ==================================================
   表单区域
================================================== */

.form-section {

    background: #fff;

    border:
        1px solid #e7e8eb;

    border-radius: 14px;

    padding: 22px;

    margin-bottom: 18px;
}


.form-label {

    display: block;

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 10px;
}


.required {

    color: #e5484d;

    margin-left: 3px;
}


/* ==================================================
   书名
================================================== */

.title-input {

    width: 100%;

    height: 48px;

    border:
        1px solid #dfe2e7;

    border-radius: 9px;

    padding:
        0 14px;

    outline: none;

    font-family: inherit;

    font-size: 16px;

    color: #222;

    background: #fff;

    transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
}


.title-input:focus {

    border-color: #4f7cff;

    box-shadow:
        0 0 0 3px
        rgba(79,124,255,0.10);
}


.title-input::placeholder {

    color: #aaa;
}


/* ==================================================
   封面
================================================== */

.cover-section {

    display: flex;

    flex-direction: column;

    align-items: center;
}


.cover-section .form-label {

    width: 100%;
}


.cover-preview {

    width: 180px;

    height: 240px;

    border-radius: 10px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #eef1f5,
            #dfe4eb
        );

    border:
        1px solid #e0e3e8;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 18px;

    position: relative;
}


.cover-preview img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


.cover-placeholder {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #a5acb6;

    text-align: center;

    padding: 20px;
}


.cover-placeholder-icon {

    font-size: 42px;

    margin-bottom: 10px;
}


.cover-placeholder-text {

    font-size: 14px;
}


/* ==================================================
   上传按钮
================================================== */

.cover-upload-button {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 150px;

    height: 44px;

    padding:
        0 18px;

    border: none;

    border-radius: 9px;

    background: #eef0f4;

    color: #333;

    font-family: inherit;

    font-size: 14px;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}


.cover-upload-button:hover {

    background: #e5e8ed;
}


.cover-upload-button:active {

    transform:
        scale(0.98);
}


#coverInput {

    display: none;
}


/* ==================================================
   删除封面
================================================== */

.remove-cover-button {

    margin-top: 10px;

    border: none;

    background: none;

    color: #999;

    font-family: inherit;

    font-size: 13px;

    cursor: pointer;

    display: none;
}


.remove-cover-button:hover {

    color: #e5484d;
}


/* ==================================================
   提示
================================================== */

.cover-hint {

    margin-top: 12px;

    font-size: 12px;

    color: #999;

    text-align: center;

    line-height: 1.5;
}


/* ==================================================
   错误
================================================== */

.error-message {

    min-height: 20px;

    margin:
        10px 0 14px;

    color: #e5484d;

    font-size: 13px;

    text-align: center;

    line-height: 1.5;
}


/* ==================================================
   创建按钮
================================================== */

.create-submit {

    width: 100%;

    height: 50px;

    border: none;

    border-radius: 10px;

    background: #4f7cff;

    color: #fff;

    font-family: inherit;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.15s ease,
        transform 0.15s ease;

    -webkit-tap-highlight-color: transparent;
}


.create-submit:hover {

    background: #3d68e6;
}


.create-submit:active {

    transform:
        scale(0.98);
}


.create-submit:disabled {

    background: #aeb8d2;

    cursor: not-allowed;

    transform: none;
}


/* ==================================================
   手机
================================================== */

@media (max-width: 600px) {

    .top-bar {

        padding:
            0 14px;
    }


    .page {

        padding:
            94px 14px 35px;
    }


    .main-title {

        font-size: 25px;
    }


    .form-section {

        padding: 18px;

        border-radius: 12px;
    }


    .cover-preview {

        width: 160px;

        height: 214px;
    }

}

</style>

</head>


<body>


<header class="top-bar">

    <button
        id="backButton"
        class="back-button"
        type="button"
    >
        ← 返回
    </button>


    <div class="page-title">
        新建小说
    </div>

</header>


<main class="page">

    <div class="create-container">


        <h1 class="main-title">
            新建小说
        </h1>


        <p class="sub-title">
            创建一本新的小说，开始你的创作。
        </p>


        <section class="form-section">

            <label
                class="form-label"
                for="bookTitle"
            >
                小说名称
                <span class="required">*</span>
            </label>


            <input
                id="bookTitle"
                class="title-input"
                type="text"
                maxlength="100"
                placeholder="请输入小说名称"
                autocomplete="off"
            >

        </section>


        <section
            class="form-section cover-section"
        >

            <label class="form-label">
                小说封面
            </label>


            <div
                id="coverPreview"
                class="cover-preview"
            >

                <div
                    id="coverPlaceholder"
                    class="cover-placeholder"
                >

                    <div
                        class="cover-placeholder-icon"
                    >
                        🖼️
                    </div>


                    <div
                        class="cover-placeholder-text"
                    >
                        暂无封面
                    </div>

                </div>


                <img
                    id="coverImage"
                    src=""
                    alt="封面预览"
                    style="display:none;"
                >

            </div>


            <input
                id="coverInput"
                type="file"
                accept="image/*"
            >


            <label
                for="coverInput"
                class="cover-upload-button"
            >
                🖼️ 选择封面
            </label>


            <button
                id="removeCoverButton"
                class="remove-cover-button"
                type="button"
            >
                删除封面
            </button>


            <div class="cover-hint">

                支持手机中的图片。
                <br>

                建议使用竖版封面。
                <br>

                封面会自动压缩后保存。

            </div>

        </section>


        <div
            id="errorMessage"
            class="error-message"
            aria-live="polite"
        ></div>


        <button
            id="createButton"
            class="create-submit"
            type="button"
        >
            创建小说
        </button>

    </div>

</main>


<script>

/* ==================================================
   DOM
================================================== */

const bookTitleInput =
    document.getElementById("bookTitle");


const coverInput =
    document.getElementById("coverInput");


const coverImage =
    document.getElementById("coverImage");


const coverPlaceholder =
    document.getElementById("coverPlaceholder");


const removeCoverButton =
    document.getElementById("removeCoverButton");


const createButton =
    document.getElementById("createButton");


const errorMessage =
    document.getElementById("errorMessage");


let selectedCover = "";


/* ==================================================
   错误
================================================== */

function showError(message) {

    errorMessage.textContent =
        message;

}


function clearError() {

    errorMessage.textContent =
        "";

}


/* ==================================================
   恢复按钮
================================================== */

function resetCreateButton() {

    createButton.disabled =
        false;

    createButton.textContent =
        "创建小说";

}


/* ==================================================
   返回书架
================================================== */

document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function() {

            /*
             * 返回书架前清除当前打开状态
             */

            try {

                localStorage.removeItem(
                    "currentBookId"
                );

                localStorage.removeItem(
                    "currentChapterId"
                );

            } catch (error) {

                console.error(
                    "清除当前小说状态失败：",
                    error
                );

            }


            window.location.href =
                "index.html";

        }
    );


/* ==================================================
   选择封面
================================================== */

coverInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files &&
            event.target.files[0];


        if (!file) {

            return;

        }


        if (
            !file.type ||
            !file.type.startsWith("image/")
        ) {

            showError(
                "请选择图片文件。"
            );

            coverInput.value = "";

            return;

        }


        clearError();


        createButton.disabled =
            true;

        createButton.textContent =
            "正在处理封面…";


        const reader =
            new FileReader();


        reader.onload =
            function() {

                const result =
                    reader.result;


                if (
                    typeof result !==
                    "string"
                ) {

                    showError(
                        "读取封面失败。"
                    );

                    resetCreateButton();

                    return;

                }


                compressImage(
                    result,
                    function(compressed) {

                        if (
                            !compressed ||
                            typeof compressed !==
                            "string"
                        ) {

                            showError(
                                "封面压缩失败，请换一张图片。"
                            );

                            resetCreateButton();

                            return;

                        }


                        selectedCover =
                            compressed;


                        showCover(
                            compressed
                        );


                        clearError();


                        resetCreateButton();

                    }
                );

            };


        reader.onerror =
            function() {

                showError(
                    "读取封面失败，请重新选择图片。"
                );

                resetCreateButton();

            };


        reader.readAsDataURL(file);

    }
);


/* ==================================================
   显示封面
================================================== */

function showCover(dataURL) {

    coverImage.src =
        dataURL;


    coverImage.style.display =
        "block";


    coverPlaceholder.style.display =
        "none";


    removeCoverButton.style.display =
        "block";

}


/* ==================================================
   删除封面
================================================== */

removeCoverButton.addEventListener(
    "click",
    function() {

        selectedCover =
            "";

        coverInput.value =
            "";

        coverImage.src =
            "";

        coverImage.style.display =
            "none";

        coverPlaceholder.style.display =
            "flex";

        removeCoverButton.style.display =
            "none";

        clearError();

    }
);


/* ==================================================
   图片压缩
================================================== */

function compressImage(
    dataURL,
    callback
) {

    const image =
        new Image();


    image.onload =
        function() {

            let width =
                image.naturalWidth ||
                image.width;


            let height =
                image.naturalHeight ||
                image.height;


            if (
                !width ||
                !height
            ) {

                callback("");

                return;

            }


            const maxSize =
                700;


            if (
                width > maxSize ||
                height > maxSize
            ) {

                if (
                    width >= height
                ) {

                    height =
                        Math.max(
                            1,
                            Math.round(
                                height *
                                maxSize /
                                width
                            )
                        );

                    width =
                        maxSize;

                } else {

                    width =
                        Math.max(
                            1,
                            Math.round(
                                width *
                                maxSize /
                                height
                            )
                        );

                    height =
                        maxSize;

                }

            }


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                width;

            canvas.height =
                height;


            const context =
                canvas.getContext(
                    "2d"
                );


            if (!context) {

                callback("");

                return;

            }


            context.fillStyle =
                "#ffffff";


            context.fillRect(
                0,
                0,
                width,
                height
            );


            context.drawImage(
                image,
                0,
                0,
                width,
                height
            );


            let compressed =
                canvas.toDataURL(
                    "image/jpeg",
                    0.65
                );


            const maxCharacters =
                300000;


            if (
                compressed.length >
                maxCharacters
            ) {

                compressed =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.50
                    );

            }


            if (
                compressed.length >
                maxCharacters
            ) {

                compressed =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.35
                    );

            }


            if (
                compressed.length >
                maxCharacters
            ) {

                let smallWidth =
                    width;

                let smallHeight =
                    height;


                if (
                    smallWidth >=
                    smallHeight
                ) {

                    smallHeight =
                        Math.max(
                            1,
                            Math.round(
                                smallHeight *
                                500 /
                                smallWidth
                            )
                        );

                    smallWidth =
                        500;

                } else {

                    smallWidth =
                        Math.max(
                            1,
                            Math.round(
                                smallWidth *
                                500 /
                                smallHeight
                            )
                        );

                    smallHeight =
                        500;

                }


                canvas.width =
                    smallWidth;

                canvas.height =
                    smallHeight;


                context.fillStyle =
                    "#ffffff";


                context.fillRect(
                    0,
                    0,
                    smallWidth,
                    smallHeight
                );


                context.drawImage(
                    image,
                    0,
                    0,
                    smallWidth,
                    smallHeight
                );


                compressed =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.45
                    );

            }


            if (
                compressed.length >
                maxCharacters
            ) {

                compressed =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.30
                    );

            }


            callback(
                compressed
            );

        };


    image.onerror =
        function() {

            callback("");

        };


    image.src =
        dataURL;

}


/* ==================================================
   读取小说
================================================== */

function loadBooks() {

    const savedBooks =
        localStorage.getItem(
            "novelBooks"
        );


    if (!savedBooks) {

        return [];

    }


    try {

        const parsed =
            JSON.parse(
                savedBooks
            );


        if (
            Array.isArray(parsed)
        ) {

            return parsed;

        }


        return [];

    } catch (error) {

        console.error(
            "novelBooks 数据损坏：",
            error
        );


        try {

            localStorage.setItem(
                "novelBooks_backup_" +
                Date.now(),
                savedBooks
            );

        } catch (backupError) {

            console.error(
                "备份损坏数据失败：",
                backupError
            );

        }


        return [];

    }

}


/* ==================================================
   创建 ID
================================================== */

function createBookId() {

    return (
        "book_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 10)
    );

}


/* ==================================================
   检查 localStorage
================================================== */

function checkStorage() {

    try {

        const testKey =
            "__novel_storage_test__";


        localStorage.setItem(
            testKey,
            "1"
        );


        localStorage.removeItem(
            testKey
        );


        return true;

    } catch (error) {

        console.error(
            "localStorage 不可用：",
            error
        );


        return false;

    }

}


/* ==================================================
   保存小说
================================================== */

function saveBooks(books) {

    const serialized =
        JSON.stringify(
            books
        );


    try {

        localStorage.setItem(
            "novelBooks",
            serialized
        );


        return {
            success: true
        };

    } catch (error) {

        console.error(
            "保存小说失败：",
            error
        );


        return {
            success: false,
            error: error
        };

    }

}


/* ==================================================
   封面过大时不保存封面
================================================== */

function trySaveWithoutCover(
    books,
    newBookId
) {

    const copy =
        books.map(
            function(book) {

                if (
                    book &&
                    book.id ===
                    newBookId
                ) {

                    return {
                        ...book,
                        cover: ""
                    };

                }


                return book;

            }
        );


    const result =
        saveBooks(copy);


    return {
        result: result,
        books: copy
    };

}


/* ==================================================
   创建小说
================================================== */

function createBook() {

    if (
        createButton.disabled
    ) {

        return;

    }


    const title =
        bookTitleInput.value.trim();


    if (!title) {

        showError(
            "请输入小说名称。"
        );

        bookTitleInput.focus();

        return;

    }


    if (!checkStorage()) {

        showError(
            "当前浏览器无法使用本地储存，无法创建小说。"
        );

        return;

    }


    clearError();


    createButton.disabled =
        true;

    createButton.textContent =
        "正在创建…";


    const books =
        loadBooks();


    const bookId =
        createBookId();


    const newBook = {

        id:
            bookId,

        title:
            title,

        cover:
            selectedCover || "",

        structure:
            [],

        layoutDirection:
            "vertical",

        bookPosition: {

            x: null,

            y: null

        }

    };


    books.push(
        newBook
    );


    let saveResult =
        saveBooks(
            books
        );


    if (
        !saveResult.success &&
        selectedCover
    ) {

        const fallback =
            trySaveWithoutCover(
                books,
                bookId
            );


        if (
            fallback.result.success
        ) {

            saveResult =
                fallback.result;

        }

    }


    if (
        !saveResult.success
    ) {

        const error =
            saveResult.error;


        if (
            error &&
            (
                error.name ===
                "QuotaExceededError" ||

                error.code ===
                22 ||

                error.code ===
                1014
            )
        ) {

            showError(
                "储存空间不足。请删除一些旧小说或封面后再创建。"
            );

        } else {

            showError(
                "小说保存失败，请重新尝试。"
            );

        }


        resetCreateButton();

        return;

    }


    /* ==================================================
       关键：
       创建小说后绝不设置 currentBookId
    ================================================== */

    try {

        localStorage.removeItem(
            "currentBookId"
        );

        localStorage.removeItem(
            "currentChapterId"
        );

    } catch (error) {

        console.error(
            "清除当前小说状态失败：",
            error
        );

    }


    createButton.textContent =
        "创建成功";


    /* ==================================================
       只返回书架
    ================================================== */

    setTimeout(
        function() {

            window.location.href =
                "index.html";

        },
        100
    );

}


/* ==================================================
   创建按钮
================================================== */

createButton.addEventListener(
    "click",
    createBook
);


/* ==================================================
   回车创建
================================================== */

bookTitleInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            createBook();

        }

    }
);


/* ==================================================
   输入书名时清除错误
================================================== */

bookTitleInput.addEventListener(
    "input",
    function() {

        clearError();

    }
);


/* ==================================================
   初始化
================================================== */

bookTitleInput.focus();

</script>


</body>

</html>
