<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>小说家</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background: #f5f5f7;
    color: #222;
}

body {
    overflow: hidden;
}

/* =========================
   整体 APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   顶部
========================= */

.topbar {
    height: 58px;
    flex-shrink: 0;
    background: #ffffff;
    border-bottom: 1px solid #e8e8e8;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    position: relative;
    z-index: 20;
}

.topbar-title {
    font-size: 23px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.more-button {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    border-radius: 50%;

    font-size: 25px;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: center;
}

.more-button:active {
    background: #eeeeee;
}

/* =========================
   主内容
========================= */

.content {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 100px;
}

/* 分组标题 */

.group-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin: 6px 2px 14px;
}

.group-name {
    font-size: 18px;
    font-weight: 700;
}

.group-count {
    font-size: 13px;
    color: #999;
}

/* =========================
   网格书架
========================= */

.book-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px 12px;
}

.book {
    position: relative;
    user-select: none;
    cursor: pointer;
}

.book-cover {
    width: 100%;
    aspect-ratio: 0.70;

    border-radius: 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 10px;

    text-align: center;

    color: white;

    font-size: 16px;
    font-weight: 700;

    box-shadow:
        0 2px 6px rgba(0,0,0,.12);

    overflow: hidden;
}

.cover1 {
    background: linear-gradient(
        145deg,
        #5967d9,
        #3949ab
    );
}

.cover2 {
    background: linear-gradient(
        145deg,
        #d66b7d,
        #a72f49
    );
}

.cover3 {
    background: linear-gradient(
        145deg,
        #54a97a,
        #247451
    );
}

.cover4 {
    background: linear-gradient(
        145deg,
        #d69a4b,
        #a8601b
    );
}

.cover5 {
    background: linear-gradient(
        145deg,
        #7562aa,
        #40326f
    );
}

.cover6 {
    background: linear-gradient(
        145deg,
        #5d9eaf,
        #286274
    );
}

.book-name {
    margin-top: 7px;

    font-size: 14px;
    line-height: 20px;

    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.book-author {
    margin-top: 2px;

    color: #999;
    font-size: 12px;
}

/* =========================
   空书架
========================= */

.empty {
    text-align: center;
    color: #999;
    padding: 100px 20px;
}

.empty-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.empty-text {
    font-size: 15px;
}

/* =========================
   底部导航
========================= */

.bottom-nav {
    height: 72px;
    flex-shrink: 0;

    background: #ffffff;

    border-top: 1px solid #e5e5e5;

    display: flex;

    position: relative;
    z-index: 20;

    padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
    flex: 1;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: #888;

    font-size: 12px;

    gap: 4px;

    cursor: pointer;
}

.nav-icon {
    font-size: 22px;
    line-height: 22px;
}

.nav-item.active {
    color: #222;
    font-weight: 600;
}

/* =========================
   更多菜单
========================= */

.menu-overlay {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.18);

    z-index: 50;

    display: none;
}

.menu-overlay.show {
    display: block;
}

.more-menu {
    position: absolute;

    top: 56px;
    right: 12px;

    width: 210px;

    background: white;

    border-radius: 12px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.18);

    overflow: hidden;
}

.menu-section {
    padding: 7px 0;
}

.menu-item {
    height: 48px;

    padding: 0 17px;

    display: flex;
    align-items: center;

    font-size: 15px;

    cursor: pointer;
}

.menu-item:active {
    background: #f1f1f1;
}

.menu-icon {
    width: 30px;
    font-size: 19px;
}

.menu-divider {
    height: 1px;
    background: #eeeeee;
}

/* =========================
   设置页面
========================= */

.page {
    position: fixed;

    inset: 0;

    background: #f5f5f7;

    z-index: 100;

    display: none;

    flex-direction: column;
}

.page.show {
    display: flex;
}

.page-header {
    height: 58px;

    background: white;

    display: flex;
    align-items: center;

    border-bottom: 1px solid #e5e5e5;

    padding: 0 16px;
}

.back {
    width: 40px;
    font-size: 27px;
    cursor: pointer;
}

.page-title {
    font-size: 19px;
    font-weight: 700;
}

.page-body {
    padding: 15px;
    overflow-y: auto;
}

.setting-card {
    background: white;

    border-radius: 12px;

    overflow: hidden;

    margin-bottom: 15px;
}

.setting-title {
    padding: 15px;

    font-size: 14px;
    color: #888;

    background: #fafafa;
}

.setting-row {
    height: 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 15px;

    border-top: 1px solid #eeeeee;

    font-size: 16px;

    cursor: pointer;
}

.setting-row:active {
    background: #f4f4f4;
}

.setting-right {
    color: #888;
    font-size: 14px;
}

/* =========================
   排序模式
========================= */

.sort-mode .book {
    animation: shake .15s infinite alternate;
}

@keyframes shake {
    from {
        transform: rotate(-0.5deg);
    }
    to {
        transform: rotate(0.5deg);
    }
}

.sort-hint {
    position: fixed;

    left: 50%;
    bottom: 90px;

    transform: translateX(-50%);

    background: rgba(0,0,0,.75);

    color: white;

    padding: 9px 16px;

    border-radius: 20px;

    font-size: 13px;

    z-index: 80;

    display: none;
}

.sort-hint.show {
    display: block;
}

/* =========================
   工具页面
========================= */

.tools-page,
.my-page {
    padding: 20px 16px;
}

.tool-card {
    background: white;

    border-radius: 14px;

    padding: 18px;

    margin-bottom: 12px;

    font-size: 16px;
}

.tool-card small {
    display: block;

    margin-top: 5px;

    color: #999;
}
</style>
</head>


<body>

<div class="app">

    <!-- =====================
         顶部
    ====================== -->

    <header class="topbar">

        <div class="topbar-title">
            书架
        </div>

        <button
            class="more-button"
            onclick="openMenu()">
            …
        </button>

    </header>


    <!-- =====================
         内容
    ====================== -->

    <main class="content" id="mainContent">

        <div class="group-title">

            <div class="group-name">
                全部作品
            </div>

            <div class="group-count"
                 id="bookCount">
                6 本
            </div>

        </div>


        <div
            class="book-grid"
            id="bookGrid">


            <div class="book"
                 draggable="true"
                 data-id="1">

                <div class="book-cover cover1">
                    我，野比海皇
                </div>

                <div class="book-name">
                    我，野比海皇，从今天开始开后宫
                </div>

                <div class="book-author">
                    作者：小说家
                </div>

            </div>


            <div class="book"
                 draggable="true"
                 data-id="2">

                <div class="book-cover cover2">
                    宝可梦
                </div>

                <div class="book-name">
                    宝可梦：赤红传
                </div>

                <div class="book-author">
                    作者：小说家
                </div>

            </div>


            <div class="book"
                 draggable="true"
                 data-id="3">

                <div class="book-cover cover3">
                    界囚
                </div>

                <div class="book-name">
                    界囚
                </div>

                <div class="book-author">
                    作者：小说家
                </div>

            </div>


            <div class="book"
                 draggable="true"
                 data-id="4">

                <div class="book-cover cover4">
                    新世界
                </div>

                <div class="book-name">
                    新世界
                </div>

                <div class="book-author">
                    作者：小说家
                </div>

            </div>


            <div class="book"
                 draggable="true"
                 data-id="5">

                <div class="book-cover cover5">
                    未命名
                </div>

                <div class="book-name">
                    未命名作品
                </div>

                <div class="book-author">
                    作者：小说家
                </div>

            </div>


            <div class="book"
                 draggable="true"
                 data-id="6">

                <div class="book-cover cover6">
                    草稿
                </div>

                <div class="book-name">
                    我的新小说
                </div>

                <div class="book-author">
                    作者：小说家
                </div>

            </div>

        </div>

    </main>


    <!-- =====================
         底部导航
    ====================== -->

    <nav class="bottom-nav">

        <div
            class="nav-item active"
            onclick="switchTab('shelf')">

            <div class="nav-icon">▦</div>

            <div>
                书架
            </div>

        </div>


        <div
            class="nav-item"
            onclick="switchTab('tools')">

            <div class="nav-icon">⚒</div>

            <div>
                工具
            </div>

        </div>


        <div
            class="nav-item"
            onclick="switchTab('my')">

            <div class="nav-icon">●</div>

            <div>
                我的
            </div>

        </div>

    </nav>

</div>


<!-- =========================
     更多菜单
========================= -->

<div
    class="menu-overlay"
    id="menuOverlay"
    onclick="closeMenu(event)">

    <div
        class="more-menu"
        onclick="event.stopPropagation()">


        <div class="menu-section">

            <div
                class="menu-item"
                onclick="newBook()">

                <span class="menu-icon">＋</span>

                <span>
                    新建作品
                </span>

            </div>


            <div
                class="menu-item"
                onclick="newGroup()">

                <span class="menu-icon">▦</span>

                <span>
                    新建分组
                </span>

            </div>

        </div>


        <div class="menu-divider"></div>


        <div class="menu-section">

            <div
                class="menu-item"
                onclick="openSettings()">

                <span class="menu-icon">⚙</span>

                <span>
                    书架设置
                </span>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     书架设置页面
========================= -->

<div
    class="page"
    id="settingsPage">


    <header class="page-header">

        <div
            class="back"
            onclick="closeSettings()">
            ‹
        </div>

        <div class="page-title">
            书架设置
        </div>

    </header>


    <div class="page-body">


        <div class="setting-card">

            <div class="setting-title">
                显示方式
            </div>


            <div
                class="setting-row"
                onclick="setView('grid')">

                <span>
                    网格
                </span>

                <span
                    class="setting-right"
                    id="gridCheck">
                    ✓
                </span>

            </div>


            <div
                class="setting-row"
                onclick="setView('list')">

                <span>
                    列表
                </span>

                <span
                    class="setting-right"
                    id="listCheck">
                </span>

            </div>

        </div>


        <div class="setting-card">

            <div class="setting-title">
                书架排序
            </div>


            <div
                class="setting-row"
                onclick="startSort()">

                <span>
                    自定义排序
                </span>

                <span class="setting-right">
                    ›
                </span>

            </div>


            <div
                class="setting-row"
                onclick="sortLatest()">

                <span>
                    最近阅读
                </span>

                <span class="setting-right">
                    ›
                </span>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     工具
========================= -->

<div
    class="page"
    id="toolsPage">


    <header class="page-header">

        <div class="page-title">
            工具
        </div>

    </header>


    <div class="page-body tools-page">

        <div class="tool-card">
            ✍️ 写作
            <small>
                创建和管理你的小说
            </small>
        </div>

        <div class="tool-card">
            🔎 搜索
            <small>
                搜索作品和章节
            </small>
        </div>

        <div class="tool-card">
            📊 数据
            <small>
                查看作品阅读数据
            </small>
        </div>

    </div>

</div>


<!-- =========================
     我的
========================= -->

<div
    class="page"
    id="myPage">


    <header class="page-header">

        <div class="page-title">
            我的
        </div>

    </header>


    <div class="page-body my-page">

        <div class="tool-card">
            👤 我的账号
        </div>

        <div class="tool-card">
            📚 我的作品
        </div>

        <div class="tool-card">
            ⚙️ 设置
        </div>

    </div>

</div>


<div
    class="sort-hint"
    id="sortHint">
    拖动小说调整顺序
</div>


<script>

/* =========================
   更多菜单
========================= */

function openMenu() {

    document
        .getElementById("menuOverlay")
        .classList.add("show");

}


function closeMenu(event) {

    if (
        !event ||
        event.target.id === "menuOverlay"
    ) {

        document
            .getElementById("menuOverlay")
            .classList.remove("show");

    }

}


/* =========================
   新建
========================= */

function newBook() {

    closeMenu();

    alert(
        "这里以后进入「新建作品」页面"
    );

}


function newGroup() {

    closeMenu();

    const name = prompt(
        "请输入新分组名称："
    );

    if (name) {

        alert(
            "已创建分组：「" +
            name +
            "」"
        );

    }

}


/* =========================
   设置
========================= */

function openSettings() {

    closeMenu();

    document
        .getElementById("settingsPage")
        .classList.add("show");

}


function closeSettings() {

    document
        .getElementById("settingsPage")
        .classList.remove("show");

}


/* =========================
   网格 / 列表
========================= */

function setView(type) {

    const grid =
        document.getElementById("bookGrid");

    if (type === "grid") {

        grid.style.display = "grid";

        document
            .getElementById("gridCheck")
            .innerText = "✓";

        document
            .getElementById("listCheck")
            .innerText = "";

    }

    if (type === "list") {

        grid.style.display = "flex";

        grid.style.flexDirection = "column";

        grid.style.gap = "10px";

        document
            .getElementById("gridCheck")
            .innerText = "";

        document
            .getElementById("listCheck")
            .innerText = "✓";

    }

}


/* =========================
   自定义排序
========================= */

function startSort() {

    closeSettings();

    document
        .getElementById("bookGrid")
        .classList.add("sort-mode");

    document
        .getElementById("sortHint")
        .classList.add("show");

    setTimeout(() => {

        document
            .getElementById("sortHint")
            .classList.remove("show");

    }, 2500);

}


/* =========================
   拖动排序
========================= */

let draggedBook = null;


document
    .querySelectorAll(".book")
    .forEach(book => {


        book.addEventListener(
            "dragstart",
            function() {

                draggedBook = this;

            }
        );


        book.addEventListener(
            "dragover",
            function(e) {

                e.preventDefault();

            }
        );


        book.addEventListener(
            "drop",
            function(e) {

                e.preventDefault();

                if (
                    draggedBook &&
                    draggedBook !== this
                ) {

                    const grid =
                        document.getElementById(
                            "bookGrid"
                        );

                    const books =
                        [...grid.children];

                    const from =
                        books.indexOf(
                            draggedBook
                        );

                    const to =
                        books.indexOf(this);


                    if (from < to) {

                        grid.insertBefore(
                            draggedBook,
                            this.nextSibling
                        );

                    } else {

                        grid.insertBefore(
                            draggedBook,
                            this
                        );

                    }

                }

            }
        );

    });


/* =========================
   最近阅读排序
========================= */

function sortLatest() {

    const grid =
        document.getElementById("bookGrid");

    const books =
        [...grid.children];

    books.reverse()
        .forEach(book =>
            grid.appendChild(book)
        );

}


/* =========================
   底部导航
========================= */

function switchTab(tab) {

    document
        .querySelectorAll(".nav-item")
        .forEach(item =>
            item.classList.remove("active")
        );


    document
        .querySelectorAll(".page")
        .forEach(page =>
            page.classList.remove("show")
        );


    if (tab === "shelf") {

        document
            .querySelector(".nav-item:nth-child(1)")
            .classList.add("active");

    }


    if (tab === "tools") {

        document
            .querySelector(".nav-item:nth-child(2)")
            .classList.add("active");

        document
            .getElementById("toolsPage")
            .classList.add("show");

    }


    if (tab === "my") {

        document
            .querySelector(".nav-item:nth-child(3)")
            .classList.add("active");

        document
            .getElementById("myPage")
            .classList.add("show");

    }

}

</script>

</body>
</html>
